<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Authorization — Rubika Agent</title><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#07080d;color:#f6f7fb;padding:20px}.card{max-width:700px;padding:30px;border:1px solid #272d3a;background:#10131b;border-radius:22px}a{color:#5ce1ff}</style></head><body><main class="card"><h1>TikTok authorization callback</h1><p id="status">Authorization response received. The secure token exchange is handled by the Rubika Agent backend.</p><p>Do not copy authorization codes or tokens into chat messages or public repositories.</p><p><a href="../../">Return to Rubika Agent</a></p><script>const q=new URLSearchParams(location.search);if(q.get("error"))document.getElementById("status").textContent="TikTok returned an authorization error: "+q.get("error")+". Please return to the app and try again.";else if(q.get("code"))document.getElementById("status").textContent="Authorization code received. The backend must exchange it securely before the account is connected.";</script></main></body></html>
