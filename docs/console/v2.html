<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کنسول Rubika-Agent</title>
<style>
:root{--bg:#060914;--bg2:#0d1328;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--stroke:rgba(255,255,255,.13);--txt:#eef2ff;--mut:#97a3c4;--acc:#7c5cff;--acc2:#22d3ee;--acc3:#f472b6;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--sh:0 24px 50px -22px rgba(0,0,0,.75);--r:20px;color-scheme:dark}
[data-theme=light]{--bg:#eceffa;--bg2:#fff;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.96);--stroke:rgba(30,40,90,.13);--txt:#141a33;--mut:#5b6685;--sh:0 22px 40px -24px rgba(40,50,120,.4);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:fl 18s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:var(--acc);top:-120px;right:-80px}
.o2{width:420px;height:420px;background:var(--acc2);bottom:-100px;left:-60px;animation-delay:-6s}
.o3{width:300px;height:300px;background:var(--acc3);top:40%;left:40%;opacity:.25;animation-delay:-11s}
[data-theme=light] .orb{opacity:.28}
@keyframes fl{to{transform:translate3d(60px,-50px,0) scale(1.15)}}
.floor{position:absolute;inset:auto -20% -8% -20%;height:55vh;background-image:linear-gradient(var(--stroke) 1px,transparent 1px),linear-gradient(90deg,var(--stroke) 1px,transparent 1px);background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);animation:flow 9s linear infinite;opacity:.55}
@keyframes flow{to{background-position:0 64px}}
#app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;height:100%;gap:16px;padding:16px}
#side{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--stroke);border-radius:26px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px}
.cw{width:34px;height:34px;perspective:240px;flex:none}
.cube{width:34px;height:34px;position:relative;transform-style:preserve-3d;animation:spin 12s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid var(--acc2);background:linear-gradient(135deg,rgba(124,92,255,.45),rgba(34,211,238,.3))}
.cube i:nth-child(1){transform:translateZ(17px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(17px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(17px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(17px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(17px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(17px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.brand b{font-size:16px;display:block}.brand small{color:var(--mut);font-size:11px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:transparent;border-radius:14px;cursor:pointer;color:var(--mut);text-align:right;position:relative;transition:.2s}
.nv span{width:22px;text-align:center;font-size:16px}
.nv:hover{background:var(--glass2);color:var(--txt);transform:translateX(-3px)}
.nv.on{color:var(--txt);background:linear-gradient(90deg,rgba(124,92,255,.28),rgba(34,211,238,.12));box-shadow:inset 0 0 0 1px var(--stroke),0 8px 24px -10px var(--acc)}
.nv.on::after{content:"";position:absolute;right:-12px;top:20%;bottom:20%;width:4px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc2)}
#main{display:flex;flex-direction:column;min-width:0;height:100%;gap:14px}
.top{display:flex;align-items:center;gap:12px;padding:6px 4px}
.top h1{font-size:22px;flex:1;background:linear-gradient(90deg,var(--txt),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);box-shadow:0 0 0 0 currentColor}
.dot.ok{background:var(--ok);animation:pl 2s infinite;color:var(--ok)}.dot.bad{background:var(--bad)}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}}
#view{flex:1;overflow-y:auto;padding:4px 6px 40px 4px;scroll-behavior:smooth}
#view>*{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden;margin-bottom:14px;transition:transform .18s ease,border-color .2s}
.grid .card{margin-bottom:0}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(124,92,255,.2),transparent 45%)}
.card>*{position:relative}
.card:hover{border-color:rgba(124,92,255,.5)}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stat .l{color:var(--mut);font-size:12px}.stat .v{font-size:30px;font-weight:800;margin:6px 0;background:linear-gradient(90deg,var(--txt),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--mut);font-size:12px;margin-top:3px}.mut{color:var(--mut)}
.btn{border:0;cursor:pointer;padding:9px 16px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#5b8cff);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px var(--acc);transition:.18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:translateY(0)}
.btn.g{background:var(--glass2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--stroke)}.btn.r{background:linear-gradient(135deg,var(--bad),#f43f5e);box-shadow:0 8px 20px -8px var(--bad)}.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:10px 12px;outline:0;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
select option{background:var(--bg2)}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}.row>.btn{flex:none}
.tw{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--glass2);text-align:right;padding:10px 12px;color:var(--mut);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--stroke);vertical-align:top;max-width:340px;overflow-wrap:anywhere}
tr:hover td{background:var(--glass)}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bd.ok{background:rgba(52,211,153,.16);color:var(--ok)}.bd.bad{background:rgba(251,113,133,.16);color:var(--bad)}.bd.warn{background:rgba(251,191,36,.16);color:var(--warn)}.bd.info{background:rgba(34,211,238,.16);color:var(--acc2)}.bd.mut{background:var(--glass2);color:var(--mut)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.bar{height:9px;border-radius:99px;background:var(--glass2);overflow:hidden}.bar i{display:block;height:100%;width:calc(var(--w)*1%);background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.br{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;margin:9px 0}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--acc2) calc(var(--p)*1%),var(--glass2) 0);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 0 24px -6px var(--acc2)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg2)}.ring b{position:relative}
.aic{display:flex;gap:16px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:12px;background:var(--glass2);border:1px solid var(--stroke)}.chip b{margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:8px 16px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;color:var(--mut)}.tabs button.on{background:linear-gradient(135deg,var(--acc),#5b8cff);color:#fff;border-color:transparent}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
.t{padding:11px 20px;border-radius:14px;background:var(--bg2);border:1px solid var(--stroke);box-shadow:var(--sh);animation:up .3s both}.t.ok{border-color:var(--ok)}.t.bad{border-color:var(--bad)}
#modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(3,6,18,.6);backdrop-filter:blur(6px);padding:16px}#modal.on{display:grid}
.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--stroke);border-radius:24px;padding:22px;box-shadow:var(--sh);animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:perspective(700px) rotateX(14deg) scale(.94)}}
.sk{height:110px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,var(--glass),var(--glass2),var(--glass));background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
code{background:var(--glass2);padding:2px 7px;border-radius:7px;direction:ltr;display:inline-block;font-size:12px}
.lock{opacity:.7}
@media(max-width:880px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:10px;gap:10px}#side{flex-direction:row;overflow-x:auto;padding:8px;border-radius:20px}.brand{display:none}.nv{width:auto;white-space:nowrap;padding:9px 12px}.nv.on::after{display:none}.nv:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="floor"></div></div>
<div id="app">
<aside id="side"><div class="brand"><div class="cw"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div><b>Rubika-Agent</b><small>کنسول مالک · نسخهٔ ۲</small></div></div><nav id="nav" style="display:contents"></nav></aside>
<section id="main"><div class="top"><h1 id="ttl"></h1><span class="s" id="cs"></span><span class="dot" id="dot"></span><button class="btn g sm" data-a="theme">◐ تم</button></div><div id="view"></div></section>
</div>
<div id="toast"></div><div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
(()=>{"use strict";
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch{return ''}};
const S={base:LS('rc_base'),token:LS('rc_token')};
if(LS('rc_theme'))document.documentElement.dataset.theme=LS('rc_theme');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>Number.isFinite(+v)?+v:0;
const $=s=>document.querySelector(s),val=id=>{const e=document.getElementById(id);return e?e.value:''};
const fmt=s=>{if(!s)return '—';const t=String(s);const d=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(t)?t:t.replace(' ','T')+'Z');return isNaN(d)?E(t):d.toLocaleString('fa-IR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const cut=(s,n=110)=>{s=String(s??'');return E(s.length>n?s.slice(0,n)+'…':s)};
const ST={sent:'ارسال‌شده',queued:'در انتظار',failed:'ناموفق',uncertain:'نامشخص',skipped:'ردشده',processing:'در پردازش',discovered:'کشف‌شده',filtered:'فیلتر',downloading:'دانلود',ready:'آماده',sending:'در ارسال',pending:'در انتظار بررسی',approved:'تأییدشده',rejected:'ردشده',needs_review:'نیاز به بررسی',running:'در حال اجرا',done:'انجام‌شد',info:'اطلاع',success:'موفق',error:'خطا',ai_success:'AI موفق',ai_error:'AI خطا',test:'تست',production:'تولید',owner:'مالک',viewer:'بیننده'};
const BC={sent:'ok',ready:'ok',success:'ok',done:'ok',approved:'ok',ai_success:'ok',queued:'info',discovered:'info',running:'info',processing:'info',downloading:'info',sending:'info',pending:'warn',needs_review:'warn',uncertain:'warn',warning:'warn',filtered:'mut',skipped:'mut',info:'mut',debug:'mut',rejected:'bad',failed:'bad',error:'bad',ai_error:'bad',owner:'info',test:'info',production:'warn'};
const badge=s=>`<span class="bd ${BC[s]||'mut'}">${E(ST[s]||s||'—')}</span>`;
const ERR={not_found:'این بخش هنوز در Worker فعال نیست',item_locked:'آیتم قفل است (در حال ارسال یا ارسال‌شده)',last_enabled_owner:'آخرین مالک فعال را نمی‌شود برداشت',version_conflict:'قوانین همزمان تغییر کرده؛ دوباره بارگذاری شد',unauthorized:'توکن نادرست است',source_already_exists:'این منبع قبلاً هست',channel_already_exists:'این کانال قبلاً هست',owner_already_exists:'این مالک قبلاً هست',link_already_saved:'این لینک قبلاً ذخیره شده',only_official_mob_x_status_links_allowed:'فقط لینک رسمی پست mobgamesstudios پذیرفته می‌شود',invalid_state_for_action:'در وضعیت فعلی این کار ممکن نیست',only_single_select_allowed:'فقط یک دستور SELECT مجاز است',console_db_error:'خطای دیتابیس',no_base:'اول آدرس Worker و توکن را در «اتصال» ذخیره کن'};
const em=e=>ERR[e.message]||ERR[e.data&&e.data.error]||('خطا: '+e.message);
function toast(m,k){const t=document.createElement('div');t.className='t '+(k||'');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),4200)}
async function api(p,o={}){if(!S.base)throw new Error('no_base');let r;try{r=await fetch(S.base.replace(/\/+$/,'')+p,{method:o.method||'GET',headers:{authorization:'Bearer '+S.token,...(o.body?{'content-type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined})}catch{throw new Error('network_or_cors')}let j=null;try{j=await r.json()}catch{}if(!r.ok||!j||j.ok===false){const e=new Error((j&&j.error)||'http_'+r.status);e.status=r.status;e.data=j;throw e}return j}
const safe=async(p,o)=>{try{return await api(p,o)}catch(e){return{ok:false,error:e.message}}};
const rowsOf=r=>(r.rows||[]).map(a=>Object.fromEntries(r.columns.map((c,i)=>[c,a[i]])));
const tbl=(cols,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${empty||'موردی نیست'}</div>`;
const card=(t,b,x)=>`<div class="card ${x||''}">${t?`<h3>${t}</h3>`:''}${b}</div>`;
const opts=(list,sel)=>list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:(ST[o]||o);return `<option value="${E(v)}"${String(v)===String(sel)?' selected':''}>${E(l)}</option>`}).join('');
const A={},V={};
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
A.close=closeModal;
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.preventDefault();Promise.resolve(A[el.dataset.a](el,e)).catch(x=>toast(em(x),'bad'))}});
A.theme=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;LS('rc_theme',t)};

const NAV=[['dash','داشبورد','◈'],['items','آیتم‌ها','▤'],['queue','صف انتشار','☰'],['hist','تاریخچه و لاگ','◷'],['ai','تماس‌های AI','✦'],['src','منابع و لینک‌ها','⎈'],['owners','مالک‌ها','♛'],['rules','قوانین','⚙'],['chan','کانال‌ها','⌁'],['jobs','کارها','⚡'],['d1','دیتابیس','⛁'],['soon','به‌زودی','◌'],['set','اتصال','⚿']];
$('#nav').innerHTML=NAV.map(n=>`<button class="nv" data-id="${n[0]}" data-a="go"><span>${n[2]}</span>${n[1]}</button>`).join('');
let cur='dash';
A.go=el=>{location.hash='#/'+el.dataset.id};
async function go(id){if(!V[id])id='dash';cur=id;document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.id===id));$('#ttl').textContent=NAV.find(n=>n[0]===id)[1];const v=$('#view');v.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';try{const h=await V[id]();if(cur!==id)return;v.innerHTML=h;v.scrollTop=0;fx()}catch(e){if(cur!==id)return;v.innerHTML=card('⚠ خطا',`<div class="empty">${E(em(e))}<br><br><button class="btn g" data-a="reload">تلاش دوباره</button></div>`)}}
A.reload=()=>go(cur);
window.addEventListener('hashchange',()=>go(location.hash.replace('#/','')));
function fx(){document.querySelectorAll('[data-n]').forEach(el=>{const t=N(el.dataset.n),s=performance.now();const f=n=>{const p=Math.min(1,(n-s)/900);el.textContent=Math.round(t*(1-Math.pow(1-p,3))).toLocaleString('fa-IR');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.setProperty('--w',i.dataset.w)),60)}
const fine=matchMedia('(pointer:fine)').matches;
document.addEventListener('pointermove',e=>{if(!fine)return;const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');if(c.classList.contains('tilt')){c.style.setProperty('--rx',((y-.5)*-9)+'deg');c.style.setProperty('--ry',((x-.5)*9)+'deg')}});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.tilt');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});

/* ---------- داشبورد ---------- */
V.dash=async()=>{
const [st,q,g,o]=await Promise.all([safe('/api/status'),safe('/api/brain/owner-console/queue-summary'),safe('/api/brain/ai-provider/status?provider=groq'),safe('/api/brain/ai-provider/status?provider=openrouter')]);
setDot(st.ok===true);
const items=Array.isArray(st.item_counts)?st.item_counts:[],tot=items.reduce((a,r)=>a+N(r.total),0),qc=q.queue_counts||{};
const stat=(l,v,s)=>`<div class="card stat tilt"><div class="l">${l}</div><div class="v" ${typeof v==='number'?`data-n="${v}">0`:`>${E(v)}`}</div><div class="s">${s||''}</div></div>`;
const ring=(n,d)=>{if(!d||d.ok!==true)return card(n,'<div class="empty">در دسترس نیست</div>');const u=N(d.calls_used),l=N(d.daily_limit),p=l?Math.min(100,Math.round(u/l*100)):0;return `<div class="card tilt aic"><div class="ring" style="--p:${p}"><b>${p.toLocaleString('fa-IR')}٪</b></div><div><h3>${n}</h3><div class="s">${d.cooldown_active?'توقف موقت':d.ready?'آماده':'غیرآماده'}</div><div class="s">${u.toLocaleString('fa-IR')} از ${l.toLocaleString('fa-IR')} · مانده ${N(d.remaining).toLocaleString('fa-IR')}</div><div class="s">${E(d.last_error_code||'بدون خطا')}</div></div></div>`};
const runs=Array.isArray(st.recent_runs)?st.recent_runs:[];
return `<div class="grid g4">${stat('وضعیت عامل',st.ok?(st.agent&&st.agent.enabled===1?'روشن':'خاموش'):'نامعلوم',st.ok?'Worker در دسترس':'Worker پاسخ نمی‌دهد')}${stat('کل آیتم‌ها',tot,'در دیتابیس')}${stat('ارسال امروز',N(q.sent_today),'UTC')}${stat('در انتظار صف',N(qc.queued),'ناموفق: '+N(qc.failed))}</div>

let DQ={sql:'SELECT * FROM items ORDER BY discovered_at DESC LIMIT 20',res:null};
V.d1=async()=>{const t=await api('/api/console/d1/tables');
return card('جدول‌ها',`<div class="chips">${(t.items||[]).map(x=>`<button class="chip" style="cursor:pointer" data-a="dT" data-n="${E(x.name)}" title="${E(x.columns.map(c=>c.name).join(', '))}">${E(x.name)}<b>${N(x.row_count).toLocaleString('fa-IR')}</b></button>`).join('')}</div>`)+card('پرس‌وجو (فقط SELECT)',`<textarea id="d_q" rows="3" dir="ltr" spellcheck="false">${E(DQ.sql)}</textarea><div class="row" style="margin-top:10px"><button class="btn" data-a="dRun">اجرا</button></div>`)+`<div id="d_r">${DQ.res||''}</div>`};
A.dT=el=>{document.getElementById('d_q').value='SELECT * FROM "'+el.dataset.n+'" LIMIT 20'};
A.dRun=async()=>{DQ.sql=val('d_q');const r=await api('/api/console/d1/query',{method:'POST',body:{sql:DQ.sql}});DQ.res=card(`${r.rows.length} ردیف · ${N(r.duration_ms)}ms`,tbl(r.columns.map((c,i)=>[E(c),x=>cut(x[i],140)]),r.rows,'نتیجه‌ای نیست'));document.getElementById('d_r').innerHTML=DQ.res};

/* ---------- به‌زودی ---------- */
V.soon=async()=>`<div class="grid g2">${[['☁','مدیریت Mega','فضا، فایل‌ها و پاک‌سازی'],['🗓','زمان‌بندی انتشار','برنامهٔ ارسال و تاریخ شروع هر کانال تیک‌تاک'],['⌥','ویرایش فایل‌های ریپو','ویرایش امن از طریق GitHub با تأیید'],['✎','درخواست قابلیت','ثبت ایده برای نسخه‌های بعد']].map(x=>`<div class="card tilt lock"><h3>${x[0]} ${x[1]} <span class="bd mut">به‌زودی</span></h3><div class="s">${x[2]}</div></div>`).join('')}</div>`;

/* ---------- اتصال ---------- */
V.set=async()=>card('اتصال به Worker',`<label>آدرس Worker</label><input id="s_b" dir="ltr" placeholder="https://…workers.dev" value="${E(S.base)}"><label>توکن AGENT_API_TOKEN</label><input id="s_t" type="password" dir="ltr" autocomplete="off" placeholder="${S.token?'ذخیره شده — برای تغییر بنویس':'توکن'}"><div class="s">توکن فقط در همین مرورگر ذخیره می‌شود و هیچ‌جا نمایش داده نمی‌شود. اول «ذخیره» را بزن، بعد «آزمایش».</div><div class="row" style="margin-top:14px"><button class="btn" data-a="sSave">ذخیره</button><button class="btn g" data-a="sTest">آزمایش اتصال</button></div><div id="s_o" class="chips" style="margin-top:14px"></div>`);
A.sSave=()=>{S.base=val('s_b').trim().replace(/\/+$/,'');LS('rc_base',S.base);const t=val('s_t').trim();if(t){S.token=t;LS('rc_token',t)}document.getElementById('s_t').value='';toast('ذخیره شد','ok')};
A.sTest=async()=>{const o=[];try{const r=await fetch(S.base+'/api/status');o.push(['اتصال و CORS',r.ok])}catch{o.push(['اتصال و CORS',false])}try{await api('/api/console/audit?limit=1');o.push(['توکن Bearer',true])}catch(e){o.push(['توکن Bearer',false])}const st=await safe('/api/status');o.push(['وضعیت Worker',st.ok===true]);setDot(st.ok===true);document.getElementById('s_o').innerHTML=o.map(x=>`<div class="chip">${x[0]} ${x[1]?'<span class="bd ok">سبز</span>':'<span class="bd bad">قرمز</span>'}</div>`).join('')};

if(!S.base||!S.token)location.hash='#/set';
go(location.hash.replace('#/','')||'dash');
if(S.base)safe('/api/status').then(r=>setDot(r.ok===true));
})();
</script>
