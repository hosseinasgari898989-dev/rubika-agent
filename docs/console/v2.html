<script>
(()=>{"use strict";
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch{return ''}};
const S={base:LS('rc_base'),token:LS('rc_token')};
if(LS('rc_theme'))document.documentElement.dataset.theme=LS('rc_theme');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const cut=(s,n=110)=>{s=String(s??'');return E(s.length>n?s.slice(0,n)+'…':s)};

const BC={sent:'ok',ready:'ok',success:'ok',done:'ok',approved:'ok',ai_success:'ok',queued:'info',discovered:'info',running:'info',processing:'info',downloading:'info',sending:'info',pending:'warn',needs_review:'warn',uncertain:'warn',warning:'warn',filtered:'mut',skipped:'mut',info:'mut',debug:'mut',rejected:'bad',failed:'bad',error:'bad',ai_error:'bad',owner:'info',test:'info',production:'warn'};

A.oAdd=async()=>{await api('/api/console/owners',{method:'POST',body:{chat_id:val('o_c').trim(),label:val('o_l').trim(),role:val('o_r')}});toast('افزوده شد','ok');go('owners')};

A.oRole=async el=>{const previous=el.dataset.current||el.value;try{await api('/api/console/owners',{method:'POST',body:{id:N(el.dataset.id),role:el.value}});el.dataset.current=el.value;toast('نقش تغییر کرد','ok');go('owners')}catch(e){el.value=previous;throw e}};
A.oDel=async el=>{if(!confirm('این مالک حذف شود؟'))return;await api('/api/console/owners/'+N(el.dataset.id),{method:'DELETE'});toast('حذف شد','ok');go('owners')};
A.oInv=async()=>{const r=await api('/api/console/owners/invite',{method:'POST',body:{}});modal(`<h3>کد دعوت</h3><p class="s" style="margin:8px 0">این کد فقط یک‌بار نمایش داده می‌شود و تا ${fmt(r.expires_at)} معتبر است.</p><div class="card" style="text-align:center;font-size:20px"><code>${E(r.invite_code)}</code></div><div class="row"><button class="btn" data-a="copy" data-v="${E(r.invite_code)}">کپی</button><button class="btn g" data-a="close">بستن</button></div>`)};
A.copy=async el=>{try{await navigator.clipboard.writeText(el.dataset.v);toast('کپی شد','ok')}catch{toast('کپی نشد؛ دستی کپی کن','bad')}};

/* ---------- قوانین ---------- */
let RU={version:0,rules:{}};
const RF=[['daily_success_cap','سقف موفق روزانه',0,50],['daily_edit_count','ویرایش روزانه',0,50],['mob_posts_per_run','پست Mob در هر اجرا',0,10],['freshness_hours','تازگی (ساعت)',1,168],['ai_daily_limit_groq','سهمیهٔ Groq',0,5000],['ai_daily_limit_openrouter','سهمیهٔ OpenRouter',0,5000],['caption_max_chars','حداکثر نویسهٔ کپشن',50,4000]];
V.rules=async()=>{const r=await api('/api/console/rules');RU={version:r.version,rules:r.rules||{}};const x=RU.rules,qh=x.quiet_hours||{};
return card(`قوانین نسخهٔ ${N(r.version)}`,`<div class="grid g4" style="margin-top:6px">${RF.map(f=>`<div><label>${f[1]}</label><input type="number" id="r_${f[0]}" min="${f[2]}" max="${f[3]}" value="${N(x[f[0]])}"></div>`).join('')}</div><div class="grid g4"><div><label>ترتیب AI</label><select id="r_ord">${opts([['groq,openrouter','Groq سپس OpenRouter'],['openrouter,groq','OpenRouter سپس Groq'],['groq','فقط Groq'],['openrouter','فقط OpenRouter']],(x.ai_provider_order||[]).join(','))}</select></div><div><label>ساعت سکوت از</label><input type="time" id="r_qs" value="${E(qh.start||'00:30')}"></div><div><label>تا</label><input type="time" id="r_qe" value="${E(qh.end||'07:00')}"></div><div><label>پنجرهٔ خلاصه (UTC)</label><input type="time" id="r_dg" value="${E(x.digest_window_utc||'07:05')}"></div></div><label>شروع اخبار Mob (ISO، خالی = بدون محدودیت)</label><input id="r_mob" dir="ltr" value="${E(x.mob_since_cutoff||'')}"><label><input type="checkbox" id="r_tr" ${x.translate_enabled?'checked':''}> ترجمهٔ خودکار فعال باشد</label><div class="row" style="margin-top:14px"><span class="bd warn lock">انتشار: غیرفعال (قفل)</span><span class="bd info lock">فقط کانال تست (قفل)</span></div><div class="row" style="margin-top:16px"><button class="btn" data-a="rSave">ذخیره</button></div>`)};
A.rSave=async()=>{const rules={...RU.rules};for(const f of RF)rules[f[0]]=N(val('r_'+f[0]));rules.ai_provider_order=val('r_ord').split(',');rules.quiet_hours={start:val('r_qs'),end:val('r_qe')};rules.digest_window_utc=val('r_dg');rules.mob_since_cutoff=val('r_mob').trim();rules.translate_enabled=document.getElementById('r_tr').checked;
try{await api('/api/console/rules',{method:'PUT',body:{base_version:RU.version,rules}});toast('ذخیره شد','ok')}catch(e){toast(em(e),'bad')}go('rules')};

/* ---------- کانال‌ها ---------- */
V.chan=async()=>{const r=await api('/api/console/channels');
return card('افزودن کانال مقصد',`<div class="row"><div><label>شناسهٔ کانال</label><input id="c_i" dir="ltr" placeholder="@channel"></div><div><label>برچسب</label><input id="c_l"></div><div><label>نقش</label><select id="c_r">${opts(['test','production'])}</select></div><button class="btn" data-a="cAdd">افزودن</button></div><div class="s">کانال «تولید» همیشه غیرفعال ثبت می‌شود؛ انتشار فقط به کانال تست است.</div>`)+card('',tbl([['برچسب',x=>E(x.label)],['شناسه',x=>`<code>${E(x.rubika_channel_id)}</code>`],['نقش',x=>badge(x.role)],['فعال',x=>N(x.enabled)?badge('done').replace('انجام‌شد','فعال'):badge('skipped').replace('ردشده','غیرفعال')],['ساخت',x=>fmt(x.created_at)],['',x=>`<button class="btn r sm" data-a="cDel" data-id="${x.id}">حذف</button>`]],r.items||[]))};
A.cAdd=async()=>{await api('/api/console/channels',{method:'POST',body:{rubika_channel_id:val('c_i').trim(),label:val('c_l').trim(),role:val('c_r')}});toast('افزوده شد','ok');go('chan')};
A.cDel=async el=>{if(!confirm('این کانال حذف شود؟'))return;await api('/api/console/channels/'+N(el.dataset.id),{method:'DELETE'});toast('حذف شد','ok');go('chan')};

/* ---------- کارها ---------- */
const JT=[['queue_intake_dry_run','بررسی آزمایشی ورود به صف'],['ai_health_check','بررسی سلامت AI'],['log_zip','فشرده‌سازی لاگ‌ها'],['d1_backup','بکاپ دیتابیس'],['mob_x_link','لینک X خبر Mob'],['requeue_stuck','بازگرداندن گیرکرده‌ها']];
V.jobs=async()=>{const r=await api('/api/console/jobs?limit=30');
return card('ثبت کار جدید',`<div class="row"><div><label>نوع کار</label><select id="j_t">${opts(JT)}</select></div><button class="btn" data-a="jAdd">ثبت در صف</button><button class="btn g" data-a="reload">↻ تازه‌سازی</button></div><div class="s">این‌جا فقط درخواست ثبت می‌شود؛ اجرا را موتور کارها در مرحلهٔ بعد انجام می‌دهد.</div>`)+card('',tbl([['شناسه',x=>`<code>${cut(x.id,16)}</code>`],['نوع',x=>E((JT.find(t=>t[0]===x.type)||[,x.type])[1])],['وضعیت',x=>badge(x.status==='queued'?'queued':x.status)],['پیشرفت',x=>`<div class="bar" style="min-width:90px"><i data-w="${N(x.progress)}"></i></div>`],['ثبت',x=>fmt(x.created_at)],['خطا',x=>E(x.error||'—')]],r.items||[]))};
A.jAdd=async()=>{await api('/api/console/jobs',{method:'POST',body:{type:val('j_t')}});toast('ثبت شد','ok');go('jobs')};

/* ---------- دیتابیس ---------- */

V.d1=async()=>{const t=await api('/api/console/d1/tables');
return card('جدول‌ها',`<div class="chips">${(t.items||[]).map(x=>`<button class="chip" style="cursor:pointer" data-a="dT" data-n="${E(x.name)}" title="${E(x.columns.map(c=>c.name).join(', '))}">${E(x.name)}<b>${N(x.row_count).toLocaleString('fa-IR')}</b></button>`).join('')}</div>`)+card('پرس‌وجو (فقط SELECT)',`<textarea id="d_q" rows="3" dir="ltr" spellcheck="false">${E(DQ.sql)}</textarea><div class="row" style="margin-top:10px"><button class="btn" data-a="dRun">اجرا</button></div>`)+`<div id="d_r">${DQ.res||''}</div>`};
A.dT=el=>{document.getElementById('d_q').value='SELECT * FROM "'+el.dataset.n+'" LIMIT 20'};
A.dRun=async()=>{DQ.sql=val('d_q');const r=await api('/api/console/d1/query',{method:'POST',body:{sql:DQ.sql}});DQ.res=card(`${r.rows.length} ردیف · ${N(r.duration_ms)}ms`,tbl(r.columns.map((c,i)=>[E(c),x=>cut(x[i],140)]),r.rows,'نتیجه‌ای نیست'));document.getElementById('d_r').innerHTML=DQ.res};

/* ---------- به‌زودی ---------- */
V.soon=async()=>`<div class="grid g2">${[['☁','مدیریت Mega','فضا، فایل‌ها و پاک‌سازی'],['🗓','زمان‌بندی انتشار','برنامهٔ ارسال و تاریخ شروع هر کانال تیک‌تاک'],['⌥','ویرایش فایل‌های ریپو','ویرایش امن از طریق GitHub با تأیید'],['✎','درخواست قابلیت','ثبت ایده برای نسخه‌های بعد']].map(x=>`<div class="card tilt lock"><h3>${x[0]} ${x[1]} <span class="bd mut">به‌زودی</span></h3><div class="s">${x[2]}</div></div>`).join('')}</div>`;

/* ---------- اتصال ---------- */
V.set=async()=>card('اتصال به Worker',`<label>آدرس Worker</label><input id="s_b" dir="ltr" placeholder="https://…workers.dev" value="${E(S.base)}"><label>توکن AGENT_API_TOKEN</label><input id="s_t" type="password" dir="ltr" autocomplete="off" placeholder="${S.token?'ذخیره شده — برای تغییر بنویس':'توکن'}"><div class="s">توکن فقط در همین مرورگر ذخیره می‌شود و هیچ‌جا نمایش داده نمی‌شود. اول «ذخیره» را بزن، بعد «آزمایش».</div><div class="row" style="margin-top:14px"><button class="btn" data-a="sSave">ذخیره</button><button class="btn g" data-a="sTest">آزمایش اتصال</button></div><div id="s_o" class="chips" style="margin-top:14px"></div>`);
A.sSave=()=>{S.base=val('s_b').trim().replace(/\/+$/,'');LS('rc_base',S.base);const t=val('s_t').trim();if(t){S.token=t;LS('rc_token',t)}document.getElementById('s_t').value='';toast('ذخیره شد','ok')};
A.sTest=async()=>{const o=[];try{const r=await fetch(S.base+'/api/status');o.push(['اتصال و CORS',r.ok])}catch{o.push(['اتصال و CORS',false])}try{await api('/api/console/audit?limit=1');o.push(['توکن Bearer',true])}catch(e){o.push(['توکن Bearer',false])}const st=await safe('/api/status');o.push(['وضعیت Worker',st.ok===true]);setDot(st.ok===true);document.getElementById('s_o').innerHTML=o.map(x=>`<div class="chip">${x[0]} ${x[1]?'<span class="bd ok">سبز</span>':'<span class="bd bad">قرمز</span>'}</div>`).join('')};

window.RC={V,A,S,api,safe,card,tbl,opts,badge,E,N,val,fmt,cut,toast,em,modal,closeModal,go,NAV,ST,BC,get cur(){return cur}};
if(!S.base||!S.token)location.hash='#/set';
go(location.hash.replace('#/','')||'dash');
if(S.base)safe('/api/status').then(r=>setDot(r.ok===true));
})();
</script>
<script id="rc-ext">/* Web console v2 extension (2026-10-27). Needs window.RC exposed by v2.html.
   Source of truth for the inline <script id="rc-ext"> block in v2.html. Uses only existing /api/console/* endpoints. */
(()=>{"use strict";
const R=window.RC;if(!R)return;
const {V,A,api,safe,card,tbl,opts,badge,E,N,val,fmt,cut,toast,modal,closeModal,NAV,ST,BC}=R;
Object.assign(ST,{confirmed:'تأییدشده توسط مالک',ready_for_review:'آماده برای بازبینی'});
Object.assign(BC,{confirmed:'info',ready_for_review:'warn'});
const toTeh=t=>{const m=/^(\d\d):(\d\d)$/.exec(t||'');if(!m)return '—';const x=(+m[1]*60+ +m[2]+210)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};

/* ---------- قوانین / تنظیمات (هم‌قرارداد با PV) ---------- */
const RF=[['daily_success_cap','سقف موفق روزانه',0,50],['daily_edit_count','تعداد ویرایش روزانه',0,50],['mob_posts_per_run','پست Mob در هر اجرا',0,10],['freshness_hours','تازگی (ساعت)',1,168],['ai_daily_limit_groq','سهمیهٔ Groq',0,5000],['ai_daily_limit_openrouter','سهمیهٔ OpenRouter',0,5000],['caption_max_chars','حداکثر نویسهٔ کپشن',50,4000]];
let RU={version:0,rules:{}};
V.rules=async()=>{
const [r,ch]=await Promise.all([api('/api/console/rules'),safe('/api/console/channels')]);
RU={version:r.version,rules:r.rules||{}};const x=RU.rules,q=x.quiet_hours||{},qs=q.start||'00:30',qe=q.end||'07:00',dg=x.digest_window_utc||'07:05';
const chs=ch.items||[],test=chs.filter(c=>c.role==='test'&&N(c.enabled)),prod=chs.filter(c=>c.role==='production');
const num=f=>`<div><label>${f[1]}</label><input type="number" id="r_${f[0]}" min="${f[2]}" max="${f[3]}" value="${N(x[f[0]])}"></div>`;
const quick=(f,l)=>`<div class="row" style="margin-top:8px">${l.map(v=>`<button class="btn g sm" data-a="pSet" data-f="${f}" data-v="${v}">${v}</button>`).join('')}</div>`;
return card(`تنظیمات اصلی · نسخهٔ ${N(r.version)}`,`<div class="grid g2"><div>${num(RF[0])}${quick(RF[0][0],[4,7,10])}</div><div>${num(RF[1])}${quick(RF[1][0],[4,6,10])}</div></div><div class="s" style="margin-top:10px">مقدار فقط با دکمهٔ «ذخیره» اعمال می‌شود. شمارش روزانه به UTC است.</div>`)
+card('ساعت سکوت (فقط نمایش؛ تغییر با مجوز مالک)',`<div class="chips"><div class="chip">UTC <b>${E(qs)}</b> تا <b>${E(qe)}</b></div><div class="chip">تهران <b>${toTeh(qs)}</b> تا <b>${toTeh(qe)}</b></div>${q.enabled===false?'<span class="bd warn">غیرفعال</span>':'<span class="bd ok">فعال</span>'}</div><div class="s">تهران = UTC+۳:۳۰ ثابت. پنجرهٔ خلاصه: ${E(dg)} UTC (${toTeh(dg)} تهران).</div>`)
+card('مقصد انتشار',`<div class="chips"><div class="chip"><b>TEST</b> ${test.length?E(test.map(c=>c.label).join('، ')):'<span class="mut">کانال فعالی نیست</span>'}<span class="bd ok">فعال</span></div><div class="chip"><b>MAIN</b><span class="bd bad lock">قفل</span></div></div><div class="s">کانال اصلی قفل است و فقط با تأیید روشن مالک باز می‌شود؛ از این صفحه قابل تغییر نیست (${prod.length?prod.length+' کانال اصلی ثبت‌شده، غیرفعال':'کانال اصلی ثبت نشده'}).</div>`)
+card('محدودیت‌ها و ترجمه',`<div class="grid g4">${RF.slice(2).map(num).join('')}</div><div class="grid g4"><div><label>ترتیب AI</label><select id="r_ord">${opts([['groq,openrouter','Groq سپس OpenRouter'],['openrouter,groq','OpenRouter سپس Groq'],['groq','فقط Groq'],['openrouter','فقط OpenRouter']],(x.ai_provider_order||[]).join(','))}</select></div></div><label>شروع اخبار Mob (ISO، خالی = بدون محدودیت)</label><input id="r_mob" dir="ltr" value="${E(x.mob_since_cutoff||'')}"><label><input type="checkbox" id="r_tr" ${x.translate_enabled?'checked':''}> ترجمهٔ خودکار فعال باشد</label><div class="row" style="margin-top:14px"><span class="bd warn lock">انتشار: غیرفعال (قفل)</span><span class="bd info lock">فقط کانال تست (قفل)</span></div><div class="row" style="margin-top:16px"><button class="btn" data-a="rSave">ذخیره</button></div>`)};
A.pSet=el=>{document.getElementById('r_'+el.dataset.f).value=el.dataset.v};
A.rSave=async()=>{const rules={...RU.rules};
for(const f of RF){const v=Number(val('r_'+f[0]));if(!Number.isInteger(v)||v<f[2]||v>f[3])return toast('«'+f[1]+'» باید عددی بین '+f[2]+' و '+f[3]+' باشد','bad');rules[f[0]]=v}
rules.ai_provider_order=val('r_ord').split(',');rules.mob_since_cutoff=val('r_mob').trim();rules.translate_enabled=document.getElementById('r_tr').checked;
try{await api('/api/console/rules',{method:'PUT',body:{base_version:RU.version,rules}});toast('ذخیره شد','ok')}catch(e){toast(e.message==='version_conflict'?'قوانین هم‌زمان تغییر کرده؛ دوباره بارگذاری شد':'خطا: '+e.message,'bad')}
R.go(R.cur)};

/* ---------- حالت فوری (فقط لینک رسمی Mob X؛ فقط کانال تست) ---------- */
const INS={link:null};
V.inst=async()=>{
const [l,j]=await Promise.all([safe('/api/console/links'),safe('/api/console/jobs?limit=100')]);
const jobBy={};for(const x of (j.items||[]))if(x.panel_link_id!=null)jobBy[x.panel_link_id]=x;
const step2=INS.link?card('مرحلهٔ ۲ · تأیید',`<div class="s">این لینک است؟</div><div style="margin:8px 0"><code>${E(INS.link.url)}</code></div><div class="row"><button class="btn" data-a="insOk" data-id="${N(INS.link.id)}">✅ تأیید و شروع</button><button class="btn g" data-a="insNo" data-id="${N(INS.link.id)}">✖ لغو</button></div>`):'';
const act=x=>{if(x.status==='pending')return `<button class="btn sm" data-a="insOk" data-id="${x.id}">تأیید</button> <button class="btn g sm" data-a="insNo" data-id="${x.id}">لغو</button>`;const jb=jobBy[x.id];return jb?`<button class="btn g sm" data-a="jView" data-id="${E(jb.id)}">جزئیات کار</button>`:'—'};
return card('حالت فوری · فقط کانال تست',`<div class="s">فقط پست رسمی <code>x.com/mobgamesstudios/status/…</code>. ذخیره → تأیید → پردازش → پیش‌نمایش در PV → تأیید شما در PV → ارسال به کانال تست (با رعایت ساعت سکوت و سقف روزانه). انتشار در کانال اصلی وجود ندارد.</div><div class="row" style="margin-top:10px"><div><label>مرحلهٔ ۱ · لینک پست</label><input id="ins_u" dir="ltr" placeholder="https://x.com/mobgamesstudios/status/…"></div><button class="btn" data-a="insAdd">ذخیره و بررسی</button></div>`)
+step2
+card('لینک‌های اخیر',l.ok===false?`<div class="empty">${E(l.error)}</div>`:tbl([['لینک',x=>`<code>${E(x.url)}</code>`],['وضعیت لینک',x=>badge(x.status)],['وضعیت کار',x=>jobBy[x.id]?badge(jobBy[x.id].status):'—'],['ذخیره',x=>fmt(x.created_at)],['',act]],l.items||[],'لینکی نیست'))};
A.insAdd=async()=>{const u=val('ins_u').trim();if(!u)return toast('لینک را بنویس','bad');const r=await api('/api/console/links',{method:'POST',body:{url:u}});INS.link=r.link;toast('ذخیره شد؛ تأیید کن','ok');R.go('inst')};
A.insOk=async el=>{await api('/api/console/links/'+N(el.dataset.id)+'/confirm',{method:'POST',body:{}});INS.link=null;toast('تأیید شد؛ کار ثبت شد','ok');R.go('inst')};
A.insNo=async el=>{await api('/api/console/links/'+N(el.dataset.id)+'/cancel',{method:'POST',body:{}});INS.link=null;toast('لغو شد','ok');R.go('inst')};

/* ---------- کارها ---------- */
const JT=[['queue_intake_dry_run','بررسی آزمایشی ورود به صف'],['ai_health_check','بررسی سلامت AI'],['log_zip','فشرده‌سازی لاگ‌ها'],['d1_backup','بکاپ دیتابیس'],['requeue_stuck','بازگرداندن گیرکرده‌ها']];
const JL=Object.fromEntries(JT.concat([['mob_x_link','لینک X خبر Mob']]));
V.jobs=async()=>{const r=await api('/api/console/jobs?limit=30');
return card('ثبت کار جدید',`<div class="row"><div><label>نوع کار</label><select id="j_t">${opts(JT)}</select></div><button class="btn" data-a="jAdd">ثبت در صف</button><button class="btn g" data-a="reload">↻ تازه‌سازی</button></div><div class="s">فقط رکورد ثبت می‌شود؛ موتور اجرای کارها هنوز وجود ندارد (وضعیت «در انتظار» یعنی اجرا نشده). کار لینک X از «حالت فوری» ساخته می‌شود.</div>`)
+card('',tbl([['شناسه',x=>`<code>${cut(x.id,16)}</code>`],['نوع',x=>E(JL[x.type]||x.type)],['وضعیت',x=>badge(x.status)],['پیشرفت',x=>`<div class="bar" style="min-width:90px"><i data-w="${N(x.progress)}"></i></div>`],['ثبت',x=>fmt(x.created_at)],['خطا',x=>E(x.error||'—')],['',x=>`<button class="btn g sm" data-a="jView" data-id="${E(x.id)}">جزئیات</button>`]],r.items||[]))};
A.jView=async el=>{const r=await api('/api/console/jobs/'+encodeURIComponent(el.dataset.id)),j=r.job,x=j.result||{};
const row=(k,v)=>`<div class="br" style="grid-template-columns:150px 1fr"><span class="s">${k}</span><b style="text-align:right">${v}</b></div>`;
modal(`<h3 style="margin-bottom:8px">جزئیات کار</h3>${row('نوع',E(JL[j.type]||j.type))}${row('وضعیت',badge(j.status))}${row('پیشرفت',N(j.progress)+'٪')}${row('شناسهٔ پست (۶ رقم آخر)',E(String(x.external_id||'').slice(-6)||'—'))}${row('رسانه',E(x.media_type||'—'))}${row('پیش‌نمایش در PV',x.preview_sent?'<span class="bd ok">ارسال شد</span>':'—')}${row('وضعیت ارسال',E(x.delivery_status||'—'))}${row('خطا',E(j.error||x.delivery_error||'—'))}<div class="s" style="margin-top:10px">تأیید نهایی و ارسال فقط از PV انجام می‌شود (فقط کانال تست). پیش‌نمایش ویدیو در وب وجود ندارد.</div><div class="row" style="margin-top:14px"><button class="btn g" data-a="close">بستن</button></div>`)};

/* ---------- دیتابیس (رفع باگ data-n) ---------- */
V.d1=async()=>{const t=await api('/api/console/d1/tables');
return card('جدول‌ها',`<div class="chips">${(t.items||[]).map(x=>`<button class="chip" style="cursor:pointer" data-a="dT" data-tbl="${E(x.name)}" title="${E(x.columns.map(c=>c.name).join(', '))}">${E(x.name)}<b>${N(x.row_count).toLocaleString('fa-IR')}</b></button>`).join('')}</div>`)
+card('پرس‌وجو (فقط SELECT)',`<textarea id="d_q" rows="3" dir="ltr" spellcheck="false">SELECT * FROM items ORDER BY discovered_at DESC LIMIT 20</textarea><div class="row" style="margin-top:10px"><button class="btn" data-a="dRun">اجرا</button></div>`)+'<div id="d_r"></div>'};
A.dT=el=>{document.getElementById('d_q').value='SELECT * FROM "'+el.dataset.tbl+'" LIMIT 20'};

/* ---------- ناوبری ---------- */
if(!NAV.some(n=>n[0]==='inst'))NAV.splice(3,0,['inst','حالت فوری','➤']);
document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="nv" data-id="${n[0]}" data-a="go"><span>${n[2]}</span>${n[1]}</button>`).join('');
R.go(R.cur);
})();
</script>
</body>
</html>
