<title>کنسول مالک — Rubika-Agent</title>
<!--
ASSUMPTIONS (فرض‌ها)
1. پنل مستقیماً Rubika API را برای انتشار صدا نمی‌زند. مسیرهای Mob preview/publish-test در Worker فعلی فعال نیستند؛ بخش GitHub Actions می‌تواند workflow اجرا کند و عملیات آن تابع guardهای خود workflow است. هر اجرای دستی می‌تواند عملیات واقعی ایجاد کند و فقط پس از تأیید صریح انجام می‌شود.
2. Secretها فقط با «نام» نمایش داده می‌شوند. هیچ مقداری لاگ/نمایش داده نمی‌شود. توکن‌ها در لاگ درخواست‌ها redact می‌شوند.
3. endpointهای «برنامه‌ریزی‌شده» ممکن است 404 بدهند؛ در آن صورت کارت «هنوز فعال نشده» + مثال پاسخ نمایش داده می‌شود.
4. زمان تهران با Intl (Asia/Tehran) محاسبه می‌شود؛ fallback ثابت UTC+3:30.
5. Cron پارسر محلی است (۵ فیلد، * , - /). "۵ اجرای بعدی" با پیمایش دقیقه‌ای حداکثر ۱ سال آینده محاسبه می‌شود (بر مبنای UTC، چون GitHub Actions cron با UTC است) و سپس به وقت تهران نمایش داده می‌شود.
6. GitHub Contents API با base64 UTF-8 صحیح (TextEncoder) برای فارسی.
7. فایل‌های حساس (.env, *.key, *.pem, secrets) در ویرایشگر ریپو مسدودند.
8. ویرایش فایل به‌صورت پیش‌فرض روی شاخهٔ feature جدید؛ commit مستقیم روی main نیاز به تایپ «تایید» دارد.
9. حالت Mock داده‌های واقع‌نما تولید می‌کند (۶۰ ردیف صف و ...) و تأخیر/خطای تصادفی شبیه‌سازی می‌کند.
10. کش stale-while-revalidate 15 ثانیه برای GETها.
11. فونت Vazirmatn از Google Fonts لود می‌شود؛ اگر شبکه در دسترس نباشد، فونت جایگزین سیستمی استفاده می‌شود.
12. ذخیرهٔ توکن پیش‌فرض sessionStorage.
-->

const FA_D = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function nf(n){
  if(n===null||n===undefined||n==="") return "—";
  let s = String(n);

  return S.persianDigits ? s.replace(/\d/g,d=>FA_D[+d]) : s;
}
function tehranParts(d){
  try{
    const f = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tehran",hour12:false,
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const o={}; f.formatToParts(d).forEach(p=>o[p.type]=p.value);
    return {y:+o.year,m:+o.month,d:+o.day,H:+(o.hour==="24"?"0":o.hour),M:+o.minute,S:+o.second};
  }catch(e){
    const t = new Date(d.getTime()+ (3.5*3600*1000));
    return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),H:t.getUTCHours(),M:t.getUTCMinutes(),S:t.getUTCSeconds()};
  }
}
function fmtDate(v, withRel){
  if(!v) return "—";
  let d = v instanceof Date? v : new Date(typeof v==="number"? v : String(v).replace(" ","T")+( /z|[+\-]\d\d:?\d\d$/i.test(String(v))?"":"Z"));
  if(isNaN(d.getTime())) return String(v);

  if(S.jalali){
    try{
      out = new Intl.DateTimeFormat("fa-IR-u-ca-persian",{timeZone:"Asia/Tehran",dateStyle:"short",timeStyle:"short"}).format(d);
    }catch(e){ out=null }
  }
  if(!out){
    const p = tehranParts(d);
    out = nf(p.y)+"/"+nf(String(p.m).padStart(2,"0"))+"/"+nf(String(p.d).padStart(2,"0"))+" "+nf(String(p.H).padStart(2,"0"))+":"+nf(String(p.M).padStart(2,"0"));
  }
  if(!S.persianDigits) out = out.replace(/[۰-۹]/g,ch=>String(FA_D.indexOf(ch)));
  return withRel===false? out : out+" ("+relTime(d)+")";
}
function relTime(d){
  const s = Math.round((Date.now()-d.getTime())/1000);
  const a = Math.abs(s), fut = s<0;
  const pick = a<60? [a,"ثانیه"] : a<3600? [Math.round(a/60),"دقیقه"] : a<86400? [Math.round(a/3600),"ساعت"] : [Math.round(a/86400),"روز"];
  return fut ? ("تا "+nf(pick[0])+" "+pick[1]+" دیگر") : (nf(pick[0])+" "+pick[1]+" پیش");
}

/* SQL guard: only SELECT */
function isSelectOnly(sql){
  const s = String(sql||"").replace(/--[^\n]*/g,"").replace(/\/\*[\s\S]*?\*\//g,"").trim().replace(/;+\s*$/,"");
  if(!s) return false;
  if(s.indexOf(";")>=0) return false;
  if(!/^select\b/i.test(s)) return false;
  if(/\b(insert|update|delete|drop|alter|create|replace|attach|detach|pragma|vacuum|reindex|truncate|grant|begin|commit)\b/i.test(s)) return false;
  return true;
}

/* ===== CRON parser ===== */
function parseCronField(f, min, max){
  const out = new Set();
  String(f).split(",").forEach(part=>{
    let step=1, rng=part;
    const sl = part.split("/");
    if(sl.length===2){ rng=sl[0]; step=parseInt(sl[1],10); if(!(step>0)) throw new Error("bad step") }
    let a,b;
    if(rng==="*"||rng===""){ a=min;b=max }
    else if(rng.indexOf("-")>0){ const p=rng.split("-"); a=parseInt(p[0],10); b=parseInt(p[1],10) }
    else { a=parseInt(rng,10); b= (sl.length===2? max : a) }
    if(isNaN(a)||isNaN(b)||a<min||b>max||a>b) throw new Error("bad range: "+part);
    for(let i=a;i<=b;i+=step) out.add(i);
  });
  return Array.from(out).sort((x,y)=>x-y);
}
function parseCron(expr){
  const f = String(expr||"").trim().split(/\s+/);
  if(f.length!==5) throw new Error("cron باید ۵ فیلد داشته باشد");
  return {
    minute: parseCronField(f[0],0,59),
    hour: parseCronField(f[1],0,23),
    dom: parseCronField(f[2],1,31), domStar: f[2]==="*",
    month: parseCronField(f[3],1,12),
    dow: parseCronField(f[4],0,6).map(d=>d===7?0:d), dowStar: f[4]==="*",
    raw: f.join(" ")
  };
}
function cronNext(expr, count, from){
  const c = parseCron(expr); const out=[];
  let t = new Date((from||new Date()).getTime()); t.setUTCSeconds(0,0); t = new Date(t.getTime()+60000);
  const limit = 366*24*60;
  for(let i=0;i<limit && out.length<(count||5); i++){
    const mo=t.getUTCMonth()+1, dom=t.getUTCDate(), dow=t.getUTCDay(), h=t.getUTCHours(), mi=t.getUTCMinutes();
    const dayOk = (c.domStar&&c.dowStar) ? true : (c.domStar? c.dow.indexOf(dow)>=0 : (c.dowStar? c.dom.indexOf(dom)>=0 : (c.dom.indexOf(dom)>=0||c.dow.indexOf(dow)>=0)));
    if(c.month.indexOf(mo)>=0 && dayOk && c.hour.indexOf(h)>=0 && c.minute.indexOf(mi)>=0) out.push(new Date(t.getTime()));
    t = new Date(t.getTime()+60000);
  }
  return out;
}
const DOW_FA=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
function cronToFa(expr){
  let c; try{ c=parseCron(expr) }catch(e){ return "عبارت cron نامعتبر: "+e.message }
  const everyMin = c.minute.length===60, everyHour = c.hour.length===24;
  let s = "";
  if(everyMin && everyHour) s="هر دقیقه";
  else if(everyHour) s = "هر ساعت، در دقیقهٔ "+c.minute.map(nf).join("، ");
  else if(everyMin) s = "هر دقیقه در ساعت‌های "+c.hour.map(nf).join("، ")+" (UTC)";
  else s = "ساعت "+c.hour.map(h=>nf(h)).join("، ")+" UTC در دقیقهٔ "+c.minute.map(nf).join("، ");
  if(!c.domStar) s += "، روزهای ماه: "+c.dom.map(nf).join("، ");
  if(!c.dowStar) s += "، روزهای هفته: "+c.dow.map(d=>DOW_FA[d]).join("، ");
  if(c.month.length!==12) s += "، ماه‌های "+c.month.map(nf).join("، ");
  if(!everyMin && !everyHour){
    const teh = c.hour.map(h=>{ let x=h*60+210; x=((x%1440)+1440)%1440; return nf(String(Math.floor(x/60)).padStart(2,"0"))+":"+nf(String(x%60).padStart(2,"0")) });
    s += " — به وقت تهران حدود "+teh.join("، ");
  }
  return s;
}
/* ===== JSON tree (safe, DOM only) ===== */
function jsonTree(value, key, depth){
  depth = depth||0;
  const wrap = el("div",{class:"jt"});
  const t = value===null? "null" : Array.isArray(value)? "array" : typeof value;
  if(t==="object"||t==="array"){
    const entries = t==="array"? value.map((v,i)=>[i,v]) : Object.keys(value).map(k=>[k,value[k]]);
    const d = el("details", depth<1?{open:true}:{});
    d.appendChild(el("summary",{},[ (key!==undefined? String(key)+": ":"") + (t==="array"?"[":"{") + entries.length + (t==="array"?"]":"}") ]));
    entries.forEach(([k,v])=> d.appendChild(jsonTree(v,k,depth+1)));
    wrap.appendChild(d);
  } else {
    const line = el("div",{});
    if(key!==undefined) line.appendChild(el("span",{class:"k",text:String(key)+": "}));
    line.appendChild(el("span",{class: t==="number"?"n":"s", text: t==="string"? JSON.stringify(value) : String(value)}));
    wrap.appendChild(line);
  }
  return wrap;
}

function modal(opts){
  return new Promise(resolve=>{
    const bg = el("div",{class:"modalbg", role:"dialog","aria-modal":"true"});
    const box = el("div",{class:"modal"});
    box.appendChild(el("h3",{text:opts.title||"تأیید"}));
    (Array.isArray(opts.body)?opts.body:[opts.body]).forEach(b=>{
      if(!b) return; box.appendChild(typeof b==="object"&&b.nodeType? b : el("p",{text:String(b)}));
    });
    let inp=null;
    if(opts.typeConfirm){
      box.appendChild(el("p",{class:"small",style:{color:"var(--err)"},text:'برای ادامه کلمهٔ «تایید» را تایپ کنید:'}));
      inp = el("input",{type:"text","aria-label":"تایپ تایید"}); box.appendChild(inp);
    }
    const okBtn = el("button",{class:"btn "+(opts.danger?"danger":"primary"), text:opts.okText||"تأیید"});
    const cancel = el("button",{class:"btn ghost", text:opts.cancelText||"انصراف"});
    box.appendChild(el("div",{class:"row end",style:{marginTop:"12px"}},[cancel, okBtn]));
    bg.appendChild(box); $("#modalRoot").appendChild(bg);
    const close = v=>{ document.removeEventListener("keydown",onKey); bg.remove(); resolve(v) };
    const onKey = e=>{
      if(e.key==="Escape"){ e.preventDefault(); close(false) }
      if(e.key==="Tab"){
        const f = box.querySelectorAll("button,input,textarea,select,a[href]");
        if(!f.length) return; const first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus() }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus() }
      }
    };
    document.addEventListener("keydown",onKey);
    bg.addEventListener("click", e=>{ if(e.target===bg) close(false) });
    cancel.addEventListener("click",()=>close(false));
    okBtn.addEventListener("click",()=>{
      if(opts.typeConfirm && (!inp || inp.value.trim()!=="تایید")){ toast("کلمهٔ «تایید» را دقیق تایپ کنید","err"); return }
      close(true);
    });
    (inp||okBtn).focus();
  });
}

/* ============================ API ============================ */
function apiErrorFa(kind, status, raw){
  if(kind==="timeout") return "زمان پاسخ تمام شد (timeout). شبکه کند است یا Worker پاسخ نمی‌دهد.";
  if(kind==="abort") return "درخواست لغو شد.";
  if(kind==="network") return "خطای شبکه یا CORS. اگر CORS خطا داد، باید Worker هدرهای CORS بدهد (Access-Control-Allow-Origin).";
  if(status===401||status===403) return "توکن اشتباه یا بدون دسترسی است (۴۰۱/۴۰۳). AGENT_API_TOKEN را بررسی کنید.";
  if(status===404) return "این مسیر در Worker موجود نیست (۴۰۴).";
  if(status===409) return "تداخل نسخه (۴۰۹) — نسخهٔ جدیدتری ذخیره شده است.";
  if(status===429) return "تعداد درخواست بیش از حد (۴۲۹). کمی صبر کنید.";
  if(status>=500) return "خطای سرور ("+status+"). Worker خطا داد.";
  return raw? ("خطا: "+raw) : ("خطای ناشناخته ("+status+")");
}
function logReq(rec){
  S.reqLog.unshift(rec); S.reqLog = S.reqLog.slice(0,300);
}
async function api(method, path, opts){
  opts = opts||{};
  if(S.mock) return MOCK.handle(method, path, opts);
  const base = (S.apiBase||"").replace(/\/+$/,"");
  if(!base) throw Object.assign(new Error("آدرس API تنظیم نشده است."),{fa:"آدرس API تنظیم نشده است."});
  let url = base + path;
  if(opts.query){
    const q = Object.keys(opts.query).filter(k=>opts.query[k]!==undefined&&opts.query[k]!==null&&opts.query[k]!=="")
      .map(k=>encodeURIComponent(k)+"="+encodeURIComponent(opts.query[k])).join("&");
    if(q) url += (url.indexOf("?")>=0?"&":"?")+q;
  }
  const retries = method==="GET"? 2 : 0;
  let lastErr=null;
  for(let attempt=0; attempt<=retries; attempt++){
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort("timeout"), opts.timeoutMs||15000);
    if(opts.signal) opts.signal.addEventListener("abort",()=>ctrl.abort("outer"));
    const t0 = performance.now();
    let status=0, kind=null;
    try{
      const headers = {"Accept":"application/json"};
      if(S.apiToken) headers["Authorization"] = "Bearer "+S.apiToken;
      if(opts.body!==undefined) headers["Content-Type"]="application/json";
      const res = await fetch(url, {method, headers, signal:ctrl.signal,
        body: opts.body!==undefined? JSON.stringify(opts.body) : undefined});
      clearTimeout(to); status = res.status;
      const text = await res.text();
      let data=null; try{ data = text? JSON.parse(text):null }catch(e){ data={ok:false,error:text.slice(0,200)} }
      logReq({t:Date.now(), m:method, p:path, s:status, ms:Math.round(performance.now()-t0), ok:res.ok});
      if(!res.ok){
        const e = new Error("http "+status);
        e.status=status; e.fa = apiErrorFa("http",status, data&&data.error);
        e.notFound = status===404 || (data&&data.error==="not_found");
        e.data=data;
        if(status>=500 && attempt<retries){ lastErr=e; await new Promise(r=>setTimeout(r, 400*Math.pow(2,attempt))); continue }
        throw e;
      }
      if(data && data.ok===false){
        const e=new Error(String(data.error||"error")); e.status=200; e.fa=apiErrorFa("http",200,data.error);
        e.notFound = data.error==="not_found"; e.data=data; throw e;
      }
      return data;
    }catch(err){
      clearTimeout(to);
      if(err.status) { lastErr=err; if(attempt>=retries) throw err; continue }
      kind = (err.name==="AbortError")? (String(ctrl.signal.reason)==="timeout"?"timeout":"abort") : "network";
      logReq({t:Date.now(), m:method, p:path, s:0, ms:Math.round(performance.now()-t0), ok:false, note:kind});
      const e = new Error(kind); e.kind=kind; e.fa=apiErrorFa(kind,0,null); e.network=true;
      if(kind==="abort") throw e;
      lastErr=e;
      if(attempt<retries){ await new Promise(r=>setTimeout(r,400*Math.pow(2,attempt))); continue }
      throw e;
    }
  }
  throw lastErr||new Error("unknown");
}
/* stale-while-revalidate cache for GET */
async function cachedGet(key, fn, ttl){
  ttl = ttl||15000;
  const hit = S.cache.get(key);
  if(hit && Date.now()-hit.t < ttl) return hit.v;
  const v = await fn();
  S.cache.set(key,{t:Date.now(), v});
  return v;
}
function invalidate(prefix){
  Array.from(S.cache.keys()).forEach(k=>{ if(k.indexOf(prefix)===0) S.cache.delete(k) });
}

async function loadInto(container, loader, render, contractKey){
  clear(container); container.appendChild(skeleton(4));
  try{
    const data = await loader();
    clear(container); const n = render(data); if(n) container.appendChild(n);
  }catch(err){
    clear(container);
    if(err.notFound && contractKey) container.appendChild(plannedBox(contractKey, ()=>loadInto(container,loader,render,contractKey)));
    else container.appendChild(errorBox(err, ()=>loadInto(container,loader,render,contractKey)));
  }
}
function simpleLineChart(points, w, h, label){
  const W=w||320, H=h||90;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("width","100%"); svg.setAttribute("height",H);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label", label||"نمودار");
  const max = Math.max(1, ...points);
  const step = points.length>1? W/(points.length-1):W;
  let d="";
  points.forEach((p,i)=>{ const x=i*step, y=H-6-(p/max)*(H-14); d += (i?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1) });
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",d); path.setAttribute("fill","none"); path.setAttribute("stroke","var(--brand)"); path.setAttribute("stroke-width","2");
  svg.appendChild(path);
  points.forEach((p,i)=>{ const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",(i*step).toFixed(1)); c.setAttribute("cy",(H-6-(p/max)*(H-14)).toFixed(1)); c.setAttribute("r","2.5");
    c.setAttribute("fill","var(--brand)"); svg.appendChild(c) });
  return svg;
}
function barChart(pairs, label){
  const wrap = el("div",{role:"img","aria-label":label||"نمودار ستونی"});
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  pairs.forEach(([k,v])=>{
    wrap.appendChild(el("div",{style:{margin:"6px 0"}},[
      el("div",{class:"row small",style:{justifyContent:"space-between"}},[el("span",{text:k}),el("b",{text:nf(v)})]),
      el("div",{class:"bar"},[el("i",{style:{width:Math.round(v/max*100)+"%"}})])
    ]));
  });
  return wrap;
}

    const latency = Math.round(performance.now()-t0);
    try{ qs = await cachedGet("qsum", ()=>api("GET",API_CONTRACT.queueSummary.p)) }catch(e){ if(!e.notFound) errs.push(e) }
    try{ groq = await cachedGet("ai_groq",()=>api("GET",API_CONTRACT.aiProviderStatus.p,{query:{provider:"groq"}})) }catch(e){}
    try{ orr = await cachedGet("ai_or",()=>api("GET",API_CONTRACT.aiProviderStatus.p,{query:{provider:"openrouter"}})) }catch(e){}
    clear(body);
    if(!status && errs.length){ body.appendChild(errorBox(errs[0], render)); }
    const caps = (status&&status.capabilities)||{};
    const g = el("div",{class:"grid g4"});
    g.appendChild(statBox("وضعیت Worker", status? "آنلاین":"نامعلوم", status? ("سرویس: "+String(status.service||"—")):""));
    g.appendChild(statBox("D1", caps.database? "فعال":"غیرفعال/نامعلوم"));
    g.appendChild(statBox("انتشار (capabilities)", caps.publishing? "مجاز":"بسته", caps.publishing? "فقط کانال آزمایشی از پنل":"پنل نمی‌تواند منتشر کند"));
    g.appendChild(statBox("تأخیر API", nf(latency)+" ms"));
    g.appendChild(statBox("ارسال امروز", qs? nf(qs.sent_today):"—"));
    g.appendChild(statBox("Agent", status&&status.agent? (status.agent.enabled? "روشن":"خاموش"):"—", status&&status.agent? fmtDate(status.agent.updated_at):""));
    body.appendChild(card("وضعیت کلی",[g, sectionNote("هیچ مقدار secret هرگز در این صفحه یا لاگ نمایش داده نمی‌شود.")]));

    const capRow = el("div",{});
    ["database","discovery","metadata_api","download","publishing"].forEach(k=>{
      capRow.appendChild(el("span",{class:"chip "+(caps[k]?"ok":"err"), text:k+": "+(caps[k]?"بله":"خیر")}));
    });
    body.appendChild(card("قابلیت‌ها", capRow));

    const aiW = el("div",{class:"grid g2"});
    [["Groq",groq],["OpenRouter",orr]].forEach(([name,p])=>{
      const c = el("div",{class:"stat"});
      c.appendChild(el("div",{class:"row",style:{justifyContent:"space-between"}},[el("b",{text:name}), p? statusChip(p.ready?"success":"error"):el("span",{class:"chip",text:"نامعلوم"})]));
      if(p){
        c.appendChild(el("div",{class:"small",text:"مصرف: "+nf(p.calls_used)+" از "+nf(p.daily_limit)+" — باقی‌مانده "+nf(p.remaining)}));
        c.appendChild(el("div",{class:"bar",style:{marginTop:"6px"}},[el("i",{style:{width:Math.min(100,Math.round((p.calls_used/(p.daily_limit||1))*100))+"%"}})]));
        if(p.cooldown_active && p.cooldown_until){
          const cd = el("div",{class:"small",style:{color:"var(--warn)"}});
          c.appendChild(cd);
          const tick=()=>{ const left = Math.max(0, Math.round((new Date(p.cooldown_until).getTime()-Date.now())/1000));
            cd.textContent = left? ("cooldown: "+nf(left)+" ثانیه"):"cooldown پایان یافت" };
          tick(); const iv=setInterval(tick,1000); S.timers.push(iv);
        }
        if(p.last_error_code) c.appendChild(el("div",{class:"small",style:{color:"var(--err)"},text:"آخرین خطا: "+String(p.last_error_code)}));
      } else c.appendChild(el("div",{class:"small muted",text:"در دسترس نیست"}));
      aiW.appendChild(c);
    });
    body.appendChild(card("هوش مصنوعی", aiW));

    const counts = qs? (qs.queue_counts||{}) : (status&&status.item_counts? status.item_counts.reduce((a,r)=>(a[r.status]=r.total,a),{}) : {});
    const pairs = Object.keys(counts).map(k=>[k, counts[k]]);
    body.appendChild(card("توزیع وضعیت صف", pairs.length? barChart(pairs,"توزیع وضعیت صف") : emptyBox("داده‌ای موجود نیست")));

    const rr = (status&&status.recent_runs)||[];
    body.appendChild(card("آخرین اجراها", rr.length? el("div",{},[
      simpleLineChart(rr.slice().reverse().map(r=>r.sent_count||0),320,90,"روند ارسال"),
      tableFrom([
        {label:"#",key:"id"},
        {label:"وضعیت",render:r=>statusChip(r.status)},
        {label:"شروع",render:r=>el("span",{text:fmtDate(r.started_at)})},
        {label:"یافت/واجد/ارسال",render:r=>el("span",{text:nf(r.found_count)+" / "+nf(r.eligible_count)+" / "+nf(r.sent_count)})}
      ], rr)
    ]) : emptyBox("اجرایی ثبت نشده است")));

    const lastErrs = S.reqLog.filter(r=>!r.ok).slice(0,5);
    body.appendChild(card("آخرین خطاها", lastErrs.length? el("div",{}, lastErrs.map(r=>
      el("div",{class:"kv"},[el("b",{text:r.m+" "+r.p}), el("span",{text:(r.s||r.note||"خطا")+" — "+fmtDate(r.t,false)})]))) : emptyBox("خطایی ثبت نشده")));
  }
  render();
  root._refresh = render;
};

/* ---------- PAGE: Queue ---------- */
PAGES.queue = function(root){
  const st = ps("queue",{status:"queued", q:"", platform:"", sort:"updated_desc", limit:20, offset:0, sel:{}});
  const tabs = el("div",{class:"tabs"});
  const STATUSES = [["queued","در صف"],["processing","در حال پردازش"],["sent","ارسال‌شده"],["failed","ناموفق"],["uncertain","نامطمئن"],["skipped","رد شده"]];
  STATUSES.forEach(([v,l])=> tabs.appendChild(el("button",{class:st.status===v?"active":"",text:l,onclick:()=>{ st.status=v; st.offset=0; st.sel={}; redrawTabs(); load() }})));
  function redrawTabs(){ Array.from(tabs.children).forEach((b,i)=> b.className = st.status===STATUSES[i][0]?"active":"") }
  const search = el("input",{type:"text",placeholder:"جست‌وجو در عنوان/کپشن/لینک",value:st.q,"aria-label":"جست‌وجوی صف"});
  search.addEventListener("input", debounce(e=>{ st.q=e.target.value; st.offset=0; load() },350));
  const plat = el("select",{"aria-label":"پلتفرم",onchange:e=>{ st.platform=e.target.value; st.offset=0; load() }});
  [["","همهٔ پلتفرم‌ها"],["x","X"],["tiktok","تیک‌تاک"]].forEach(([v,l])=>plat.appendChild(el("option",{value:v,selected:st.platform===v,text:l})));
  const sort = el("select",{"aria-label":"مرتب‌سازی",onchange:e=>{ st.sort=e.target.value; load() }});
  [["updated_desc","جدیدترین بروزرسانی"],["created_desc","جدیدترین ساخت"],["attempts_desc","بیشترین تلاش"],["id_asc","شناسه صعودی"]]
    .forEach(([v,l])=>sort.appendChild(el("option",{value:v,selected:st.sort===v,text:l})));
  const bulk = el("div",{class:"row",style:{marginTop:"8px"}});
  const body = el("div",{});
  root.appendChild(card("صف خودکار",[tabs, el("div",{class:"row"},[search]), el("div",{class:"row"},[plat,sort]), bulk,
    sectionNote("یادداشت: فراخوانی این GET رکوردهای processing قدیمی‌تر از ۱۲ ساعت را به uncertain تبدیل می‌کند.")]));
  root.appendChild(body);

  function selectedIds(){ return Object.keys(st.sel).filter(k=>st.sel[k]).map(Number) }
  function renderBulk(){
    clear(bulk);
    const ids = selectedIds();
    bulk.appendChild(el("span",{class:"small muted",text:"انتخاب‌شده: "+nf(ids.length)}));
    bulk.appendChild(el("button",{class:"btn sm",disabled:!ids.length,text:"بازگرداندن به صف",onclick:()=>bulkAct(ids,"queued")}));
    bulk.appendChild(el("button",{class:"btn sm",disabled:!ids.length,text:"رد کردن (skip)",onclick:()=>bulkAct(ids,"skipped")}));
    bulk.appendChild(el("button",{class:"btn sm ghost",text:"پاک‌کردن انتخاب",onclick:()=>{ st.sel={}; load() }}));
  }
  async function bulkAct(ids, status){
    const ok = await confirmDanger("تغییر وضعیت گروهی",
      "وضعیت "+nf(ids.length)+" ردیف به «"+status+"» تغییر می‌کند. این عمل روی دیتابیس D1 اثر می‌گذارد و برگشت‌پذیر نیست مگر دستی.");
    if(!ok) return;
    let done=0, fail=0;
    for(const id of ids){
      try{ await api("POST","/api/brain/automation-queue/"+id+"/state",{body:{status}}); done++ }catch(e){ fail++ }
    }
    audit("queue.bulk_state","ids="+ids.length+" → "+status);
    toast("انجام شد: "+nf(done)+" موفق، "+nf(fail)+" ناموفق", fail?"warn":"ok");
    st.sel={}; invalidate("queue"); load();
  }
  function load(){
    renderBulk();
    loadInto(body, ()=>cachedGet("queue:"+st.status+":"+st.limit+":"+st.offset,
      ()=>api("GET","/api/brain/automation-queue",{query:{status:st.status, limit:st.limit, offset:st.offset}}), 10000), data=>{
      let items = (data.items||[]).slice();
      if(st.platform) items = items.filter(i=>i.platform===st.platform);
      if(st.q){ const q=st.q; items = items.filter(i=>[i.title,i.caption,i.canonical_url,i.source_key].some(v=>String(v||"").indexOf(q)>=0)) }
      items.sort((a,b)=>{
        if(st.sort==="id_asc") return a.id-b.id;
        if(st.sort==="attempts_desc") return (b.attempt_count||0)-(a.attempt_count||0);
        const k = st.sort==="created_desc"?"created_at":"updated_at";
        return String(b[k]||"").localeCompare(String(a[k]||""));
      });
      const w = el("div",{});
      const counts = data.counts||{};
      const cr = el("div",{style:{marginBottom:"8px"}});
      Object.keys(counts).forEach(k=> cr.appendChild(el("span",{class:"chip",text:k+": "+nf(counts[k])})));
      w.appendChild(cr);
      if(!items.length){ w.appendChild(emptyBox("ردیفی با این فیلتر وجود ندارد")); w.appendChild(pager(st,null,load)); return w }
      w.appendChild(tableFrom([
        {label:"انتخاب", render:r=>{ const cb=el("input",{type:"checkbox","aria-label":"انتخاب "+r.id}); cb.checked=!!st.sel[r.id];
          cb.style.width="22px"; cb.style.minHeight="22px";
          cb.addEventListener("click",e=>{ e.stopPropagation(); st.sel[r.id]=cb.checked; renderBulk() }); return cb }},
        {label:"#", key:"id"},
        {label:"پلتفرم", key:"platform"},
        {label:"عنوان", render:r=>el("span",{text:String(r.title||r.external_id||"—").slice(0,70)})},
        {label:"وضعیت", render:r=>statusChip(r.status)},
        {label:"تلاش", render:r=>el("span",{text:nf(r.attempt_count||0)})},
        {label:"بروزرسانی", render:r=>el("span",{text:fmtDate(r.updated_at)})},
        {label:"جزئیات", render:r=>el("button",{class:"btn sm",text:"باز کردن",onclick:e=>{ e.stopPropagation(); location.hash="#/queue/item/"+r.id }})}
      ], items, r=>{ location.hash="#/queue/item/"+r.id }));
      w.appendChild(pager(st, null, load));
      return w;
    });
  }
  load(); root._refresh=load;
};

/* ---------- PAGE: Queue item detail ---------- */

    const q = await api("GET","/api/brain/automation-queue",{query:{limit:100, offset:0}});

  loadInto(body, fetchItem, item=>{
    const w = el("div",{});

      el("div",{class:"row"},[statusChip(item.status), el("span",{class:"chip",text:String(item.platform||"")}),
        item.review_state? statusChip(item.review_state):null,
        el("span",{class:"chip",text:"تلاش: "+nf(item.attempt_count||0)})]),
      el("div",{class:"kv"},[el("b",{text:"عنوان"}),el("span",{text:String(item.title||"—")})]),
      el("div",{class:"kv"},[el("b",{text:"منبع"}),el("span",{text:String(item.source_key||"—")})]),
      el("div",{class:"kv"},[el("b",{text:"لینک"}), linkNode(item.canonical_url)]),
      el("div",{class:"kv"},[el("b",{text:"انتشار"}),el("span",{text:fmtDate(item.published_at)})]),
      el("div",{class:"kv"},[el("b",{text:"ساخت"}),el("span",{text:fmtDate(item.created_at)})]),
      el("div",{class:"kv"},[el("b",{text:"آخرین خطا"}),el("span",{text:String(item.last_error_code||"—")})]),
      el("div",{class:"kv"},[el("b",{text:"رسانه"}),el("span",{text:String(item.media_type||"—")+" • "+String(item.media_mime||"")+" • "+nf(item.media_bytes||0)+" بایت"})])
    ]);
    w.appendChild(head);

    // media preview
    const mu = safeUrl(item.media_url||item.canonical_url);

      mediaCard.appendChild(el("img",{src:mu, alt:"پیش‌نمایش رسانه", style:{width:"100%",borderRadius:"10px"}}));
    } else {
      mediaCard.appendChild(el("div",{class:"small muted",text:"پیش‌نمایش امن ممکن نیست؛ فقط لینک:"}));
      mediaCard.appendChild(linkNode(item.canonical_url));
    }

    // edit form

    const mk = (label, key, max)=>{
      const ta = el("textarea",{"aria-label":label}); ta.value = String(item[key]||"");
      const cnt = el("div",{class:"small muted",text:"طول: "+nf(ta.value.length)+(max?(" / "+nf(max)):"")});
      ta.addEventListener("input",()=>{ cnt.textContent="طول: "+nf(ta.value.length)+(max?(" / "+nf(max)):""); dirtyFlag.v=true; S.dirty="ویرایش آیتم #"+item.id });

        {label:"شروع",render:r=>el("span",{text:fmtDate(r.started_at)})},

/* ---------- PAGE: Mob (X news) ---------- */
PAGES.mob = function(root){
  const st = ps("mob",{step:0,url:"",job:null,caption:"",linkId:null,result:null});
  const steps = ["تأیید لینک","ترجمهٔ فارسی","دانلود رسانه","پیش‌نمایش","انتشار آزمایشی"];
  const stepper = el("div",{class:"row",style:{marginBottom:"8px"}});
  const body = el("div",{});
  const linksBox = el("div",{});
  root.appendChild(card("جریان خبر X (Mob)",[stepper, body]));
  root.appendChild(card("لینک‌های ذخیره‌شده (panel_links)",[linksBox]));
  function drawStepper(){
    clear(stepper);
    steps.forEach((s,i)=> stepper.appendChild(el("span",{class:"chip "+(i<st.step?"ok":i===st.step?"info":""), text:nf(i+1)+". "+s})));
  }
  function reset(){
    st.step=0; st.url=""; st.job=null; st.linkId=null; st.result=null; st.caption="";
    draw(); loadLinks();
  }
  function draw(){
    drawStepper(); clear(body);
    if(st.step===0 && !Number(st.linkId)){
      const inp = el("input",{type:"text",placeholder:"https://x.com/mobgamesstudios/status/...",value:st.url,"aria-label":"لینک خبر"});
      body.appendChild(el("label",{class:"field"},[el("span",{text:"لینک پست رسمی Mob در X"}), inp]));
      body.appendChild(el("div",{class:"row"},[
        el("button",{class:"btn primary",text:"ثبت لینک برای تأیید",onclick:async()=>{
          const raw=inp.value.trim();
          const u=safeUrl(raw);
          if(!u || !/^https:\/\/(?:(?:www|mobile)\.)?(?:x\.com|twitter\.com)\/mobgamesstudios\/status\/\d{15,22}\/?$/i.test(raw))
            return toast("فقط لینک HTTPS پست حساب رسمی mobgamesstudios پذیرفته می‌شود","err");
          try{
            const r=await api("POST","/api/console/links",{body:{url:raw}});
            st.url=r.link.url; st.linkId=r.link.id; st.step=0; draw(); loadLinks();
          }catch(e){ toast(e.fa||("ثبت لینک ناموفق بود: "+String(e.message||"خطا")),"err") }
        }}),
        el("button",{class:"btn ghost",text:"پاک کردن",onclick:()=>{st.url="";draw()}})
      ]));
      body.appendChild(sectionNote("پس از ثبت، قبل از ایجاد کار پردازش، تأیید مالک لازم است."));
      return;
    }
    if(st.step===0 && Number(st.linkId)>0){
      body.appendChild(el("div",{class:"kv"},[el("b",{text:"این لینک است؟"}),linkNode(st.url,st.url)]));
      body.appendChild(el("div",{class:"row"},[
        el("button",{class:"btn primary",text:"✅ تأیید",onclick:async()=>{
          try{
            const r=await api("POST","/api/console/links/"+encodeURIComponent(st.linkId)+"/confirm",{body:{}});
            st.job=r.job_id; st.step=1; draw(); loadLinks(); pollJob();
          }catch(e){toast(e.fa||("تأیید لینک ناموفق بود: "+String(e.message||"خطا")),"err")}
        }}),
        el("button",{class:"btn danger",text:"✖️ لغو",onclick:async()=>{
          try{await api("POST","/api/console/links/"+encodeURIComponent(st.linkId)+"/cancel",{body:{}});
            toast("لینک رد شد","ok"); reset()
          }catch(e){toast(e.fa||("لغو لینک ناموفق بود: "+String(e.message||"خطا")),"err")}
        }})
      ]));
      body.appendChild(sectionNote("تنها لینک رسمی mobgamesstudios و شناسهٔ همین پست ثبت می‌شود."));
      return;
    }
    body.appendChild(el("div",{class:"small muted",text:"لینک: "+st.url}));
    if(st.step<4){
      body.appendChild(el("div",{class:"skel"}));
      body.appendChild(el("div",{class:"small muted",text:"در انتظار پردازش جاب: "+String(st.job||"—")}));
    }
    if(st.step===4 && st.result){
      const r=st.result;
      body.appendChild(el("div",{class:"kv"},[el("b",{text:"عنوان"}),el("span",{text:String(r.title||"—")})]));
      body.appendChild(el("div",{class:"kv"},[el("b",{text:"متن اصلی"}),el("span",{text:String(r.original_caption||"—")})]));
      const ta=el("textarea",{"aria-label":"کپشن فارسی"});
      ta.value=st.caption || String(r.persian_translation||r.caption||"");
      const cnt=el("div",{class:"small muted",text:"طول: "+nf(ta.value.length)});
      ta.addEventListener("input",()=>{st.caption=ta.value;cnt.textContent="طول: "+nf(ta.value.length)});
      body.appendChild(el("label",{class:"field"},[el("span",{text:"کپشن فارسی"}),ta,cnt]));
      const media=safeUrl(r.media_url||r.media_download_url||"");
      if(media) body.appendChild(el("div",{class:"kv"},[el("b",{text:"رسانه"}),linkNode(media,"بازکردن رسانه")]));
      body.appendChild(sectionNote("پیش‌نمایش آمادهٔ بررسی است. کنترل‌های ویرایش و انتشار با تأیید صریح مالک در مرحلهٔ بعد فعال می‌شوند."));
      body.appendChild(el("div",{class:"row"},[
        el("button",{class:"btn",text:"🔄 تازه‌سازی وضعیت",onclick:()=>pollJob()}),
        el("button",{class:"btn ghost",text:"شروع دوباره",onclick:reset})
      ]));
    }
  }
  function pollJob(){
    if(!st.job) return;
    const iv=setInterval(async()=>{
      try{
        const r=await api("GET","/api/console/jobs/"+encodeURIComponent(st.job));
        const j=r.job;
        if(j.status==="ready_for_review" || j.status==="done"){
          st.result=j.result||{}; st.step=4; clearInterval(iv); draw(); loadLinks(); return;
        }
        if(j.status==="failed" || j.status==="rejected"){
          clearInterval(iv); clear(body); body.appendChild(errorBox({fa:"جاب ناموفق: "+String(j.error||j.status||"")},reset)); loadLinks(); return;
        }
        st.step=j.status==="processing"||j.status==="running"?2:1;
        draw();
      }catch(e){clearInterval(iv);clear(body);body.appendChild(errorBox(e,reset))}
    },2500);
    S.timers.push(iv);
  }
  function loadLinks(){
    loadInto(linksBox, ()=>api("GET","/api/console/links"), d=>{
      const w=el("div",{});
      const items=d.items||[];
      if(!items.length) w.appendChild(emptyBox("لینکی ذخیره نشده"));
      else w.appendChild(tableFrom([
        {label:"#",key:"id"},
        {label:"لینک",render:r=>linkNode(r.url)},
        {label:"وضعیت",render:r=>statusChip(r.status)},
        {label:"ساخت",render:r=>el("span",{text:fmtDate(r.created_at)})},
        {label:"اقدام",render:r=>{
          const acts=el("div",{class:"row"});
          if(r.status==="pending"){
            acts.appendChild(el("button",{class:"btn sm primary",text:"✅ تأیید",onclick:async()=>{
              try{const result=await api("POST","/api/console/links/"+encodeURIComponent(r.id)+"/confirm",{body:{}});
                toast("لینک تأیید شد؛ job: "+String(result.job_id||"—"),"ok"); loadLinks();
                if(Number(st.linkId)===Number(r.id)){st.job=result.job_id;st.step=1;draw();pollJob()}
              }catch(e){toast(e.fa||"تأیید ناموفق بود","err")}
            }}));
            acts.appendChild(el("button",{class:"btn sm danger",text:"✖️ لغو",onclick:async()=>{
              try{await api("POST","/api/console/links/"+encodeURIComponent(r.id)+"/cancel",{body:{}});toast("لینک رد شد","ok");loadLinks()}
              catch(e){toast(e.fa||"لغو ناموفق بود","err")}
            }}));
          } else acts.appendChild(el("span",{class:"small muted",text:"—"}));
          return acts;
        }}
      ],items));
      return w;
    },"linksGet");
  }
  draw(); loadLinks(); root._refresh=()=>{draw();loadLinks()};
};

  {k:"mob_since_cutoff", t:"iso", d:"", fa:"تاریخ مرز برای اخبار X (ISO)"},

  {k:"caption_max_chars", t:"int", d:900, min:50, max:4000, fa:"حداکثر طول کپشن"},
  {k:"digest_window_utc", t:"text", d:"07:05", fa:"زمان دایجست روزانه (UTC)"}
];
PAGES.rules = function(root){
  const box = el("div",{});
  root.appendChild(card("قوانین اجرایی",[box]));
  function load(){
    loadInto(box, ()=>api("GET","/api/console/rules"), data=>{
      const rules = JSON.parse(JSON.stringify(data.rules||{}));
      const original = JSON.parse(JSON.stringify(rules));
      const w = el("div",{});
      w.appendChild(el("div",{class:"row"},[el("span",{class:"chip info",text:"نسخه: "+nf(data.version)}), el("span",{class:"small muted",text:"بروزرسانی: "+fmtDate(data.updated_at)})]));
      const form = el("div",{}); w.appendChild(form);
      RULE_DEFS.forEach(def=>{
        const cur = rules[def.k]!==undefined? rules[def.k] : def.d;
        if(def.t==="bool"){
          const cb = el("input",{type:"checkbox","aria-label":def.fa}); cb.checked = !!cur;
          cb.addEventListener("change",()=>{ rules[def.k]=cb.checked; });
          form.appendChild(el("label",{class:"switch"},[cb, el("span",{text:def.fa+"  ("+def.k+")"})]));
          form.appendChild(el("div",{class:"sep"}));
        } else if(def.t==="int"){
          const i = el("input",{type:"number",value:cur,min:def.min,max:def.max,"aria-label":def.fa});
          i.addEventListener("input",()=>{ const v=+i.value; rules[def.k] = isNaN(v)? def.d : Math.min(def.max===undefined?1e9:def.max, Math.max(def.min||0, v)) });
          form.appendChild(el("label",{class:"field"},[el("span",{text:def.fa+" ("+def.k+") — بین "+nf(def.min||0)+" و "+nf(def.max||"∞")}), i]));
        } else if(def.t==="list"){
          const i = el("input",{type:"text",value:(Array.isArray(cur)?cur.join(","):String(cur||"")),"aria-label":def.fa});
          i.addEventListener("input",()=>{ rules[def.k] = i.value.split(",").map(s=>s.trim()).filter(Boolean) });
          form.appendChild(el("label",{class:"field"},[el("span",{text:def.fa+" ("+def.k+")"}), i]));
        } else if(def.t==="obj"){
          const a = el("input",{type:"text",value:(cur&&cur.start)||"","aria-label":"شروع"});
          const b = el("input",{type:"text",value:(cur&&cur.end)||"","aria-label":"پایان"});
          const upd=()=>{ rules[def.k]={start:a.value,end:b.value} };
          a.addEventListener("input",upd); b.addEventListener("input",upd);
          form.appendChild(el("label",{class:"field"},[el("span",{text:def.fa+" ("+def.k+")"}), el("div",{class:"row"},[a,b])]));
        } else {
          const i = el("input",{type:"text",value:String(cur||""),"aria-label":def.fa});
          i.addEventListener("input",()=>{ rules[def.k]=i.value });
          form.appendChild(el("label",{class:"field"},[el("span",{text:def.fa+" ("+def.k+")"}), i]));
        }
      });
      // advanced JSON
      const adv = el("textarea",{"aria-label":"JSON پیشرفته"}); adv.value = JSON.stringify(rules,null,2);
      const advWrap = el("details",{},[el("summary",{text:"JSON پیشرفته (افزودن کلید دلخواه)"}), adv,
        el("button",{class:"btn sm",text:"اعمال JSON روی فرم",onclick:()=>{
          try{ const o=JSON.parse(adv.value); Object.keys(o).forEach(k=>rules[k]=o[k]); toast("اعمال شد — برای ذخیره دکمهٔ ذخیره را بزنید","ok") }
          catch(e){ toast("JSON نامعتبر","err") }
        }})]);
      w.appendChild(advWrap);
      const diffBox = el("div",{class:"diff"});
      w.appendChild(card("تفاوت قبل/بعد",[diffBox]));
      const refreshDiff=()=>{
        clear(diffBox);
        const keys = Array.from(new Set(Object.keys(original).concat(Object.keys(rules))));
        let any=false;
        keys.forEach(k=>{
          const a = JSON.stringify(original[k]), b = JSON.stringify(rules[k]);
          if(a!==b){ any=true;
            diffBox.appendChild(el("div",{class:"del",text:"- "+k+": "+(a===undefined?"(ندارد)":a)}));
            diffBox.appendChild(el("div",{class:"add",text:"+ "+k+": "+(b===undefined?"(حذف)":b)}));
          }
        });
        if(!any) diffBox.appendChild(el("div",{class:"small muted",text:"تغییری نیست"}));
      };
      refreshDiff();
      w.appendChild(el("div",{class:"row"},[
        el("button",{class:"btn",text:"نمایش تفاوت",onclick:refreshDiff}),
        el("button",{class:"btn primary",text:"ذخیرهٔ قوانین",onclick:async()=>{
          refreshDiff();
          const ok = await confirmDanger("ذخیرهٔ قوانین","قوانین اجرایی ربات تغییر می‌کند و بلافاصله روی رفتار خودکار اثر می‌گذارد. نسخهٔ پایه: "+nf(data.version));
          if(!ok) return;
          try{
            const r = await api("PUT","/api/console/rules",{body:{rules, base_version:data.version}});
            audit("rules.update","v"+data.version+"→v"+r.version); toast("ذخیره شد (نسخه "+nf(r.version)+")","ok"); load();
          }catch(e){
            if(e.status===409){
              await modal({title:"تداخل نسخه (۴۰۹)", body:[el("p",{text:"نسخهٔ جدیدتری روی سرور ذخیره شده است. مقادیر سرور:"}),
                el("pre",{text:JSON.stringify((e.data&&e.data.server)||{},null,2)})], okText:"باشه"});
              load();
            } else toast(e.notFound?"این قابلیت هنوز در Worker فعال نشده است":(e.fa||"خطا"),"err");
          }
        }}),
        el("button",{class:"btn ghost",text:"خروجی JSON",onclick:()=>download("rules.json", JSON.stringify(rules,null,2))}),
        el("button",{class:"btn ghost",text:"وارد کردن JSON",onclick:async()=>{
          const v = await promptModal("وارد کردن قوانین","متن JSON","");
          if(!v) return; try{ const o=JSON.parse(v); Object.keys(o).forEach(k=>rules[k]=o[k]); adv.value=JSON.stringify(rules,null,2); refreshDiff(); toast("بارگذاری شد","ok") }catch(e){ toast("JSON نامعتبر","err") }
        }}),
        el("button",{class:"btn ghost",text:"برگرداندن فرم به مقدار سرور",onclick:load})
      ]));
      return w;
    },"rulesGet");
  }
  load(); root._refresh=load;
};

PAGES.schedules = function(root){
  const box = el("div",{});
  root.appendChild(card("زمان‌بندی‌ها (از .github/workflows)",[
    el("div",{class:"small muted",text:"cronهای GitHub Actions بر مبنای UTC هستند؛ در اینجا به وقت تهران ترجمه شده‌اند."}), box]));
  async function load(){
    clear(box); box.appendChild(skeleton(6));
    let files = KNOWN_WORKFLOWS.map(w=>({path:".github/workflows/"+w.file, cron:w.cron, fa:w.fa}));
    let runs = [];
    if(S.ghToken || S.mock){
      try{
        const tree = await GH.tree("main");
        const found = (tree.tree||[]).filter(t=>/^\.github\/workflows\/.+\.ya?ml$/.test(t.path));
        if(found.length){
          files = [];
          for(const f of found){
            let cron="", name="";
            try{
              const c = await GH.content(f.path,"main");
              const text = b64decodeUtf8(c.content);
              const mName = text.match(/^name:\s*(.+)$/m); if(mName) name = mName[1].trim().replace(/^['"]|['"]$/g,"");
              const mCron = text.match(/cron:\s*['"]?([^'"\n]+)['"]?/);
              if(mCron) cron = mCron[1].trim();
            }catch(e){}
            files.push({path:f.path, cron, fa:name||f.path.split("/").pop()});
          }
        }
      }catch(e){}
      try{ const r = await GH.runs(); runs = r.workflow_runs||[] }catch(e){}
    }
    clear(box);
    if(!S.ghToken && !S.mock) box.appendChild(el("div",{class:"small",style:{color:"var(--warn)"},text:"توکن GitHub تنظیم نشده — فهرست پیش‌فرض نمایش داده می‌شود."}));
    files.forEach(f=>{
      const c = el("div",{class:"card"});
      c.appendChild(el("div",{class:"row",style:{justifyContent:"space-between"}},[el("b",{text:f.fa}),
        el("span",{class:"chip",style:{direction:"ltr"},text:f.cron||"دستی (workflow_dispatch)"})]));
      c.appendChild(el("div",{class:"small muted",style:{direction:"ltr",textAlign:"left"},text:f.path}));
      if(f.cron){
        c.appendChild(el("div",{text:cronToFa(f.cron)}));
        try{
          const nexts = cronNext(f.cron,5);
          const ul = el("div",{class:"small"});
          nexts.forEach(d=> ul.appendChild(el("div",{text:"• "+fmtDate(d)})));
          c.appendChild(el("details",{},[el("summary",{text:"۵ اجرای بعدی (وقت تهران)"}), ul]));
        }catch(e){ c.appendChild(el("div",{class:"small",style:{color:"var(--err)"},text:"خطا در پارس cron: "+e.message})) }
      }
      const last = runs.find(r=> String(r.path||"")===f.path);
      if(last){
        c.appendChild(el("div",{class:"row"},[el("span",{class:"small muted",text:"آخرین اجرا: "+fmtDate(last.created_at)}),
          statusChip(last.conclusion==="success"?"success":"error"), linkNode(last.html_url,"باز کردن در GitHub")]));
      }
      const acts = el("div",{class:"row"});
      acts.appendChild(linkNode("https://github.com/"+S.ghOwner+"/"+S.ghRepo+"/blob/main/"+f.path,"مشاهدهٔ فایل"));
      acts.appendChild(el("button",{class:"btn sm",text:"اجرای دستی (dispatch)",onclick:async()=>{
        const ok = await confirmDanger("اجرای workflow","workflow «"+f.fa+"» روی شاخهٔ main اجرا می‌شود. این کار می‌تواند منجر به عملیات واقعی ربات شود.");
        if(!ok) return;
        try{
          const id = f.path.split("/").pop();
          await GH.dispatch(id,"main"); audit("gh.dispatch",f.path);
          toast("ارسال شد — صفحهٔ اجراها را ببینید","ok");
          const u = "https://github.com/"+S.ghOwner+"/"+S.ghRepo+"/actions/workflows/"+id;
          await modal({title:"اجرا ثبت شد", body:[el("p",{text:"برای دیدن وضعیت:"}), linkNode(u,"صفحهٔ workflow در GitHub")], okText:"باشه"});
        }catch(e){ toast(e.fa||"خطا","err") }
      }}));
      acts.appendChild(el("button",{class:"btn sm ghost",text:"ویرایش cron (شاخه + PR)",onclick:()=>{ location.hash="#/repo"; toast("فایل را در «ریپو» باز کنید؛ ویرایش فقط با شاخهٔ جدید و PR انجام می‌شود.","info",5000) }}));
      c.appendChild(acts);
      box.appendChild(c);
    });
  }
  load(); root._refresh=load;
};

/* ---------- PAGE: Repo ---------- */
PAGES.repo = function(root){
  const st = ps("repo",{branch:"main", path:"", filter:"", content:"", sha:"", original:""});
  const tabs = el("div",{class:"tabs"});
  const T = [["files","فایل‌ها"],["branches","شاخه‌ها و PR"],["ci","وضعیت CI"],["request","درخواست قابلیت جدید"]];
  let tab = st.tab||"files";
  T.forEach(([v,l])=>tabs.appendChild(el("button",{class:tab===v?"active":"",text:l,onclick:()=>{ tab=v; st.tab=v; draw() }})));
  const body = el("div",{});
  root.appendChild(card("ریپو: "+S.ghOwner+"/"+S.ghRepo,[tabs,
    el("div",{class:"row"},[
      el("button",{class:"btn sm",text:"ساخت بکاپ از main",onclick:makeBackup}),
      el("button",{class:"btn sm",text:"ساخت شاخهٔ feature",onclick:()=>makeBranch("feature")}),
      el("button",{class:"btn sm ghost",text:"باز کردن در GitHub",onclick:()=>{ const u=safeUrl("https://github.com/"+S.ghOwner+"/"+S.ghRepo); if(u) window.open(u,"_blank","noopener") }})
    ]),
    sectionNote("پیش‌فرض ویرایش همیشه روی شاخهٔ feature جدید است، نه main. فایل‌های حساس مسدودند.")]));
  root.appendChild(body);

  async function makeBackup(){
    const d = new Date(); const p = tehranParts(d);
    const stamp = String(p.y)+String(p.m).padStart(2,"0")+String(p.d).padStart(2,"0");
    const name = "backup/pre-console-"+stamp;
    const ok = await confirmDanger("ساخت بکاپ","شاخهٔ «"+name+"» از آخرین commit شاخهٔ main ساخته می‌شود (نقطهٔ بازگشت).");
    if(!ok) return;
    try{ const r = await GH.ref("main"); await GH.createBranch(name, r.object.sha); audit("gh.backup",name); toast("بکاپ ساخته شد: "+name,"ok") }
    catch(e){ toast(e.fa||"خطا","err") }
  }
  async function makeBranch(prefix){
    const n = await promptModal("شاخهٔ جدید","نام شاخه (بدون فاصله)", prefix+"/change-"+uid());
    if(!n) return;
    const name = n.trim().replace(/\s+/g,"-");
    try{ const r = await GH.ref("main"); await GH.createBranch(name, r.object.sha); st.branch=name; audit("gh.branch",name); toast("شاخه ساخته شد: "+name,"ok"); draw() }
    catch(e){ toast(e.fa||"خطا","err") }
  }
  function draw(){
    Array.from(tabs.children).forEach((b,i)=>b.className = tab===T[i][0]?"active":"");
    clear(body);
    if(!S.ghToken && !S.mock){ body.appendChild(el("div",{class:"card",style:{borderColor:"var(--warn)"}},[
      el("b",{text:"توکن GitHub تنظیم نشده است"}), el("p",{text:"برای کار با ریپو، توکن fine-grained را در «تنظیمات اتصال» وارد کنید."}),
      el("button",{class:"btn primary",text:"رفتن به تنظیمات",onclick:()=>location.hash="#/settings"})])); return }
    if(tab==="files") return drawFiles();
    if(tab==="branches") return drawBranches();
    if(tab==="ci") return drawCI();
    return drawRequest();
  }
  function drawFiles(){
    const bsel = el("input",{type:"text",value:st.branch,"aria-label":"شاخه"});
    bsel.addEventListener("change",()=>{ st.branch=bsel.value.trim()||"main"; listFiles() });
    const filter = el("input",{type:"text",placeholder:"جست‌وجوی فایل",value:st.filter,"aria-label":"جست‌وجوی فایل"});
    const list = el("div",{style:{maxHeight:"260px",overflow:"auto"}});
    filter.addEventListener("input",debounce(e=>{ st.filter=e.target.value; renderList() },250));
    const editorBox = el("div",{});
    body.appendChild(card("درخت فایل",[el("div",{class:"row"},[el("span",{class:"small muted",text:"شاخه:"}),bsel,filter]), list]));
    body.appendChild(editorBox);
    let tree=[];
    function renderList(){
      clear(list);
      const f = st.filter.trim().toLowerCase();
      const items = tree.filter(t=>t.type==="blob" && (!f || t.path.toLowerCase().indexOf(f)>=0)).slice(0,400);
      if(!items.length){ list.appendChild(emptyBox("فایلی یافت نشد")); return }
      items.forEach(t=>{
        const sens = SENSITIVE_FILE(t.path);
        const b = el("button",{class:"navlink",style:{direction:"ltr",textAlign:"left"},onclick:()=> sens? toast("این فایل حساس است و باز نمی‌شود.","err") : openFile(t.path)});
        b.appendChild(el("span",{class:"ic",text: sens?"🔒":"📄"}));
        b.appendChild(el("span",{text:t.path}));
        list.appendChild(b);
      });
    }
    async function listFiles(){
      clear(list); list.appendChild(skeleton(5));
      try{ const r = await GH.tree(st.branch); tree=r.tree||[]; renderList() }
      catch(e){ clear(list); list.appendChild(errorBox(e,listFiles)) }
    }
    async function openFile(path){
      clear(editorBox); editorBox.appendChild(skeleton(3));
      try{
        const c = await GH.content(path, st.branch);
        const text = b64decodeUtf8(c.content||"");
        st.path=path; st.sha=c.sha; st.original=text; st.content=text;
        clear(editorBox); editorBox.appendChild(buildEditor(path, text, c.sha));
      }catch(e){ clear(editorBox); editorBox.appendChild(errorBox(e,()=>openFile(path))) }
    }
    function buildEditor(path, text, sha){
      const ta = el("textarea",{"aria-label":"ویرایشگر "+path, spellcheck:"false"});
      ta.value = text;
      const gut = el("div",{class:"gut"});
      const syncGut=()=>{ const n=ta.value.split("\n").length; clear(gut);
        let s=""; for(let i=1;i<=n;i++) s+=i+"\n"; gut.textContent=s; gut.style.height=ta.clientHeight+"px"; gut.scrollTop=ta.scrollTop };
      ta.addEventListener("input",()=>{ st.content=ta.value; syncGut(); S.dirty = (ta.value!==st.original)? ("ویرایش "+path):null; dirtyLbl.textContent = ta.value!==st.original? "تغییرات ذخیره‌نشده":"ذخیره‌شده" });
      ta.addEventListener("scroll",()=>{ gut.scrollTop=ta.scrollTop });
      ta.addEventListener("keydown",e=>{
        if(e.key==="Tab"){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd;
          ta.value = ta.value.slice(0,s)+"  "+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; st.content=ta.value }
      });
      const edWrap = el("div",{class:"editor"},[gut,ta]);
      setTimeout(syncGut,30);
      const findI = el("input",{type:"text",placeholder:"یافتن","aria-label":"یافتن"});
      const repI = el("input",{type:"text",placeholder:"جایگزینی","aria-label":"جایگزینی"});
      const dirtyLbl = el("span",{class:"small muted",text:"ذخیره‌شده"});
      const diffBox = el("div",{class:"diff"});
      const showDiff=()=>{
        clear(diffBox);
        const a = st.original.split("\n"), b = ta.value.split("\n");
        const max = Math.max(a.length,b.length); let shown=0;
        for(let i=0;i<max;i++){
          if(a[i]!==b[i]){
            if(a[i]!==undefined) diffBox.appendChild(el("div",{class:"del",text:"- "+(i+1)+": "+a[i]}));
            if(b[i]!==undefined) diffBox.appendChild(el("div",{class:"add",text:"+ "+(i+1)+": "+b[i]}));
            shown++; if(shown>200){ diffBox.appendChild(el("div",{class:"small muted",text:"… تفاوت‌های بیشتر"})); break }
          }
        }
        if(!shown) diffBox.appendChild(el("div",{class:"small muted",text:"تفاوتی نیست"}));
      };
      async function commit(targetBranch, direct){
        const msg = await promptModal("پیام commit","توضیح تغییر","chore: update "+path);
        if(!msg) return;
        let ok;
        if(direct) ok = await confirmDanger("commit مستقیم روی main","این تغییر مستقیماً روی شاخهٔ main اعمال می‌شود و workflow «Deploy Worker» اجرا خواهد شد (استقرار واقعی).", true);
        else ok = await confirmDanger("commit روی شاخه","فایل «"+path+"» روی شاخهٔ «"+targetBranch+"» ذخیره می‌شود.");
        if(!ok) return;
        try{
          let sha2 = sha;
          if(targetBranch!==st.branch){
            try{ const c2 = await GH.content(path, targetBranch); sha2=c2.sha }catch(e){ sha2=undefined }
          }
          const r = await GH.putContent(path, ta.value, msg, targetBranch, sha2);
          audit("gh.commit", path+" @ "+targetBranch);
          st.original = ta.value; dirtyLbl.textContent="ذخیره‌شده"; S.dirty=null;
          toast("ذخیره شد روی "+targetBranch,"ok");
          if(r && r.commit && r.commit.html_url){ const u=safeUrl(r.commit.html_url); if(u) toast("commit ثبت شد","ok") }
        }catch(e){ toast(e.fa||"خطا","err") }
      }
      return card("ویرایش: "+path, [
        el("div",{class:"row"},[dirtyLbl, el("span",{class:"chip",text:"شاخه: "+st.branch})]),
        el("div",{class:"row"},[findI, repI, el("button",{class:"btn sm",text:"جایگزینی همه",onclick:()=>{
          if(!findI.value) return; const c=ta.value.split(findI.value).length-1;
          ta.value = ta.value.split(findI.value).join(repI.value); st.content=ta.value; syncGut();
          toast("جایگزین شد: "+nf(c)+" مورد","ok"); }})]),
        edWrap,
        el("div",{class:"row"},[
          el("button",{class:"btn",text:"نمایش diff",onclick:showDiff}),
          el("button",{class:"btn primary",text:"commit روی شاخهٔ جاری",onclick:()=>commit(st.branch, st.branch==="main")}),
          el("button",{class:"btn",text:"ساخت شاخه و commit",onclick:async()=>{
            const n = await promptModal("شاخهٔ جدید","نام شاخه","feature/edit-"+uid());
            if(!n) return;
            try{ const r = await GH.ref("main"); await GH.createBranch(n.trim(), r.object.sha); st.branch=n.trim(); await commit(n.trim(), false) }
            catch(e){ toast(e.fa||"خطا","err") }
          }}),
          el("button",{class:"btn ghost",text:"بازگردانی متن",onclick:()=>{ ta.value=st.original; st.content=st.original; syncGut(); dirtyLbl.textContent="ذخیره‌شده"; S.dirty=null }})
        ]),
        diffBox
      ]);
    }
    listFiles();
  }
  function drawBranches(){
    const brBox = el("div",{}), prBox = el("div",{}), cmBox = el("div",{});
    body.appendChild(card("شاخه‌ها و نقاط بازگشت",[brBox]));
    body.appendChild(card("Pull Requestها",[prBox]));
    body.appendChild(card("آخرین commitها",[cmBox]));
    loadInto(brBox, ()=>GH.branches(), list=>{
      const w = el("div",{});
      const backups = list.filter(b=>/^backup\//.test(b.name));
      w.appendChild(el("div",{class:"small muted",text:"بکاپ‌ها / نقاط بازگشت:"}));
      (backups.length? backups:[]).forEach(b=> w.appendChild(el("div",{class:"chip ok",text:b.name})));
      if(!backups.length) w.appendChild(el("div",{class:"small muted",text:"بکاپی نیست"}));
      w.appendChild(el("div",{class:"sep"}));
      list.forEach(b=> w.appendChild(el("div",{class:"kv"},[el("b",{text:b.name}),
        el("span",{},[el("button",{class:"btn sm",text:"انتخاب برای ویرایش",onclick:()=>{ st.branch=b.name; tab="files"; st.tab="files"; draw() }})])])));
      return w;
    });
    loadInto(prBox, ()=>GH.pulls(), list=>{
      const w = el("div",{});
      w.appendChild(el("div",{class:"row"},[el("button",{class:"btn sm primary",text:"ساخت PR از شاخهٔ جاری",onclick:async()=>{
        if(st.branch==="main") return toast("شاخهٔ جاری main است؛ ابتدا شاخهٔ feature بسازید","err");
        const t = await promptModal("ساخت PR","عنوان PR","feat: تغییر از کنسول مالک");
        if(!t) return;
        try{ const r = await GH.createPR(t, st.branch, "main", "ساخته‌شده از کنسول مالک"); audit("gh.pr",String(r.number));
          toast("PR #"+r.number+" ساخته شد","ok"); drawBranches() }catch(e){ toast(e.fa||"خطا","err") }
      }})]));
      if(!list.length) w.appendChild(emptyBox("PR بازی نیست"));
      list.forEach(p=>{
        const row = el("div",{class:"listitem"});
        row.appendChild(el("div",{class:"row",style:{justifyContent:"space-between"}},[el("b",{text:"#"+p.number+" "+String(p.title)}),
          linkNode(p.html_url,"GitHub")]));
        row.appendChild(el("div",{class:"small muted",text:String(p.head&&p.head.ref)+" → "+String(p.base&&p.base.ref)}));
        row.appendChild(el("button",{class:"btn sm danger",text:"merge (squash)",onclick:async()=>{
          const ok = await confirmDanger("merge به main","PR #"+p.number+" در شاخهٔ main ادغام می‌شود و workflow «Deploy Worker» اجرا شده و Worker واقعی به‌روزرسانی می‌شود.", true);
          if(!ok) return;
          try{ await GH.mergePR(p.number); audit("gh.merge","#"+p.number); toast("ادغام شد","ok"); drawBranches() }catch(e){ toast(e.fa||"خطا","err") }
        }}));
        w.appendChild(row);
      });
      return w;
    });
    loadInto(cmBox, ()=>GH.commits("main"), list=> list.length? el("div",{}, list.map(c=>
      el("div",{class:"kv"},[el("b",{text:String(c.commit&&c.commit.message||"").slice(0,60)}),
        el("span",{},[el("span",{class:"small",text:fmtDate(c.commit&&c.commit.author&&c.commit.author.date)+" "}), linkNode(c.html_url,"مشاهده")])]))) : emptyBox("commit نیست"));
  }
  function drawCI(){
    const box = el("div",{});
    body.appendChild(card("اجراهای GitHub Actions",[box]));
    loadInto(box, ()=>GH.runs(), d=>{
      const list = d.workflow_runs||[];
      if(!list.length) return emptyBox("اجرایی نیست");
      return tableFrom([
        {label:"نام",key:"name"},
        {label:"وضعیت",render:r=>statusChip(r.conclusion==="success"?"success":r.status==="completed"?"error":"processing")},
        {label:"زمان",render:r=>el("span",{text:fmtDate(r.created_at)})},
        {label:"لینک",render:r=>linkNode(r.html_url,"باز کردن")}
      ], list);
    });
  }
  function drawRequest(){
    const t = el("input",{type:"text",placeholder:"عنوان قابلیت","aria-label":"عنوان"});
    const d = el("textarea",{placeholder:"توضیح کامل آنچه می‌خواهید","aria-label":"توضیح"});
    const f = el("input",{type:"text",placeholder:"فایل‌های مرتبط (با کاما)","aria-label":"فایل‌ها"});
    const a = el("textarea",{placeholder:"معیار پذیرش (هر خط یک مورد)","aria-label":"معیار پذیرش"});
    const out = el("pre",{text:""});
    const build=()=>{
      const p = "## درخواست قابلیت برای ریپو "+S.ghOwner+"/"+S.ghRepo+"\n\n"+
      "### عنوان\n"+t.value+"\n\n### توضیح\n"+d.value+"\n\n### فایل‌های مرتبط\n"+
      f.value.split(",").map(s=>s.trim()).filter(Boolean).map(s=>"- "+s).join("\n")+
      "\n\n### معیار پذیرش\n"+a.value.split("\n").filter(Boolean).map(s=>"- [ ] "+s).join("\n")+
      "\n\n### محدودیت‌ها\n- هیچ secret در کد/لاگ نیاید.\n- تغییر در شاخهٔ feature و از طریق PR.\n- سازگاری با Cloudflare Worker + D1 + GitHub Actions.\n";
      out.textContent = p; return p;
    };
    body.appendChild(card("درخواست قابلیت جدید",[
      el("label",{class:"field"},[el("span",{text:"عنوان"}),t]),
      el("label",{class:"field"},[el("span",{text:"توضیح"}),d]),
      el("label",{class:"field"},[el("span",{text:"فایل‌های مرتبط"}),f]),
      el("label",{class:"field"},[el("span",{text:"معیار پذیرش"}),a]),
      el("div",{class:"row"},[
        el("button",{class:"btn",text:"ساخت پرامپت",onclick:build}),
        el("button",{class:"btn primary",text:"کپی پرامپت",onclick:()=>copyText(build())}),
        el("button",{class:"btn",text:"ساخت GitHub Issue",onclick:async()=>{
          if(!t.value.trim()) return toast("عنوان لازم است","err");
          const ok = await confirmDanger("ساخت Issue","یک Issue عمومی در ریپو ساخته می‌شود.");
          if(!ok) return;
          try{ const r = await GH.createIssue(t.value.trim(), build()); audit("gh.issue",String(r.number)); toast("Issue #"+r.number+" ساخته شد","ok") }catch(e){ toast(e.fa||"خطا","err") }
        }}),
        el("button",{class:"btn",text:"ساخت فایل docs/requests در شاخهٔ جدید",onclick:async()=>{
          if(!t.value.trim()) return toast("عنوان لازم است","err");
          const slug = t.value.trim().toLowerCase().replace(/[^\w\u0600-\u06FF]+/g,"-").slice(0,40);
          const branch = "feature/request-"+slug+"-"+uid().slice(0,4);
          const ok = await confirmDanger("ساخت شاخه و فایل","شاخهٔ «"+branch+"» از main ساخته و فایل docs/requests/"+slug+".md در آن ایجاد می‌شود.");
          if(!ok) return;
          try{
            const r = await GH.ref("main"); await GH.createBranch(branch, r.object.sha);
            await GH.putContent("docs/requests/"+slug+".md", build(), "docs: request "+slug, branch);
            audit("gh.request_file", slug); toast("ساخته شد روی "+branch,"ok");
          }catch(e){ toast(e.fa||"خطا","err") }
        }})
      ]), out]));
  }
  draw(); root._refresh=draw;
};

/* ---------- PAGE: D1 & Mega ---------- */
PAGES.data = function(root){
  const tBox = el("div",{}), qBox = el("div",{}), mBox = el("div",{});
  root.appendChild(card("جدول‌های D1",[tBox]));
  root.appendChild(card("کوئری فقط‌خواندنی (SELECT)",[qBox]));
  root.appendChild(card("موجودی Mega (فقط‌خواندنی)",[mBox]));
  function loadTables(){
    loadInto(tBox, ()=>api("GET","/api/console/d1/tables"), d=>{
      const items = d.items||d||[];
      const w = el("div",{});
      (items.length? items : D1_TABLES.map(n=>({name:n,row_count:null,columns:[]}))).forEach(t=>{
        const det = el("details",{});
        det.appendChild(el("summary",{text:t.name+(t.row_count!==null&&t.row_count!==undefined?(" — "+nf(t.row_count)+" ردیف"):"")}));
        if((t.columns||[]).length) det.appendChild(tableFrom([{label:"ستون",key:"name"},{label:"نوع",key:"type"},
          {label:"nullable",render:c=>el("span",{text:c.nullable?"بله":"خیر"})}], t.columns));
        det.appendChild(el("div",{class:"row"},[
          el("button",{class:"btn sm",text:"SELECT * (۱۰۰)",onclick:()=>{ sqlArea.value="SELECT * FROM "+t.name+" LIMIT 100"; runQuery() }}),
          el("button",{class:"btn sm ghost",text:"خروجی JSON ستون‌ها",onclick:()=>download(t.name+"-schema.json", JSON.stringify(t,null,2))})
        ]));
        w.appendChild(det);
      });
      w.appendChild(el("div",{class:"row",style:{marginTop:"8px"}},[el("button",{class:"btn",text:"بکاپ D1 (جاب)",onclick:async()=>{
        const ok = await confirmDanger("ثبت درخواست بکاپ D1","درخواست جاب d1_backup در دیتابیس کنسول ثبت می‌شود؛ اجرای واقعی به موتور جاب وابسته است.");
        if(!ok) return;

};

/* ---------- PAGE: Selftest ---------- */
PAGES.selftest = function(root){
  const box = el("div",{});
  root.appendChild(card("خودآزمون کنسول",[el("button",{class:"btn primary",text:"اجرای تست‌ها",onclick:run}), box]));
  function T(name, fn){ return {name, fn} }
  const tests = [
    T("پارسر cron: '0 7 * * *'", ()=>{ const c=parseCron("0 7 * * *"); return c.minute.length===1&&c.minute[0]===0&&c.hour[0]===7 }),
    T("پارسر cron: لیست '7,22,37,52 * * * *'", ()=>{ const c=parseCron("7,22,37,52 * * * *"); return c.minute.join(",")==="7,22,37,52" && c.hour.length===24 }),
    T("پارسر cron: گام '7 */5 * * *'", ()=>{ const c=parseCron("7 */5 * * *"); return c.hour.join(",")==="0,5,10,15,20" }),
    T("پارسر cron: بازه '1-3 * * * *'", ()=>parseCron("1-3 * * * *").minute.join(",")==="1,2,3"),
    T("پارسر cron: عبارت نامعتبر رد شود", ()=>{ try{ parseCron("99 * * *"); return false }catch(e){ return true } }),
    T("۵ اجرای بعدی برای '*/5 * * * *'", ()=>{ const n=cronNext("*/5 * * * *",5); return n.length===5 && (n[1]-n[0])===300000 }),
    T("تبدیل زمان تهران (UTC+3:30 حداقل)", ()=>{ const p=tehranParts(new Date(Date.UTC(2026,0,1,0,0,0))); return p.H===3 && p.M===30 }),
    T("fmtDate خروجی رشته می‌دهد", ()=>typeof fmtDate(new Date())==="string" && fmtDate(null)==="—"),
    T("escapeHTML اسکریپت را خنثی می‌کند", ()=>escapeHTML("<script>alert(1)<\/script>").indexOf("<")<0),
    T("el با متن، innerHTML نمی‌سازد", ()=>{ const n=el("div",{text:"<b>x</b>"}); return n.children.length===0 && n.textContent==="<b>x</b>" }),
    T("safeUrl جاوااسکریپت را رد می‌کند", ()=>safeUrl("javascript:alert(1)")===null && !!safeUrl("https://a.b/c")),
    T("linkNode برای لینک بد، لینک نمی‌سازد", ()=>linkNode("javascript:x").tagName!=="A"),
    T("redaction توکن", ()=>{ const old=S.apiToken; S.apiToken="SECRET123"; const r=redact("Authorization: Bearer SECRET123"); S.apiToken=old; return r.indexOf("SECRET123")<0 }),
    T("redaction الگوی ghp_", ()=>redact("ghp_abcdefghijklmn").indexOf("ghp_abcdefghijklmn")<0),
    T("JSON tree ساخت DOM", ()=>{ const n=jsonTree({a:1,b:[1,2],c:"x"},"root",0); return n.querySelectorAll("details").length>=1 }),
    T("SQL فقط SELECT: SELECT مجاز", ()=>isSelectOnly("SELECT * FROM items")),
    T("SQL: DELETE رد شود", ()=>!isSelectOnly("DELETE FROM items")),
    T("SQL: چند دستور رد شود", ()=>!isSelectOnly("SELECT 1; DROP TABLE items")),
    T("SQL: کامنت + drop رد شود", ()=>!isSelectOnly("SELECT 1 -- x\n; drop table t")),
    T("SQL: LIMIT خودکار", ()=>withLimit("SELECT * FROM items").indexOf("LIMIT")>0),
    T("مسیریاب: parseHash ساده", ()=>parseHash("#/queue")[0]==="queue"),
    T("مسیریاب: پارامتر آیتم", ()=>{ const r=parseHash("#/queue/item/42"); return r[0]==="queue" && r[3]==="42" }),
    T("مسیریاب: مسیر ناشناخته به home", ()=>resolveRoute(["nope"]).page==="home"),
    T("اعداد فارسی", ()=>{ const old=S.persianDigits; S.persianDigits=true; const v=nf(1234); S.persianDigits=old; return /[۰-۹]/.test(v) }),
    T("API_CONTRACT کامل است", ()=>Object.keys(API_CONTRACT).length>=30),
    T("هیچ endpoint انتشار production وجود ندارد", ()=>!Object.keys(API_CONTRACT).some(k=>/publish/i.test(API_CONTRACT[k].p) && API_CONTRACT[k].p.indexOf("test")<0)),
    T("base64 UTF-8 فارسی رفت و برگشت", ()=>b64decodeUtf8(b64encodeUtf8("سلام دنیا ۱۲۳"))==="سلام دنیا ۱۲۳"),
    T("cronToFa رشتهٔ فارسی می‌دهد", ()=>cronToFa("0 7 * * *").length>5),
    T("toCSV ساختار درست", ()=>toCSV(["a","b"],[[1,2]]).split("\n").length===2)
  ];
  async function run(){
    clear(box);
    let pass=0, fail=0;
    for(const t of tests){
      let ok=false, err="";
      try{ ok = !!(await t.fn()) }catch(e){ ok=false; err=String(e&&e.message||e) }
      ok? pass++ : fail++;
      box.appendChild(el("div",{class:"kv"},[el("b",{text:t.name}),
        el("span",{style:{color: ok?"var(--ok)":"var(--err)"}, text: ok? "✅ قبول" : ("❌ رد "+err)})]));
    }
    box.insertBefore(el("div",{class:"row"},[el("span",{class:"chip ok",text:"قبول: "+nf(pass)}), el("span",{class:"chip "+(fail?"err":""),text:"رد: "+nf(fail)})]), box.firstChild);
  }
  run();
};

/* ============================ ROUTER ============================ */
function parseHash(h){
  return String(h||location.hash||"#/home").replace(/^#\/?/,"").split("/").filter(x=>x!=="").map(decodeURIComponent);
}
function resolveRoute(parts){
  const p = parts[0]||"home";
  if(p==="queue" && parts[1]==="item" && parts[2]) return {page:"queueItem", params:[parts[2]], title:"آیتم صف #"+parts[2], nav:"queue"};
  const nav = NAV.find(n=>n.id===p);
  if(!nav) return {page:"home", params:[], title:"داشبورد", nav:"home"};
  return {page:p, params:parts.slice(1), title:nav.t, nav:p};
}
let currentRoute = null;
function clearTimers(){ S.timers.forEach(t=>clearInterval(t)); S.timers=[]; }
function route(){
  if(S.dirty){
    const leave = confirm("تغییرات ذخیره‌نشده دارید ("+S.dirty+"). خروج از این صفحه؟");
    if(!leave){ if(currentRoute) history.replaceState(null,"", "#/"+currentRoute.pathRaw); return }
    S.dirty=null;
  }
  clearTimers();
  if(S.abort){ try{ S.abort.abort() }catch(e){} }
  S.abort = new AbortController();
  const parts = parseHash();
  const r = resolveRoute(parts);
  r.pathRaw = parts.join("/")||"home";
  currentRoute = r;
  $("#pageTitle").textContent = r.title;
  highlightNav(r.nav);
  const page = clear($("#page"));
  const fn = PAGES[r.page] || PAGES.home;
  try{ fn(page, r.params) }catch(e){ page.appendChild(errorBox({fa:"خطای داخلی در رندر صفحه: "+String(e&&e.message)},route)) }
  window.scrollTo(0,0);
  setupAutoRefresh();
}
function highlightNav(id){
  Array.from(document.querySelectorAll("#navlist .navlink")).forEach(b=> b.className = "navlink"+(b.dataset.id===id?" active":""));
  Array.from(document.querySelectorAll("#bottomnav button")).forEach(b=> b.className = (b.dataset.id===id?"active":""));
}
function buildNav(){
  const nl = clear($("#navlist"));
  NAV.forEach(n=>{
    const b = el("button",{class:"navlink", onclick:()=>{ location.hash="#/"+n.id }});
    b.dataset.id = n.id;
    b.appendChild(el("span",{class:"ic",text:n.ic})); b.appendChild(el("span",{text:n.t}));
    nl.appendChild(b);
  });
  const bn = clear($("#bottomnav"));
  NAV.filter(n=>n.main).forEach(n=>{
    const b = el("button",{onclick:()=>{ location.hash="#/"+n.id }, "aria-label":n.t});
    b.dataset.id = n.id;
    b.appendChild(el("span",{class:"ic",text:n.ic})); b.appendChild(el("span",{text:n.t}));
    bn.appendChild(b);
  });
  const more = el("button",{onclick:openMore,"aria-label":"بیشتر"});
  more.appendChild(el("span",{class:"ic",text:"☰"})); more.appendChild(el("span",{text:"بیشتر"}));
  bn.appendChild(more);
}
function openMore(){
  const list = el("div",{});
  NAV.filter(n=>!n.main).forEach(n=>{
    list.appendChild(el("button",{class:"navlink", onclick:()=>{ location.hash="#/"+n.id; const bg=$(".modalbg"); if(bg) bg.remove() }},
      [el("span",{class:"ic",text:n.ic}), el("span",{text:n.t})]));
  });
  modal({title:"بخش‌های بیشتر", body:[list], okText:"بستن", cancelText:"انصراف"});
}
let refreshTimer=null;
function setupAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  if(!S.autoRefresh) return;
  refreshTimer = setInterval(()=>{
    if(document.hidden || S.locked) return;
    const pg = $("#page");
    if(pg && pg._refresh){ invalidate(""); try{ pg._refresh() }catch(e){} }
  }, S.autoRefresh*1000);
}
/* ============================ THEME / LOCK / BOOT ============================ */
function applyTheme(){
  const t = S.theme==="auto" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches? "dark":"light") : S.theme;
  document.documentElement.setAttribute("data-theme", t);
}
function updateMockBadge(){ $("#mockBadge").classList.toggle("hidden", !S.mock) }
function lockScreen(){
  const stored = localStorage.getItem("ra_pin");
  if(!stored){ toast("ابتدا در تنظیمات یک PIN بسازید","warn"); return }
  S.locked = true;
  const inp = el("input",{type:"password","aria-label":"PIN",style:{maxWidth:"220px",textAlign:"center"}});
  const msg = el("div",{class:"small muted",text:"برای ادامه PIN را وارد کنید"});
  const box = el("div",{class:"card",style:{maxWidth:"340px",textAlign:"center"}},[
    el("h3",{text:"صفحه قفل است"}), msg, inp,
    el("button",{class:"btn primary",style:{marginTop:"10px"},text:"باز کردن",onclick:async()=>{
      try{
        const o = JSON.parse(stored);
        const h = await sha256hex(o.salt+":"+inp.value);
        if(h===o.h){ S.locked=false; clear($("#lockRoot")); S.lastActivity=Date.now() }
        else { msg.textContent="PIN نادرست است"; msg.style.color="var(--err)" }
      }catch(e){ msg.textContent="خطا در بررسی PIN" }
    }})
  ]);
  clear($("#lockRoot")).appendChild(el("div",{class:"lock"},[box]));
  inp.focus();
}
function initIdleLock(){
  ["click","keydown","touchstart","mousemove"].forEach(ev=>document.addEventListener(ev,()=>{S.lastActivity=Date.now()},{passive:true}));
  setInterval(()=>{
    if(S.lockMinutes>0 && !S.locked && localStorage.getItem("ra_pin") && (Date.now()-S.lastActivity)>S.lockMinutes*60000) lockScreen();
  },10000);
}
function boot(){
  applyTheme(); updateMockBadge(); buildNav();
  if(window.matchMedia) try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(S.theme==="auto") applyTheme() }) }catch(e){}
  $("#btnTheme").addEventListener("click",()=>{ S.theme = S.theme==="dark"?"light":S.theme==="light"?"auto":"dark"; Store.saveCfg(); applyTheme(); toast("تم: "+({auto:"خودکار",light:"روشن",dark:"تاریک"})[S.theme],"ok",1500) });
  $("#btnRefresh").addEventListener("click",()=>{ invalidate(""); const pg=$("#page"); if(pg&&pg._refresh) pg._refresh(); else route() });
  $("#btnBack").addEventListener("click",()=>{
    const parts = parseHash();
    if(parts[0]==="queue" && parts[1]==="item"){ location.hash="#/queue"; return }
    if(parts[0] && parts[0]!=="home"){ location.hash="#/home"; return }
    if(history.length>1) history.back(); else location.hash="#/home";
  });
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeunload", e=>{ if(S.dirty){ e.preventDefault(); e.returnValue="" } });
  initIdleLock();
  const firstRun = !(localStorage.getItem("ra_cfg")||sessionStorage.getItem("ra_cfg"));
  if(!location.hash || location.hash==="#"||location.hash==="#/") location.hash = firstRun? "#/settings":"#/home";
  else route();
  if(firstRun) setTimeout(()=>toast("اولین اجرا: تنظیمات اتصال را کامل کنید یا «داده‌ی نمایشی» را روشن کنید.","info",6000),500);
  route();
}
document.addEventListener("DOMContentLoaded", boot);
if(document.readyState!=="loading") boot();
