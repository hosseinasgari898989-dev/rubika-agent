name: GitHub Models smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: github-models-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GitHub Models smoke test (no token is printed)
        run: python agent/brain/github_models_smoke.py
