name: Mob X owner-link processor

on:
  push:
    branches:
      - feature/mob-x-link-processor-20261025
    paths:
      - ".github/workflows/mob-x-link-processor.yml"
      - "agent/brain/mob_x_link_processor.py"
  pull_request:
    paths:
      - ".github/workflows/mob-x-link-processor.yml"
      - "agent/brain/mob_x_link_processor.py"
      - "tests/test_mob_x_link_processor.py"
      - "tests/test_mob_x_link_publisher.py"
      - "tests/test_mob_x_rubika.py"
      - "tests/test_mob_x_preflight.py"
      - "scripts/mob_x_preflight.py"
      - "agent/brain/mob_x_link_publisher.py"
      - "agent/brain/mob_x_rubika.py"
      - "src/owner_panel.js"
      - "src/console_api.js"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      panel_link_id:
        description: "Exact confirmed Mob X link ID; empty uses the scheduled queue fallback"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mob-x-link-processor
  cancel-in-progress: false

jobs:
  public-api-probe:
    name: Read-only free X API probe
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies for safe metadata probe
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test free keyless metadata endpoints
        run: python -m agent.brain.mob_x_link_processor --probe --external-id 2107878755079213476

  process-one-confirmed-link:
    name: Claim and stage one confirmed link
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main safely
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check for a confirmed Mob X job before system setup
        id: preflight
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          MOB_X_PANEL_LINK_ID: ${{ inputs.panel_link_id }}
        run: python scripts/mob_x_preflight.py

      - name: Install pinned x-cli v0.5.0 guest fallback
        if: steps.preflight.outputs.has_job == 'true'
        shell: bash
        run: |
          set -uo pipefail
          version="0.5.0"
          archive_name="x_0.5.0_linux_amd64.tar.gz"
          expected_archive_sha256="d722fd04f05c3785202846a1400caa9bcc0f8237947c0e35f6e8cf9efcbd1dd7"
          expected_checksums_sha256="ed391cfa2726d34e7de61ee93aca443731d10bca382da17f0b9683a8cac7c887"
          root="$RUNNER_TEMP/mob-x-x-cli-$version"
          archive="$root/$archive_name"
          checksums="$root/checksums.txt"
          base="https://github.com/tamnd/x-cli/releases/download/v$version"
          fallback() {
            echo "x-cli setup failed closed; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          }
          mkdir -p "$root"
          if ! curl --fail --silent --show-error --location --max-time 15 --retry 0 \
            "$base/$archive_name" --output "$archive" 2>/dev/null; then
            fallback
          fi
          if ! curl --fail --silent --show-error --location --max-time 15 --retry 0 \
            "$base/checksums.txt" --output "$checksums" 2>/dev/null; then
            fallback
          fi
          if ! printf '%s  %s\n' "$expected_checksums_sha256" "$checksums" | sha256sum --check --status; then
            echo "x-cli release checksums file verification failed; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          published_checksum="$(awk -v target="$archive_name" '$2 == target { print $1; exit }' "$checksums")"
          if [[ "$published_checksum" != "$expected_archive_sha256" ]]; then
            echo "x-cli release checksum does not match the pinned v$version asset digest; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          if ! printf '%s  %s\n' "$published_checksum" "$archive" | sha256sum --check --status; then
            echo "x-cli binary checksum verification failed; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          if ! tar -tzf "$archive" >/dev/null 2>&1; then
            echo "x-cli release archive is invalid; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          extract="$root/extract"
          mkdir -p "$extract"
          if ! tar -xzf "$archive" -C "$extract" >/dev/null 2>&1; then
            echo "x-cli release extraction failed; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          binary="$(find "$extract" -maxdepth 3 -type f -name x -perm -u+x -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "x-cli executable missing; FxTwitter/VxTwitter fallback remains enabled."
            exit 0
          fi
          echo "MOB_X_CLI_PATH=$binary" >> "$GITHUB_ENV"
          echo "x-cli v$version verified against checksums; guest-only last fallback enabled."
      - name: Check required existing secret names without printing values
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in AGENT_API_TOKEN MEGA_EMAIL MEGA_PASSWORD RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository Actions secret name(s): %s. Values were not read or printed by this check.\n' "${missing[*]}"
            exit 2
          fi
      - name: Restore cached faster-whisper model
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-mob-x-whisper-small-v1.2.1
      - name: Install pinned speech gate runtime
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        run: python -m pip install --disable-pip-version-check "faster-whisper==1.2.1"
      - name: Install ffmpeg and official MEGAcmd package
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/megacmd-xUbuntu_24.04_amd64.deb"
          curl --fail --silent --show-error --location \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output "$package"
          sudo apt-get update
          sudo apt-get install --yes ffmpeg "$package"
          command -v ffprobe
          ffprobe -version
          command -v mega-login
          command -v mega-put
      - name: Log in to existing MEGA storage
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-whoami >/dev/null
          echo "MEGA login verified; account details are not printed."
      - name: Claim and process the exact owner link
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        id: process
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
          MOB_X_PANEL_LINK_ID: ${{ inputs.panel_link_id }}
          MOB_X_TEST_FORCE_PREVIEW_FAIL: ${{ vars.MOB_X_TEST_FORCE_PREVIEW_FAIL || '' }}
        run: |
          set -euo pipefail
          if [ -n "${MOB_X_PANEL_LINK_ID:-}" ]; then
            python -m agent.brain.mob_x_link_processor --process-one --panel-link-id "$MOB_X_PANEL_LINK_ID" --report "$RUNNER_TEMP/mob-x-link-report.json"
          else
            python -m agent.brain.mob_x_link_processor --process-one --report "$RUNNER_TEMP/mob-x-link-report.json"
          fi
      - name: Notify owner once when a claimed job fails
        if: ${{ failure() && steps.preflight.outputs.has_job == 'true' }}
        continue-on-error: true
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail
          reason="required_secret_missing"
          if [ -s "$RUNNER_TEMP/mob-x-link-report.json" ]; then
            reason="$(python - "$RUNNER_TEMP/mob-x-link-report.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          try:
              value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              candidate = str(value.get("error_code") or "mob_x_processing_failed")
              print(candidate if re.fullmatch(r"[a-z0-9_-]{1,80}", candidate) else "mob_x_processing_failed")
          except Exception:
              print("mob_x_processing_failed")
          PY
          )"
          fi
          detail=""
          if [ -s "$RUNNER_TEMP/mob-x-link-report.json" ]; then
            detail="$(python - "$RUNNER_TEMP/mob-x-link-report.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          try:
              value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              error_class = str(value.get("error_class") or "")
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.]{0,79}", error_class):
                  error_class = ""
              candidate = str(value.get("error_detail") or "")
              candidate = re.sub(r"https?://\S+", "[URL omitted]", candidate, flags=re.IGNORECASE)
              candidate = re.sub(r"(?i)\b(?:token|password|secret|authorization|cookie|api[_-]?key)\s*[:=]\s*\S+", "[REDACTED]", candidate)
              candidate = re.sub(r"\b[A-Za-z0-9_-]{32,}\b", "[REDACTED]", candidate)
              candidate = re.sub(r"[\r\n\t]+", " ", candidate)
              candidate = re.sub(r"[^A-Za-z0-9_. \-\[\]]", "_", candidate)[:150].strip()
              print((error_class + ": " if error_class and candidate else "") + candidate)
          except Exception:
              print("")
          PY
          )"
          fi
          python -m agent.brain.owner_notify --event workflow_failed --workflow "Mob X link processor" --reason "$reason" --detail "$detail" || {
            echo "Owner notification unavailable; safe error code: $reason"
          }
      - name: Log out of MEGA
        if: ${{ always() && steps.preflight.outputs.has_job == 'true' }}
        run: |
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true



  cleanup-terminal-unique-media:
    name: Delete only terminal post-unique Mob X media
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate existing credentials without printing values
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN MEGA_EMAIL MEGA_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing existing Actions secret: $key"
              exit 2
            fi
          done
          if [[ ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::AGENT_API_TOKEN is invalid."
            exit 2
          fi
      - name: Install official MEGAcmd
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/megacmd-xUbuntu_24.04_amd64.deb"
          curl --fail --silent --show-error --location \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output "$package"
          sudo apt-get update
          sudo apt-get install --yes "$package"
          command -v mega-login
          command -v mega-ls
          command -v mega-rm
      - name: Log in to existing MEGA account
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-whoami >/dev/null
          echo "MEGA session verified; account details are not printed."
      - name: Sweep terminal Mob X media (unique names only)
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m agent.brain.mob_x_media_cleanup --report "$RUNNER_TEMP/mob-x-media-cleanup.json"
      - name: Upload safe cleanup summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-x-terminal-media-cleanup
          path: ${{ runner.temp }}/mob-x-media-cleanup.json
          if-no-files-found: warn
          retention-days: 7
      - name: Log out and stop MEGAcmd
        if: always()
        run: |
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true

  publish-one-approved-link:
    name: Publish one owner-approved link to test channel
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014 == 'approved' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout main safely
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Enforce exact test-channel destination without exposing the configured value
        env:
          RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
          RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014: ${{ vars.RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014 }}
        run: |
          set -euo pipefail
          if [ "${RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014:-}" != "approved" ]; then
            echo "::error::Existing Mob X publish approval gate is not approved."
            exit 2
          fi
          if [[ -z "${RUBIKA_CHANNEL_GUID:-}" ]]; then
            echo "::error::RUBIKA_CHANNEL_GUID secret is missing; publication remains blocked."
            exit 2
          fi
          actual_hash="$(printf '%s' "$RUBIKA_CHANNEL_GUID" | sha256sum | awk '{print $1}')"
          if [[ "$actual_hash" != "0c939688dd5536447389134ba514e9353a6ef97214de3c4f848adb53e1cd4ab8" ]]; then
            echo "::error::RUBIKA_CHANNEL_GUID SHA-256 does not match the registered test-channel pin; publication remains blocked."
            exit 2
          fi
          echo "Existing Mob X approval gate and exact test-channel destination validated; no values printed."
      - name: Claim and publish one owner-approved job at most once
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
          RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014: ${{ vars.RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014 }}
        run: |
          set -euo pipefail
          python -m agent.brain.mob_x_link_publisher --publish-one --report "$RUNNER_TEMP/mob-x-publish-report.json"
      - name: Notify owner about publisher failure without exposing secrets
        if: ${{ failure() }}
        continue-on-error: true
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail
          reason="mob_x_publisher_workflow_failed"
          if [ -s "$RUNNER_TEMP/mob-x-publish-report.json" ]; then
            reason="$(python - "$RUNNER_TEMP/mob-x-publish-report.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          try:
              row = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              value = str(row.get("error_code") or "mob_x_publisher_workflow_failed")
              print(value if re.fullmatch(r"[a-z0-9_-]{1,80}", value) else "mob_x_publisher_workflow_failed")
          except Exception:
              print("mob_x_publisher_workflow_failed")
          PY
          )"
          fi
          python -m agent.brain.owner_notify --event workflow_failed --workflow "Mob X test publisher" --reason "$reason" || {
            echo "Owner notification unavailable; safe error code: $reason"
          }
