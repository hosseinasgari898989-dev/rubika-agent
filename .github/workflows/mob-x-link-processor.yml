name: Mob X owner-link processor

on:
  push:
    branches:
      - feature/mob-x-link-processor-20261025
    paths:
      - ".github/workflows/mob-x-link-processor.yml"
      - "agent/brain/mob_x_link_processor.py"
  pull_request:
    paths:
      - ".github/workflows/mob-x-link-processor.yml"
      - "agent/brain/mob_x_link_processor.py"
      - "tests/test_mob_x_link_processor.py"
      - "src/console_api.js"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mob-x-link-processor
  cancel-in-progress: false

jobs:
  public-api-probe:
    name: Read-only free X API probe
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies for safe metadata probe
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test free keyless metadata endpoints
        run: python -m agent.brain.mob_x_link_processor --probe --external-id 2107878755079213476

  process-one-confirmed-link:
    name: Claim and stage one confirmed link
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main safely
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check for a confirmed Mob X job before system setup
        id: preflight
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ.get("AGENT_API_BASE_URL", "").rstrip("/")
          token = os.environ.get("AGENT_API_TOKEN", "").strip()
          if not base.startswith("https://") or not token:
              raise SystemExit("mob_x_preflight_credentials_missing")

          def rows(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  value = json.load(response)
              if not isinstance(value, dict) or value.get("ok") is not True:
                  raise RuntimeError("worker_api_response_invalid")
              items = value.get("items")
              if not isinstance(items, list):
                  raise RuntimeError("worker_api_items_missing")
              return [item for item in items if isinstance(item, dict)]

          try:
              jobs = rows("/api/console/jobs?limit=100")
              links = rows("/api/console/links?limit=100")
          except Exception:
              raise SystemExit("mob_x_preflight_worker_api_unavailable") from None

          links_by_id = {str(link.get("id")): link for link in links}
          # Confirmation currently creates status=confirmed; queued is accepted for compatible queues.
          has_job = any(
              job.get("type") == "mob_x_link"
              and job.get("status") in {"queued", "confirmed"}
              and str(job.get("panel_link_id")) in links_by_id
              and links_by_id[str(job.get("panel_link_id"))].get("status") in {"confirmed", "queued"}
              for job in jobs
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_job=" + ("true" if has_job else "false") + "\\n")
          print("has_job=true — confirmed Mob X work found" if has_job else
                "has_job=false — no confirmed Mob X work; downstream setup will be skipped")
          PY
      - name: Check required existing secret names without printing values
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in AGENT_API_TOKEN MEGA_EMAIL MEGA_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository Actions secret name(s): %s. Values were not read or printed by this check.\n' "${missing[*]}"
            exit 2
          fi
      - name: Install ffmpeg and official MEGAcmd package
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/megacmd-xUbuntu_24.04_amd64.deb"
          curl --fail --silent --show-error --location \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output "$package"
          sudo apt-get update
          sudo apt-get install --yes ffmpeg "$package"
          command -v mega-login
          command -v mega-put
      - name: Log in to existing MEGA storage
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-whoami >/dev/null
          echo "MEGA login verified; account details are not printed."
      - name: Claim and process at most one owner link
        if: ${{ steps.preflight.outputs.has_job == 'true' }}
        id: process
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python -m agent.brain.mob_x_link_processor --process-one --report "$RUNNER_TEMP/mob-x-link-report.json"
      - name: Notify owner once when a claimed job fails
        if: ${{ failure() && steps.preflight.outputs.has_job == 'true' }}
        continue-on-error: true
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail
          reason="required_secret_missing"
          if [ -s "$RUNNER_TEMP/mob-x-link-report.json" ]; then
            reason="$(python - "$RUNNER_TEMP/mob-x-link-report.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          try:
              value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              candidate = str(value.get("error_code") or "mob_x_processing_failed")
              print(candidate if re.fullmatch(r"[a-z0-9_-]{1,80}", candidate) else "mob_x_processing_failed")
          except Exception:
              print("mob_x_processing_failed")
          PY
          )"
          fi
          python -m agent.brain.owner_notify --event workflow_failed --workflow "Mob X link processor" --reason "$reason" || {
            echo "Owner notification unavailable; safe error code: $reason"
          }
      - name: Log out of MEGA
        if: ${{ always() && steps.preflight.outputs.has_job == 'true' }}
        run: |
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true
