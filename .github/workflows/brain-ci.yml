name: Agent brain checks

on:
  pull_request:
    paths:
      - "src/index.js"
      - "agent/brain/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - agent-brain-mega-v1
      - feature/rubika-owner-24h-digest
    paths:
      - "agent/brain/**"
      - "agent/source_policy.py"
      - "agent/lifecycle.py"
      - "config/agent_lifecycle.json"
      - "config/mob_official_sources.json"
      - "config/tiktok_source_policy.json"
      - "tests/test_source_policy.py"
      - "tests/test_e2e_batch_from_report.py"
      - "src/index.js"
      - "wrangler.jsonc"
      - "migrations/**"
      - "agent/storage/**"
      - "agent/discovery/**"
      - "termux/**"
      - "relay/**"
      - "render.yaml"
      - "requirements.txt"
      - ".github/workflows/brain-ci.yml"
      - "tests/test_relay.py"
      - "tests/test_relay_client.py"
      - "tests/test_termux_sources.py"
      - "tests/test_termux_mob_x.py"
      - "tests/test_lifecycle.py"
      - "tests/test_termux_daily_discovery.py"
      - "tests/test_collection_gate.py"
      - "tests/test_phone_report_integration.py"
      - "tests/test_discovery_run.py"
      - "config/trusted_sources.json"
      - "tests/test_authorization.py"
      - "tests/test_orchestrator.py"
      - "tests/test_official_stage.py"
      - "tests/test_agent_brain.py"
      - "tests/test_mega_storage.py"
      - "tests/test_ledger.py"
      - "tests/test_storage_cleanup.py"
      - "tests/test_mob_official.py"
      - "tests/test_mob_official_complete.py"
      - "tests/test_mob_official_trial.py"
      - "tests/test_cloud_state.py"
      - "tests/test_error_supervisor.py"
      - "agent/brain/error_supervisor.py"
      - "tests/test_five_hour_gate.py"
      - "agent/brain/five_hour_gate.py"
      - "tests/test_rubika_publisher.py"
      - "tests/test_queue_intake.py"
      - "tests/test_queue_worker.py"
      - "tests/test_owner_notify.py"
      - "tests/test_owner_console.py"
      - "tests/test_workflow_safety.py"
      - ".github/workflows/queue-intake.yml"
      - ".github/workflows/owner-daily-digest.yml"
      - ".github/workflows/owner-digest-refresh.yml"
      - ".github/workflows/owner-console-poll.yml"
      - "tests/test_vision_moderator.py"
      - "tests/worker.test.mjs"
      - "tests/test_migrations.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Python and cloud discovery runtime syntax
        run: python -m compileall -q agent relay termux
      - name: Run brain and storage unit tests
        id: brain_tests
        run: |
          python -m unittest discover -s tests -p 'test_agent_brain.py' -v
          python -m unittest discover -s tests -p 'test_source_policy.py' -v
          python -m unittest discover -s tests -p 'test_e2e_batch_from_report.py' -v
          python -m unittest discover -s tests -p 'test_authorization.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator.py' -v
          python -m unittest discover -s tests -p 'test_official_stage.py' -v
          python -m unittest discover -s tests -p 'test_mega_storage.py' -v
          python -m unittest discover -s tests -p 'test_ledger.py' -v
          python -m unittest discover -s tests -p 'test_storage_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_mob_official.py' -v
          python -m unittest discover -s tests -p 'test_mob_official_complete.py' -v
          python -m unittest discover -s tests -p 'test_mob_official_trial.py' -v
          python -m unittest discover -s tests -p 'test_termux_sources.py' -v
          python -m unittest discover -s tests -p 'test_tiktok_urls.py' -v
          python -m unittest discover -s tests -p 'test_termux_daily_discovery.py' -v
          python -m unittest discover -s tests -p 'test_collection_gate.py' -v
          python -m unittest discover -s tests -p 'test_termux_mob_x.py' -v
          python -m unittest discover -s tests -p 'test_lifecycle.py' -v
          python -m unittest discover -s tests -p 'test_phone_report_integration.py' -v
          python -m unittest discover -s tests -p 'test_discovery_run.py' -v
          python -m unittest discover -s tests -p 'test_cloud_state.py' -v
          python -m unittest discover -s tests -p 'test_error_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_five_hour_gate.py' -v
          python -m unittest discover -s tests -p 'test_rubika_publisher.py' -v
          python -m unittest discover -s tests -p 'test_queue_intake.py' -v
          python -m unittest discover -s tests -p 'test_queue_worker.py' -v
          python -m unittest discover -s tests -p 'test_owner_notify.py' -v
          python -m unittest discover -s tests -p 'test_owner_console.py' -v
          python -m unittest discover -s tests -p 'test_vision_moderator.py' -v
          python -m unittest discover -s tests -p 'test_speech_gate.py' -v
          python -m unittest discover -s tests -p 'test_migrations.py' -v
          python -m unittest discover -s tests -p 'test_workflow_safety.py' -v
          python -m unittest discover -s tests -p 'test_relay.py' -v
          python -m unittest discover -s tests -p 'test_relay_client.py' -v
          node tests/worker.test.mjs

      - name: Get safe advisory diagnosis for CI failure
        if: failure()
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m agent.brain.error_supervisor \
            --event-code workflow_tests_failed \
            --stage tests \
            --error-code test_suite_failed \
            --output-report "$RUNNER_TEMP/ai-supervisor.json" \
            > "$RUNNER_TEMP/ai-supervisor-output.json"
          status=$?
          if [[ "$status" -ne 0 || ! -s "$RUNNER_TEMP/ai-supervisor-output.json" ]]; then
            echo "AI advisor unavailable; the original test failure remains authoritative." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$RUNNER_TEMP/ai-supervisor-output.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          recommendation = result.get("recommendation", {})
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n### AI error advisor (advice only)\\n")
              summary.write(f"- Source: {result.get('source', 'local_fallback')}\\n")
              summary.write(f"- Recommendation: {recommendation.get('action', 'human_review')}\\n")
              summary.write(f"- Reason code: {recommendation.get('reason_code', 'unknown_error')}\\n")
              summary.write(f"- Next step: {recommendation.get('next_step_code', 'review_error_code_and_recent_logs')}\\n")
              summary.write("- Applied automatically: no\\n")
          PY