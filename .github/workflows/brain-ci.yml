name: Agent brain checks

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "agent/brain/**"
      - "src/index.js"
      - "wrangler.jsonc"
      - "migrations/**"
      - "agent/storage/**"
      - "agent/discovery/**"
      - "relay/**"
      - "render.yaml"
      - "requirements.txt"
      - "tests/test_relay.py"
      - "tests/test_relay_client.py"
      - "tests/test_instagram_discovery.py"
      - "tests/test_discovery_run.py"
      - "config/trusted_sources.json"
      - "tests/test_authorization.py"
      - "tests/test_orchestrator.py"
      - "tests/test_official_stage.py"
      - "tests/test_agent_brain.py"
      - "tests/test_mega_storage.py"
      - "tests/test_ledger.py"
      - "tests/test_cloud_state.py"
      - "tests/worker.test.mjs"
      - "tests/test_migrations.py"
      - "tests/test_proxitok_discovery.py"
      - "tests/test_discovery_v7.py"
      - ".github/workflows/brain-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q agent relay
      - name: Run brain and storage unit tests
        run: |
          python -m unittest discover -s tests -p 'test_agent_brain.py' -v
          python -m unittest discover -s tests -p 'test_authorization.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator.py' -v
          python -m unittest discover -s tests -p 'test_official_stage.py' -v
          python -m unittest discover -s tests -p 'test_mega_storage.py' -v
          python -m unittest discover -s tests -p 'test_ledger.py' -v
          python -m unittest discover -s tests -p 'test_discovery_v7.py' -v
          python -m unittest discover -s tests -p 'test_instagram_discovery.py' -v
          python -m unittest discover -s tests -p 'test_discovery_run.py' -v
          python -m unittest discover -s tests -p 'test_cloud_state.py' -v
          python -m unittest discover -s tests -p 'test_migrations.py' -v
          python -m unittest discover -s tests -p 'test_proxitok_discovery.py' -v
          python -m unittest discover -s tests -p 'test_relay.py' -v
          python -m unittest discover -s tests -p 'test_relay_client.py' -v
          node tests/worker.test.mjs
