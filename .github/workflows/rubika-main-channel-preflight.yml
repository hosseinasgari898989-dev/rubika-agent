name: Rubika main-channel credential preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rubika-main-channel-preflight.yml"
      - ".github/workflows/daily-queue-processor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-main-channel-preflight
  cancel-in-progress: false

jobs:
  verify-without-sending:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check that the destination secret is set without displaying it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUBIKA_TOKEN:-}" ]]; then
            echo "::error::RUBIKA_TOKEN is not configured."
            exit 2
          fi
          if [[ -z "${RUBIKA_CHANNEL_GUID:-}" ]]; then
            echo "::error::RUBIKA_CHANNEL_GUID is not configured."
            exit 2
          fi
          if [[ "$RUBIKA_CHANNEL_GUID" == "c0EFohK0f3174377fb6fa422d3ccb230" ]]; then
            echo "::error::RUBIKA_CHANNEL_GUID still points at the test channel."
            exit 2
          fi
          echo "Required credentials exist; channel identifier was not printed."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only the Rubika client
        run: python -m pip install --disable-pip-version-check "rubka==8.1.7"

      - name: Validate bot token and main destination with read-only API calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import logging
          import os
          import sys

          logging.disable(logging.CRITICAL)
          try:
              from rubka import Robot
              bot = Robot(os.environ["RUBIKA_TOKEN"], timeout=15)
              me = bot.get_me()
              if not isinstance(me, dict) or me.get("status") != "OK":
                  raise RuntimeError("bot_authentication_failed")
              chat = bot.get_chat(os.environ["RUBIKA_CHANNEL_GUID"])
              if not isinstance(chat, dict) or chat.get("status") != "OK":
                  raise RuntimeError("main_destination_unavailable")
          except Exception as exc:
              reason = "main_destination_preflight_failed"
              if type(exc).__name__ == "InvalidTokenError":
                  reason = "bot_authentication_failed"
              print(reason, file=sys.stderr)
              raise SystemExit(1) from None
          print("Rubika bot authentication and configured main destination passed. No message was sent.")
          PY
