name: Rubika main-channel credential preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rubika-main-channel-preflight.yml"
      - "agent/brain/main_channel_preflight.py"
      - "agent/brain/test_channel.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-main-channel-preflight
  cancel-in-progress: false

jobs:
  verify-main-channel-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_MAIN_CHANNEL_GUID: ${{ secrets.RUBIKA_MAIN_CHANNEL_GUID }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned Rubka client
        run: python -m pip install --disable-pip-version-check "rubka==8.1.7"

      - name: Check required inputs without displaying values
        shell: bash
        run: |
          set -euo pipefail
          token_present=false
          main_guid_present=false
          [[ -n "${RUBIKA_TOKEN:-}" ]] && token_present=true
          [[ -n "${RUBIKA_MAIN_CHANNEL_GUID:-}" ]] && main_guid_present=true
          echo "token_present=$token_present"
          echo "main_guid_present=$main_guid_present"
          [[ "$token_present" == "true" && "$main_guid_present" == "true" ]]

      - name: Verify bot identity and distinct MAIN destination (read-only)
        run: python -m agent.brain.main_channel_preflight
