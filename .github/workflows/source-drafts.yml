name: Source drafts (wiki quiz to owner PV)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of quiz drafts (1-5)"
        type: string
        required: false
        default: "3"
      send_to_pv:
        description: "Send the drafts to the owner's private chat (otherwise dry run: log only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: source-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      DRAFT_COUNT: ${{ inputs.count }}
      SEND_TO_PV: ${{ inputs.send_to_pv }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build source drafts (never publishes to a channel)
        run: |
          set -euo pipefail
          args=(--count "${DRAFT_COUNT:-3}")
          if [ "${SEND_TO_PV:-false}" = "true" ]; then args+=(--send); fi
          python -m agent.source.draft_run "${args[@]}"
