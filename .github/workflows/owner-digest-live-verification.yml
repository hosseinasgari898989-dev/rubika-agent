name: Temporary private owner digest live verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/owner-digest-live-verification.yml"

permissions:
  contents: read

jobs:
  live-private-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if private credentials are missing
        shell: bash
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; live verification stopped before contacting Rubika."
              exit 2
            fi
          done
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify a real edit on the already-created private message
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from agent.brain.owner_notify import send_owner_notification
          result = send_owner_notification(
              "✅ بررسی زندهٔ ویرایش گزارش روزانه با موفقیت اجرا شد.",
              category="success",
              source="live_verification",
          )
          safe = {key: result.get(key) for key in ("sent", "created", "updated", "reason")}
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          if result.get("sent") is not True or result.get("updated") is not True:
              raise SystemExit("same_message_edit_not_verified")
          PY

      - name: Read-only probe of owner chat identity for Stage 5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["RUBIKA_TOKEN"]
          owner_chat_id = os.environ["RUBIKA_OWNER_CHAT_ID"]
          url = "https://botapi.rubika.ir/v3/" + token + "/getUpdates"
          request = urllib.request.Request(
              url,
              data=json.dumps({"limit": 20}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.loads(response.read(256 * 1024).decode("utf-8"))
          data = payload.get("data") if isinstance(payload, dict) else None
          updates = data.get("updates", []) if isinstance(data, dict) else []
          matches = []
          for update in updates if isinstance(updates, list) else []:
              if not isinstance(update, dict):
                  continue
              message = update.get("new_message")
              if not isinstance(message, dict):
                  continue
              chat_id = str(update.get("chat_id") or message.get("chat_id") or "")
              if chat_id != owner_chat_id:
                  continue
              matches.append({
                  "new_message": update.get("type") == "NewMessage",
                  "chat_equals_sender": str(message.get("sender_id") or "") == chat_id,
                  "sender_present": bool(message.get("sender_id")),
                  "group_flag": bool(update.get("is_group") or message.get("is_group")),
                  "chat_type": str(update.get("chat_type") or message.get("chat_type") or update.get("type") or "")[:24],
              })
          print(json.dumps({
              "api_status_ok": isinstance(payload, dict) and payload.get("status") == "OK",
              "updates_seen": len(updates) if isinstance(updates, list) else 0,
              "owner_chat_updates": matches[:5],
              "message_text_logged": False,
              "identifiers_logged": False,
          }, sort_keys=True))
          PY
