name: Temporary private owner digest live verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/owner-digest-live-verification.yml"

permissions:
  contents: read

jobs:
  live-private-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if private credentials are missing
        shell: bash
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; live verification stopped before contacting Rubika."
              exit 2
            fi
          done
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify a real edit on the already-created private message
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from agent.brain.owner_notify import send_owner_notification
          result = send_owner_notification(
              "✅ بررسی زندهٔ ویرایش گزارش روزانه با موفقیت اجرا شد.",
              category="success",
              source="live_verification",
          )
          safe = {key: result.get(key) for key in ("sent", "created", "updated", "reason")}
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          if result.get("sent") is not True or result.get("updated") is not True:
              raise SystemExit("same_message_edit_not_verified")
          PY
