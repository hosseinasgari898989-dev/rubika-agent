name: Temporary private owner digest live verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/owner-digest-live-verification.yml"

permissions:
  contents: read

jobs:
  live-private-verification:
    if: "${{ github.event.head_commit.message == 'test: verify private owner digest live edit' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      RUBIKA_OWNER_USER_ID: ${{ secrets.RUBIKA_OWNER_USER_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if private credentials are missing
        shell: bash
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID RUBIKA_OWNER_USER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; live verification stopped before contacting Rubika."
              exit 2
            fi
          done
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Exercise the real read-only command poller once
        run: python -m agent.brain.owner_console --once
      - name: Create or refresh the private digest
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.owner_notify --event daily_digest_start > /tmp/digest-first.json
          python - <<'PY'
          import json
          with open("/tmp/digest-first.json", encoding="utf-8") as f:
              result = json.load(f)
          print({"sent": result.get("sent"), "created": result.get("created"), "updated": result.get("updated"), "reason": result.get("reason")})
          if result.get("sent") is not True:
              raise SystemExit("initial_digest_send_failed")
          PY
      - name: Verify that the same private Rubika message can be edited
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.owner_notify --event success --workflow "Live owner digest verification" > /tmp/digest-edit.json
          python - <<'PY'
          import json
          with open("/tmp/digest-edit.json", encoding="utf-8") as f:
              result = json.load(f)
          print({"sent": result.get("sent"), "updated": result.get("updated"), "reason": result.get("reason")})
          if result.get("sent") is not True or result.get("updated") is not True:
              raise SystemExit("same_message_edit_not_verified")
          PY
