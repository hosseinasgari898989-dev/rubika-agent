name: Rubika channel read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-channel-read-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
      RUBIKA_MAIN_CHANNEL_GUID: ${{ secrets.RUBIKA_MAIN_CHANNEL_GUID }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rubka client
        run: python -m pip install --disable-pip-version-check "rubka==8.1.7" "Pillow>=10,<13"
      - name: Read-only get_me and get_chat probe (TEST and MAIN)
        run: python -m agent.brain.channel_read_probe
