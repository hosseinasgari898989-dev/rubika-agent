name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gemini smoke test (no key is printed)
        run: python -m agent.brain.gemini_smoke
