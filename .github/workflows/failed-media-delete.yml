name: Failed media delete

# Started only by the Worker (delete-request route) through GITHUB_DISPATCH_TOKEN; never run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failed-media-delete
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install requests

      - name: Check required credentials without printing them
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ] || [ -z "$AGENT_API_TOKEN" ]; then
            echo "::error::MEGA_EMAIL, MEGA_PASSWORD and AGENT_API_TOKEN secrets are required. Nothing was attempted."
            exit 2
          fi

      - name: Install official MEGAcmd package
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/megacmd-xUbuntu_24.04_amd64.deb"
          curl --fail --silent --show-error --location \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output "$package"
          sudo apt-get update
          sudo apt-get install --yes "$package"
          command -v mega-login
          command -v mega-rm
          command -v mega-ls

      - name: Log in securely
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-whoami >/dev/null
          echo "MEGA login verified; account details are not printed."

      - name: Delete requested originals (mega-rm first, then report)
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: python scripts/failed_media_delete.py

      - name: Log out and stop MEGAcmd
        if: always()
        run: |
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true
