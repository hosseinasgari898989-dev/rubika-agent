name: One-shot UnifAPI quota probe

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - ".github/workflows/unifapi-quota-probe.yml"

permissions:
  contents: read

concurrency:
  group: unifapi-quota-probe-one-shot
  cancel-in-progress: false

jobs:
  one-request-only:
    if: contains(github.event.head_commit.message, '[unifapi-quota-probe-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send exactly one profile request and log rate-limit headers
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_EVENT: ${{ github.event_name }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          url = "https://unifapi.com/tools/x/profile?handle=mobgamesstudios"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "Rubika-Agent-one-shot-quota-probe/1.0",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              },
              method="GET",
          )
          result = {
              "purpose": "one_request_only_rate_limit_probe",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ.get("GH_RUN_ID"),
              "github_run_attempt": os.environ.get("GH_RUN_ATTEMPT"),
              "github_event": os.environ.get("GH_EVENT"),
              "commit": os.environ.get("GH_COMMIT"),
              "request_count_to_unifapi": 1,
              "url": url,
              "retries": 0,
              "paid_api_credits_used": 0,
              "media_downloads": 0,
              "rubika_posts": 0,
          }
          try:
              # Exactly one outbound request to UnifAPI; intentionally no retry.
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read()
                  result["http_status"] = response.status
                  result["response_headers"] = {
                      name: response.headers.get(name)
                      for name in (
                          "Date", "X-RateLimit-Limit", "X-RateLimit-Remaining",
                          "X-RateLimit-Reset", "Retry-After", "Content-Type",
                      )
                      if response.headers.get(name) is not None
                  }
          except urllib.error.HTTPError as exc:
              body = exc.read()
              result["http_status"] = exc.code
              result["response_headers"] = {
                  name: exc.headers.get(name)
                  for name in (
                      "Date", "X-RateLimit-Limit", "X-RateLimit-Remaining",
                      "X-RateLimit-Reset", "Retry-After", "Content-Type",
                  )
                  if exc.headers.get(name) is not None
              }
              result["body_prefix"] = body[:200].decode("utf-8", "replace")
          except Exception as exc:
              result["request_error"] = type(exc).__name__
              result["error_message"] = str(exc)[:200]
              body = b""

          if body:
              try:
                  payload = json.loads(body.decode("utf-8"))
                  items = payload.get("posts", {}).get("items", [])
                  result["json_response"] = True
                  result["profile_handle"] = payload.get("profile", {}).get("handle")
                  result["profile_post_count"] = len(items) if isinstance(items, list) else None
              except (ValueError, UnicodeDecodeError, AttributeError):
                  result["json_response"] = False
                  result["body_prefix"] = body[:200].decode("utf-8", "replace")
          print("UNIFAPI_QUOTA_PROBE=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
