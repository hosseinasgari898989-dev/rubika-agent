name: UnifAPI quota decrement check

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - ".github/workflows/unifapi-quota-probe.yml"

permissions:
  contents: read

concurrency:
  group: unifapi-quota-probe-one-shot
  cancel-in-progress: false

jobs:
  sequential-quota-check:
    if: contains(github.event.head_commit.message, '[unifapi-quota-probe-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Compare rate-limit headers from two consecutive requests
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_EVENT: ${{ github.event_name }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          URL = "https://unifapi.com/tools/x/profile?handle=mobgamesstudios"
          HEADER_NAMES = (
              "Date", "X-RateLimit-Limit", "X-RateLimit-Remaining",
              "X-RateLimit-Reset", "Retry-After", "Content-Type",
          )

          def one_request(index):
              request = urllib.request.Request(
                  URL,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Rubika-Agent-one-shot-quota-probe/1.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
                  method="GET",
              )
              row = {
                  "sequence": index,
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                  "request_count_to_unifapi": 1,
                  "retries": 0,
              }
              body = b""
              headers = None
              try:
                  # One GET only per call; no retries.
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read()
                      row["http_status"] = response.status
                      headers = response.headers
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  row["http_status"] = exc.code
                  headers = exc.headers
                  row["body_prefix"] = body[:160].decode("utf-8", "replace")
              except Exception as exc:
                  row["request_error"] = type(exc).__name__
                  row["error_message"] = str(exc)[:160]
              if headers is not None:
                  row["response_headers"] = {
                      name: headers.get(name) for name in HEADER_NAMES
                      if headers.get(name) is not None
                  }
                  remaining = headers.get("X-RateLimit-Remaining")
                  try:
                      row["remaining_numeric"] = int(remaining) if remaining is not None else None
                  except ValueError:
                      row["remaining_numeric"] = None
              if body:
                  try:
                      payload = json.loads(body.decode("utf-8"))
                      items = payload.get("posts", {}).get("items", [])
                      row["json_response"] = True
                      row["profile_handle"] = payload.get("profile", {}).get("handle")
                      row["profile_post_count"] = len(items) if isinstance(items, list) else None
                  except (ValueError, UnicodeDecodeError, AttributeError):
                      row["json_response"] = False
              return row

          report = {
              "purpose": "compare_rate_limit_remaining_before_and_after_one_additional_get",
              "github_run_id": os.environ.get("GH_RUN_ID"),
              "github_run_attempt": os.environ.get("GH_RUN_ATTEMPT"),
              "github_event": os.environ.get("GH_EVENT"),
              "commit": os.environ.get("GH_COMMIT"),
              "endpoint": URL,
              "requests_max": 2,
              "paid_api_credits_used": 0,
              "media_downloads": 0,
              "rubika_posts": 0,
              "results": [],
          }
          first = one_request(1)
          report["results"].append(first)
          # Do not issue a second call after a failed/limited first response.
          if first.get("http_status") == 200:
              second = one_request(2)
              report["results"].append(second)
          if len(report["results"]) == 2:
              a = report["results"][0].get("remaining_numeric")
              b = report["results"][1].get("remaining_numeric")
              report["remaining_change_first_to_second"] = (b - a) if a is not None and b is not None else None
              report["interpretation"] = (
                  "counter_decreased_by_one" if a is not None and b == a - 1
                  else "counter_unchanged" if a is not None and b == a
                  else "counter_changed_otherwise_or_headers_missing"
              )
          else:
              report["interpretation"] = "second_request_skipped_after_first_failure"
          print("UNIFAPI_QUOTA_COMPARISON=" + json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY
