name: Mob official X news publisher (gated)

on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-official-mob-x-production
  cancel-in-progress: false

jobs:
  publish-all-new-official-x-posts-in-window:
    # Keep the five-hour publisher asleep until the owner explicitly approves production.
    if: ${{ vars.RUBIKA_AGENT_MOB_X_PUBLISH_GATE_20261014 == 'approved' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
    steps:
      - name: Check out the current main agent
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate launch boundary and required secrets
        id: validate_launch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from agent.lifecycle import load_lifecycle_policy
          policy = load_lifecycle_policy()
          if policy["mode"] != "production" or policy["birth_datetime"] is None:
              raise SystemExit("Mob news requires its own valid production born_at boundary.")
          cfg = json.loads(Path("config/mob_official_sources.json").read_text(encoding="utf-8"))
          publishing = cfg.get("publishing", {})
          if not (publishing.get("enabled") is True and publishing.get("mode") == "production" and publishing.get("production_enabled") is True):
              raise SystemExit("Mob production publishing is not explicitly enabled in config.")
          if publishing.get("target_channel_guid_sha256") != "0c939688dd5536447389134ba514e9353a6ef97214de3c4f848adb53e1cd4ab8" or publishing.get("max_posts_per_run") != 1:
              raise SystemExit("Mob production publishing must remain locked to the fixed test channel and one-post config cap.")
          print("Mob-only launch boundary, production config, and fixed test destination verified.")
          PY
          missing=0
          for key in AGENT_API_TOKEN GROQ_API_KEY OPENROUTER_API_KEY RUBIKA_TOKEN RUBIKA_CHANNEL_GUID RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Actions secret: $key. No post will be sent."
              missing=1
            fi
          done
          if [[ "${AGENT_API_TOKEN:-}" && ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::AGENT_API_TOKEN is too short. No post will be sent."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 2; fi
          actual_hash="$(printf '%s' "$RUBIKA_CHANNEL_GUID" | sha256sum | awk '{print $1}')"
          if [[ "$actual_hash" != "0c939688dd5536447389134ba514e9353a6ef97214de3c4f848adb53e1cd4ab8" ]]; then
            echo "::error::Production Mob publishing is locked to the registered test-channel hash."
            exit 2
          fi

      - name: Record Mob automation start in the single editable owner digest
        continue-on-error: true
        run: |
          python -m agent.brain.owner_notify \
            --message '📰 شروع بررسی خبرهای رسمی Mob در پنجرهٔ پنج‌ساعته.' \
            --workflow 'Mob official X news'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies and media validator
        id: install_dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Publish at most one oldest eligible Mob X post
        id: publish_official_x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mob-x-production-media
          report="$RUNNER_TEMP/mob-x-production-report.json"
          media_dir="artifacts/mob-x-production-media/attempt-1"
          set +e
          python -m agent.brain.mob_official_trial \
            --publish \
            --limit 1 \
            --source-platform x \
            --report "$report" \
            --output-dir "$media_dir"
          run_status=$?
          set -e
          if [[ ! -s "$report" ]]; then
            echo "::error::Mob publisher returned without a report; stopping safely."
            exit 1
          fi
          cp "$report" artifacts/mob-x-production-report.json
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "unknown"))' "$report")"
          if [[ "$status" == "published" ]]; then
            published=1
          elif [[ "$status" == "nothing_new" ]]; then
            published=0
          else
            echo "::error::Mob publisher stopped on status $status; no post retry will be attempted in this run."
            exit 1
          fi
          if [[ "$run_status" -ne 0 && "$status" != "published" && "$status" != "nothing_new" ]]; then
            echo "::error::Mob publisher command failed; no retry will be attempted in this run."
            exit 1
          fi
          echo "Verified posts published in this run: $published"
          echo "published_count=$published" >> "$GITHUB_OUTPUT"

      - name: Get safe AI diagnosis for gated official-news failure
        if: failure()
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        shell: bash
        run: |
          set +e
          event_code="official_news_failed"
          stage="official_news"
          error_code="mob_x_production_failed"
          if [[ "${{ steps.validate_launch.outcome }}" == "failure" ]]; then error_code="launch_boundary_failed"; fi
          if [[ "${{ steps.install_dependencies.outcome }}" == "failure" ]]; then error_code="dependency_install_failed"; fi
          python -m agent.brain.error_supervisor \
            --event-code "$event_code" \
            --stage "$stage" \
            --error-code "$error_code" \
            --output-report "$RUNNER_TEMP/ai-supervisor.json" \
            > "$RUNNER_TEMP/ai-supervisor-output.json"
          advisor_status=$?
          if [[ "$advisor_status" -ne 0 || ! -s "$RUNNER_TEMP/ai-supervisor-output.json" ]]; then
            echo "AI advisor unavailable; the original official-news failure remains authoritative." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$RUNNER_TEMP/ai-supervisor-output.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          recommendation = result.get("recommendation", {})
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n### AI error advisor (advice only)\\n")
              summary.write(f"- Source: {result.get('source', 'local_fallback')}\\n")
              summary.write(f"- Recommendation: {recommendation.get('action', 'human_review')}\\n")
              summary.write(f"- Reason code: {recommendation.get('reason_code', 'unknown_error')}\\n")
              summary.write(f"- Next step: {recommendation.get('next_step_code', 'review_error_code_and_recent_logs')}\\n")
              summary.write("- Applied automatically: no\\n")
          PY

      - name: Notify owner if production processing failed
        if: failure()
        continue-on-error: true
        run: |
          python -m agent.brain.owner_notify \
            --event workflow_failed \
            --workflow "Mob official X news publisher" \
            --reason "mob_x_production_workflow_failed"

      - name: Upload post report and recoverable media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-x-production-report
          path: |
            artifacts/mob-x-production-report.json
            artifacts/mob-x-production-media/**
          if-no-files-found: warn
          retention-days: 7
