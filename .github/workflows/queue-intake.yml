name: Add Termux discoveries to persistent queue

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "artifacts/termux_discovery.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: rubika-agent-queue-intake
  cancel-in-progress: false

jobs:
  enqueue-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
    steps:
      - name: Check out submitted metadata report
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate and enqueue metadata
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Missing AGENT_API_TOKEN secret; no queue records were added."
            exit 2
          fi
          python -m agent.brain.queue_intake --report artifacts/termux_discovery.json

      - name: Start the daily queue worker now
        id: dispatch_daily
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_code="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/hosseinasgari898989-dev/rubika-agent/actions/workflows/automation-daily-queue.yml/dispatches")"
          if [[ "$response_code" != "204" ]]; then
            echo "::warning::Queue was saved, but immediate processing dispatch returned HTTP $response_code. The daily schedule will continue to process the backlog."
            exit 1
          fi
          echo "The saved queue was dispatched to the daily processor; the persistent UTC-day cap still limits sending to four successful edits."

      - name: Notify owner if immediate processing dispatch failed
        if: steps.dispatch_daily.outcome == 'failure'
        continue-on-error: true
        run: |
          python -m agent.brain.owner_notify \
            --event workflow_failed \
            --workflow "Queue intake: immediate dispatch" \
            --reason "daily_queue_dispatch_failed"

      - name: Notify owner if intake failed
        if: failure()
        continue-on-error: true
        run: |
          python -m agent.brain.owner_notify \
            --event workflow_failed \
            --workflow "Queue intake" \
            --reason "queue_intake_failed"

      - name: Upload intake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-queue-intake
          path: artifacts/termux_discovery.json
          if-no-files-found: warn
          retention-days: 7
