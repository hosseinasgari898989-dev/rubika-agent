name: Wiki read smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wiki read smoke test
        run: python agent/brain/wiki_smoke.py
