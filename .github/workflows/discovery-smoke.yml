name: Public discovery diagnostic

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "agent/discovery/**"
      - ".github/workflows/discovery-smoke.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check yt-dlp==2026.08.19
      - name: Run canonical URL extraction tests
        run: python -m agent.discovery.run --self-test
      - name: Run public discovery only
        continue-on-error: true
        run: python -m agent.discovery.run --live
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-discovery-diagnostic
          path: artifacts/discovery_report.json
          if-no-files-found: warn
          retention-days: 7
