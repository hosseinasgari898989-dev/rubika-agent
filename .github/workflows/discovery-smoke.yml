name: Public discovery diagnostic

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "agent/discovery/**"
      - "termux/**"
      - "artifacts/termux_discovery.json"
      - ".github/workflows/discovery-smoke.yml"
      - "requirements.txt"
      - "artifacts/termux_discovery.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check yt-dlp==2026.08.19
      - name: Run canonical URL extraction tests
        run: python -m agent.discovery.run --self-test
      - name: Merge metadata and run discovery diagnostics
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          INSTAGRAM_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_USER_ID: ${{ secrets.INSTAGRAM_GRAPH_USER_ID }}
          INSTAGRAM_GRAPH_API_VERSION: v26.0
        run: python -m agent.discovery.run --live
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-discovery-diagnostic
          path: artifacts/discovery_report.json
          if-no-files-found: warn
          retention-days: 7
