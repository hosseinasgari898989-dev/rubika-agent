name: Refresh Rubika owner digest from cloud AI events

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-owner-digest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh digest only when recorded cloud AI events changed it
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; digest refresh was skipped."
              exit 2
            fi
          done
          python -m agent.brain.owner_notify --event digest_refresh
