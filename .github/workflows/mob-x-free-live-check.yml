name: Free Mob X discovery live check

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - ".github/workflows/mob-x-free-live-check.yml"
      - "agent/discovery/termux_mob_x.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-mob-x-live-check
  cancel-in-progress: false

jobs:
  discover-public-post-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"

      - name: Search public indexes and verify X post metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from agent.discovery.termux_mob_x import discover_mob_x_posts

          rows, attempts = discover_mob_x_posts(max_results=12, timeout_seconds=10, sleep_seconds=0.1)
          safe_rows = [{
              "id": row.get("id"),
              "title": row.get("title"),
              "published_at": row.get("published_at"),
              "media_type": row.get("media_type"),
              "canonical_url": row.get("canonical_url"),
              "official_handle_verified": row.get("author") == "@mobgamesstudios",
              "actual_media_url_verified": bool(row.get("media_url")),
          } for row in rows]
          payload = {
              "mode": "read_only_metadata_check",
              "source": "@mobgamesstudios",
              "candidate_count": len(rows),
              "candidates": safe_rows,
              "attempts": attempts,
              "downloads": 0,
              "rubika_posts": 0,
              "paid_api_credits_used": 0,
          }
          Path("artifacts/mob-x-free-live-check.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "candidate_count": payload["candidate_count"],
              "attempts": attempts,
              "downloads": 0,
              "rubika_posts": 0,
              "paid_api_credits_used": 0,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload live-check metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-x-free-live-check
          path: artifacts/mob-x-free-live-check.json
          if-no-files-found: warn
          retention-days: 7
