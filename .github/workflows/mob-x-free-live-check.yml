name: Free Mob X discovery live check

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - ".github/workflows/mob-x-free-live-check.yml"
      - "agent/discovery/termux_mob_x.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-mob-x-live-check
  cancel-in-progress: false

jobs:
  discover-public-post-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public metadata dependencies
        run: |
          python -m pip install --disable-pip-version-check "requests>=2.31,<3" "yt-dlp==2026.08.19"

      - name: Test public X profile metadata using yt-dlp without login
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from yt_dlp import YoutubeDL

          options = {
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
              "extract_flat": "in_playlist",
              "playlistend": 12,
              "socket_timeout": 15,
              "retries": 1,
              "extractor_retries": 1,
              "noplaylist": False,
          }
          try:
              with YoutubeDL(options) as ydl:
                  info = ydl.extract_info("https://x.com/mobgamesstudios", download=False)
              entries = info.get("entries", []) if isinstance(info, dict) else []
              rows = [{
                  "id": str(row.get("id") or ""),
                  "url": str(row.get("url") or ""),
                  "title": str(row.get("title") or "")[:160],
                  "timestamp_available": bool(row.get("timestamp") or row.get("upload_date")),
                  "media_available": bool(row.get("url") or row.get("id")),
              } for row in entries[:12] if isinstance(row, dict)]
              print(json.dumps({
                  "extractor": info.get("extractor_key") if isinstance(info, dict) else None,
                  "entry_count": len(rows),
                  "entries": rows[:3],
                  "login_cookies_used": False,
                  "downloaded_media": False,
              }, ensure_ascii=False))
          except Exception as exc:
              print(json.dumps({
                  "ok": False,
                  "error_type": type(exc).__name__,
                  "error_code": str(exc).split(":", 1)[0][:100],
                  "login_cookies_used": False,
                  "downloaded_media": False,
              }, ensure_ascii=False))
          PY

      - name: Search public indexes and verify X post metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from agent.discovery.termux_mob_x import discover_mob_x_posts

          rows, attempts = discover_mob_x_posts(max_results=12, timeout_seconds=10, sleep_seconds=0.1)
          safe_rows = [{
              "id": row.get("id"),
              "title": row.get("title"),
              "published_at": row.get("published_at"),
              "media_type": row.get("media_type"),
              "canonical_url": row.get("canonical_url"),
              "official_handle_verified": row.get("author") == "@mobgamesstudios",
              "actual_media_url_verified": bool(row.get("media_url")),
          } for row in rows]
          payload = {
              "mode": "read_only_metadata_check",
              "source": "@mobgamesstudios",
              "candidate_count": len(rows),
              "candidates": safe_rows,
              "attempts": attempts,
              "downloads": 0,
              "rubika_posts": 0,
              "paid_api_credits_used": 0,
          }
          Path("artifacts/mob-x-free-live-check.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "candidate_count": payload["candidate_count"],
              "attempts": attempts,
              "downloads": 0,
              "rubika_posts": 0,
              "paid_api_credits_used": 0,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Probe free public X profile endpoint (read-only; no media or publishing)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          report = {
              "mode": "read_only_profile_discovery_probe",
              "source": "unifapi_public_x_profile",
              "handle": "mobgamesstudios",
              "paid_api_credits_used": 0,
              "cookies_used": False,
              "media_downloads": 0,
              "rubika_posts": 0,
          }
          url = "https://unifapi.com/tools/x/profile"
          try:
              response = requests.get(
                  url,
                  params={"handle": "mobgamesstudios"},
                  headers={"User-Agent": "Rubika-Agent-public-metadata-probe/1.0", "Accept": "application/json"},
                  timeout=12,
                  allow_redirects=True,
              )
              report["http_status"] = response.status_code
              report["content_type"] = response.headers.get("content-type", "")[:100]
              report["rate_limit_headers"] = {key: response.headers.get(key) for key in ("X-RateLimit-Limit", "X-RateLimit-Remaining", "X-RateLimit-Reset") if response.headers.get(key) is not None}
              report["final_host"] = (requests.utils.urlparse(response.url).hostname or "")[:120]
              try:
                  payload = response.json()
              except (ValueError, json.JSONDecodeError):
                  payload = None
                  report["json_parse"] = "failed"
                  report["body_prefix"] = response.text[:120].replace("\\n", " ")
              if isinstance(payload, dict):
                  report["json_parse"] = "ok"
                  report["top_level_keys"] = sorted(str(key)[:80] for key in payload.keys())[:40]
                  collections = []

                  def inspect(node, path="$", depth=0):
                      if depth > 3:
                          return
                      if isinstance(node, dict):
                          for key, value in list(node.items())[:60]:
                              child_path = f"{path}.{str(key)[:60]}"
                              if isinstance(value, list):
                                  dict_rows = [row for row in value[:5] if isinstance(row, dict)]
                                  if dict_rows:
                                      collections.append({
                                          "path": child_path,
                                          "row_count_reported": len(value),
                                          "sample_keys": sorted(str(k)[:80] for k in dict_rows[0].keys())[:40],
                                      })
                                  inspect(value, child_path, depth + 1)
                              elif isinstance(value, dict):
                                  inspect(value, child_path, depth + 1)
                      elif isinstance(node, list):
                          for index, value in enumerate(node[:3]):
                              if isinstance(value, (dict, list)):
                                  inspect(value, f"{path}[{index}]", depth + 1)

                  inspect(payload)
                  report["collections"] = collections[:20]
                  # The profile endpoint nests recent posts under posts.items. Only use it for IDs;
                  # canonical caption, timestamp, author and media must independently pass X syndication.
                  posts_container = payload.get("posts")
                  items = posts_container.get("items") if isinstance(posts_container, dict) else payload.get("items")
                  if isinstance(items, list):
                      report["profile_post_count"] = len(items)
                      from agent.discovery.termux_mob_x import _fetch_post, POST_ID_RE, _post_id_from_url
                      session = requests.Session()
                      verified_count = 0
                      samples = []
                      for row in items[:3]:
                          if not isinstance(row, dict):
                              continue
                          raw_id = str(row.get("id") or row.get("post_id") or row.get("tweet_id") or "").strip()
                          listed_url = str(row.get("url") or row.get("permalink") or "").strip()
                          post_id = _post_id_from_url(listed_url) or (raw_id if POST_ID_RE.fullmatch(raw_id) else None)
                          author = row.get("author") or row.get("username") or row.get("handle") or ""
                          if isinstance(author, dict):
                              author = author.get("username") or author.get("handle") or author.get("screen_name") or ""
                          sample = {
                              "listed_id": raw_id[:60],
                              "listed_url": listed_url[:240],
                              "listed_author": str(author)[:120],
                              "listed_timestamp": str(row.get("createdAt") or row.get("created_at") or row.get("timestamp") or row.get("date") or "")[:100],
                              "syndication_result": "no_usable_post_id",
                          }
                          if post_id:
                              verified, result = _fetch_post(session, post_id, timeout_seconds=10)
                              sample["syndication_result"] = result
                              if verified:
                                  verified_count += 1
                                  sample["verified_author"] = str(verified.get("author") or "")[:120]
                                  sample["verified_published_at"] = verified.get("published_at")
                                  sample["verified_media_type"] = verified.get("media_type")
                                  sample["verified_media_host"] = (requests.utils.urlparse(str(verified.get("media_url") or "")).hostname or "")[:120]
                                  sample["verified_canonical_url"] = str(verified.get("canonical_url") or "")[:240]
                                  sample["verified_caption_chars"] = len(str(verified.get("original_caption") or ""))
                          samples.append(sample)
                      report["syndication_verified_count"] = verified_count
                      report["profile_post_samples"] = samples
                  for key in ("items", "posts", "tweets", "results", "data"):
                      value = payload.get(key)
                      if isinstance(value, list) and value and isinstance(value[0], dict):
                          row = value[0]
                          report["sample_candidate"] = {
                              "container": key,
                              "id": str(row.get("id") or row.get("post_id") or row.get("tweet_id") or "")[:80],
                              "url": str(row.get("url") or row.get("permalink") or "")[:240],
                              "author": str(row.get("author") or row.get("username") or row.get("handle") or "")[:120],
                              "timestamp": str(row.get("created_at") or row.get("timestamp") or row.get("date") or "")[:100],
                              "text_prefix": str(row.get("text") or row.get("full_text") or row.get("content") or row.get("caption") or "")[:160],
                          }
                          break
                  err = payload.get("error")
                  if isinstance(err, dict):
                      report["service_error_type"] = str(err.get("type") or "")[:100]
                      report["service_error"] = str(err.get("message") or "")[:160]
                  elif isinstance(err, str):
                      report["service_error"] = err[:160]
              else:
                  report.setdefault("json_parse", "not_a_json_object")
          except requests.RequestException as exc:
              report["request_error_type"] = type(exc).__name__
          Path("artifacts/mob-x-unifapi-probe.json").parent.mkdir(parents=True, exist_ok=True)
          Path("artifacts/mob-x-unifapi-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload live-check metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-x-free-live-check
          path: |
            artifacts/mob-x-free-live-check.json
            artifacts/mob-x-unifapi-probe.json
          if-no-files-found: warn
          retention-days: 7
