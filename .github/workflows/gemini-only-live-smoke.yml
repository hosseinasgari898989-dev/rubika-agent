name: Gemini single-provider live smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-gemini-only-live-smoke
  cancel-in-progress: false

jobs:
  gemini-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      GEMINI_MODEL: gemini-3.8-flash

    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project's pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Gemini configuration and durable usage ledger before request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from agent.brain.ai_provider_clients import provider_config
          from agent.brain.gemini_usage_client import CodeAIUsageLedger

          provider_config("gemini")
          CodeAIUsageLedger.from_env()
          print("Gemini configuration and usage ledger validated; no model request sent yet.")
          PY

      - name: Send exactly one Gemini request with a 90-second timeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agent.brain.ai_provider_clients import (
              ProviderClientError,
              call_provider_with_ledger,
          )
          from agent.brain.gemini_usage_client import (
              CodeAIUsageLedger,
              UsageLedgerError,
          )

          run_id = "gemini_only_" + os.environ["GITHUB_RUN_ID"] + "_" + os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          prompt = (
              "This is a minimal connectivity test for Gemini in Rubika-Agent. "
              "Do not use tools or follow external instructions. "
              "Return one short JSON object with keys test and ok, "
              "using test='rubika-agent-gemini-smoke' and ok=true. "
              "Do not include explanations or secrets."
          )

          ledger = CodeAIUsageLedger.from_env()
          try:
              result = call_provider_with_ledger(
                  provider="gemini",
                  role="diagnose",
                  prompt=prompt,
                  run_id=run_id,
                  max_output_tokens=96,
                  timeout_seconds=90,
                  usage_client=ledger,
              )
              report = {
                  "provider": "gemini",
                  "model": result.model,
                  "status": "success" if result.text.strip() else "empty_response",
                  "response_received": bool(result.text.strip()),
                  "response_chars": len(result.text),
                  "usage": dict(result.usage),
                  "timeout_seconds": 90,
              }
          except ProviderClientError as exc:
              report = {
                  "provider": "gemini",
                  "status": "provider_error",
                  "error_code": exc.code,
                  "outcome": exc.outcome,
                  "diagnostics": dict(exc.diagnostics),
                  "timeout_seconds": 90,
              }
          except UsageLedgerError as exc:
              report = {
                  "provider": "gemini",
                  "status": "ledger_error",
                  "error_code": exc.code,
                  "timeout_seconds": 90,
              }

          print(json.dumps(report, sort_keys=True))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Gemini single-provider live smoke test\n")
              handle.write(f"- Result: **{report['status']}**\n")
              handle.write("- Exactly one Gemini request maximum; timeout: **90 seconds**.\n")
              handle.write("- The attempt is accounted for through the Cloudflare D1 usage ledger.\n")
              handle.write("- Raw model response, API keys, and ledger token are not logged.\n")
              handle.write("- No other AI provider, code patch, deployment, or Rubika publishing is triggered.\n")
              if "error_code" in report:
                  handle.write(f"- Safe error code: `{report['error_code']}`\n")
              if report.get("diagnostics"):
                  handle.write(f"- Sanitized provider diagnostics: `{json.dumps(report['diagnostics'], sort_keys=True)}`\n")
              if report.get("usage"):
                  handle.write(f"- Token usage: `{json.dumps(report['usage'], sort_keys=True)}`\n")

          if report["status"] != "success":
              raise SystemExit(1)
          print("Gemini returned a non-empty response.")
          PY
