name: Mob Entertainment X news preview

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "artifacts/termux_discovery.json"

permissions:
  contents: read

concurrency:
  group: rubika-agent-mob-x-preview
  cancel-in-progress: false

jobs:
  preview-one-official-x-post:
    # Intentionally preview-only during development; no Rubika publishing credentials are provided.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
    steps:
      - name: Check out the experimental code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: false

      - name: Validate the private Cloudflare agent connection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Missing or invalid AGENT_API_TOKEN; preview stopped before discovering or downloading media."
            exit 2
          fi
          echo "X preview mode verified. RUBIKA_TOKEN and RUBIKA_CHANNEL_GUID are deliberately not provided."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies and media validator
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version | head -n 1

      - name: Discover X, translate its real caption, and validate its actual media
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.mob_official_trial \
            --limit 1 \
            --report artifacts/mob-x-preview-report.json \
            --output-dir artifacts/mob-x-preview-media

      - name: Upload X preview report and recovery media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-x-preview
          path: |
            artifacts/mob-x-preview-report.json
            artifacts/mob-x-preview-media/**
          if-no-files-found: warn
          retention-days: 7
