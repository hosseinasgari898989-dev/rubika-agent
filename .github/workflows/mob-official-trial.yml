name: Official Mob media trial

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "artifacts/mob-official-trial-request.json"

permissions:
  contents: read

jobs:
  official-mob-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Validate one-post request and required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "agent-brain-mega-v1" ]]; then
            echo "::error::Run this trial only from agent-brain-mega-v1."
            exit 2
          fi
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Missing or invalid AGENT_API_TOKEN secret."
            exit 2
          fi
          TRIAL_MODE="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/mob-official-trial-request.json")
          if not path.is_file():
              raise SystemExit("Official Mob request file is missing; no media was downloaded.")
          request = json.loads(path.read_text(encoding="utf-8"))
          mode = request.get("mode", "preview") if isinstance(request, dict) else ""
          if mode not in {"preview", "publish"}:
              raise SystemExit("mode must be preview or publish.")
          print(mode)
          PY
          )"
          echo "TRIAL_MODE=$TRIAL_MODE" >> "$GITHUB_ENV"
          echo "Official Mob one-post mode: $TRIAL_MODE"
          if [[ "$TRIAL_MODE" == "publish" ]]; then
            if [[ -z "${RUBIKA_TOKEN:-}" || -z "${RUBIKA_CHANNEL_GUID:-}" ]]; then
              echo "::error::Missing RUBIKA_TOKEN or RUBIKA_CHANNEL_GUID secret; nothing was published."
              exit 2
            fi
          fi
          echo "Request accepted. Publishing only occurs when mode=publish."



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and media validation tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1

      - name: Discover, translate and validate one official post
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mob-official-media
          if [[ "$TRIAL_MODE" == "publish" ]]; then
            python -m agent.brain.mob_official_trial \
              --publish --limit 1 \
              --report artifacts/mob-official-trial-report.json \
              --output-dir artifacts/mob-official-media
          else
            python -m agent.brain.mob_official_trial \
              --limit 1 \
              --report artifacts/mob-official-trial-report.json \
              --output-dir artifacts/mob-official-media
          fi

      - name: Upload trial report and any retained recovery media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-official-trial
          path: |
            artifacts/mob-official-trial-report.json
            artifacts/mob-official-media/**
          if-no-files-found: warn
          retention-days: 7
