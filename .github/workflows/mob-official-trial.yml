name: Mob Entertainment official-source test-channel trial

on:
  # Manual test lane only. A routine five-hour metadata report must never trigger a post.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-mob-test-channel-trial
  cancel-in-progress: false

jobs:
  publish-one-official-test-post:
    # Test-channel only: target is hard-locked in both workflow and Python guard.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: c0EFohK0f3174377fb6fa422d3ccb230
    steps:
      - name: Check out the experimental code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: false

      - name: Validate secrets and lock publishing to the test channel
        id: validate_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Missing or invalid AGENT_API_TOKEN; test-channel trial stopped before discovering or downloading media."
            exit 2
          fi
          if [[ -z "${RUBIKA_TOKEN:-}" ]]; then
            echo "::error::Missing Actions secret RUBIKA_TOKEN; no post was sent."
            exit 2
          fi
          if [[ "${RUBIKA_CHANNEL_GUID:-}" != "c0EFohK0f3174377fb6fa422d3ccb230" ]]; then
            echo "::error::Refusing to publish because the destination is not the fixed test channel."
            exit 2
          fi
          echo "Test-channel publishing verified: max 1 post, no production-channel target."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies and media validator
        id: install_dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version | head -n 1

      - name: Discover fresh Mob X posts, translate, validate, and publish at most one to the test channel
        id: publish_trial
        # This workflow discovers current public X posts at run time; it must never use a stale Termux candidate snapshot. It only publishes posts whose verified source platform is X, and it never falls back to the website, YouTube or Steam if X has no fresh eligible post.
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.mob_official_trial \
            --publish-test-channel \
            --limit 1 \
            --source-platform x \
            --report artifacts/mob-official-test-publish-report.json \
            --output-dir artifacts/mob-official-test-publish-media

      - name: Get safe AI diagnosis for official-news trial failure
        if: failure()
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        shell: bash
        run: |
          set +e
          event_code="official_news_failed"
          stage="official_news"
          error_code="mob_official_trial_failed"
          if [[ "${{ steps.validate_secrets.outcome }}" == "failure" ]]; then error_code="test_channel_guard_failed"; fi
          if [[ "${{ steps.install_dependencies.outcome }}" == "failure" ]]; then error_code="dependency_install_failed"; fi
          python -m agent.brain.error_supervisor \
            --event-code "$event_code" \
            --stage "$stage" \
            --error-code "$error_code" \
            --output-report "$RUNNER_TEMP/ai-supervisor.json" \
            > "$RUNNER_TEMP/ai-supervisor-output.json"
          advisor_status=$?
          if [[ "$advisor_status" -ne 0 || ! -s "$RUNNER_TEMP/ai-supervisor-output.json" ]]; then
            echo "AI advisor unavailable; the original official-news failure remains authoritative." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$RUNNER_TEMP/ai-supervisor-output.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          recommendation = result.get("recommendation", {})
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n### AI error advisor (advice only)\\n")
              summary.write(f"- Source: {result.get('source', 'local_fallback')}\\n")
              summary.write(f"- Recommendation: {recommendation.get('action', 'human_review')}\\n")
              summary.write(f"- Reason code: {recommendation.get('reason_code', 'unknown_error')}\\n")
              summary.write(f"- Next step: {recommendation.get('next_step_code', 'review_error_code_and_recent_logs')}\\n")
              summary.write("- Applied automatically: no\\n")
          PY

      - name: Upload official test-channel result and retained media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-official-test-channel-trial
          path: |
            artifacts/mob-official-test-publish-report.json
            artifacts/mob-official-test-publish-media/**
          if-no-files-found: warn
          retention-days: 7
