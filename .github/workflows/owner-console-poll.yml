name: Rubika owner read-only operations console

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rubika-owner-operations-console
  cancel-in-progress: false

jobs:
  poll-private-commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      RUBIKA_OWNER_USER_ID: ${{ secrets.RUBIKA_OWNER_USER_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required private configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; no Rubika updates were requested."
              exit 2
            fi
          done
      - name: Poll and answer allowlisted read-only commands
        run: python -m agent.brain.owner_console --once