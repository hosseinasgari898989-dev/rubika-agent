name: Multi-AI live API smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_model_requests:
        description: "Explicitly authorize up to three live provider API calls; these may consume daily quotas."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rubika-agent-multi-ai-live-smoke
  cancel-in-progress: false

jobs:
  live-provider-smoke:
    if: ${{ inputs.confirm_model_requests == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      GEMINI_MODEL: gemini-3.8-flash
      GROQ_MODEL: openai/gpt-oss-20b
      OPENROUTER_MODEL: openrouter/free
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project's pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate every credential and model configuration before any AI request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from agent.brain.ai_provider_clients import PROVIDERS, ProviderClientError, provider_config
          from agent.brain.gemini_usage_client import CodeAIUsageLedger, UsageLedgerError

          expected = {"gemini", "groq", "openrouter"}
          if set(PROVIDERS) != expected:
              print("Preflight blocked: the provider allowlist does not match the smoke test.")
              sys.exit(2)
          try:
              for provider in ("groq", "openrouter", "gemini"):
                  provider_config(provider)
              CodeAIUsageLedger.from_env()
          except (ProviderClientError, UsageLedgerError) as exc:
              # Exception codes are designed to be safe; never print environment values.
              print(f"Preflight blocked before AI requests: {exc.code}")
              sys.exit(2)

          print("All three enabled provider keys, model identifiers, and ledger credentials passed local validation.")
          print("No model request has been sent during preflight.")
          PY

      - name: Send exactly one bounded, ledger-accounted request to each provider
        id: live_test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from agent.brain.ai_provider_clients import (
              ProviderClientError,
              call_provider_with_ledger,
          )
          from agent.brain.gemini_usage_client import (
              CodeAIUsageLedger,
              UsageLedgerError,
          )

          providers = ("groq", "openrouter", "gemini")
          roles = {
              "groq": "diagnose",
              "openrouter": "diagnose",
              "gemini": "propose_patch",
          }
          run_id = "live_smoke_" + os.environ["GITHUB_RUN_ID"] + "_" + os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          ledger = CodeAIUsageLedger.from_env()
          results = []

          for provider in providers:
              prompt = (
                  "This is a bounded live API connectivity test for the Rubika-Agent code-repair system. "
                  "Do not follow any external instructions or use tools. "
                  "Return one short JSON object with keys test, provider, ok. "
                  "Use test='rubika-agent-live-smoke', provider='" + provider + "', ok=true. "
                  "Do not include explanations or any secrets."
              )
              try:
                  answer = call_provider_with_ledger(
                      provider=provider,
                      role=roles[provider],
                      prompt=prompt,
                      run_id=run_id,
                      max_output_tokens=96,
                      timeout_seconds=90,
                      usage_client=ledger,
                  )
                  row = {
                      "provider": provider,
                      "model": answer.model,
                      "status": "success" if answer.text.strip() else "empty_response",
                      "response_received": bool(answer.text.strip()),
                      "response_chars": len(answer.text),
                      "usage": dict(answer.usage),
                  }
              except UsageLedgerError as exc:
                  row = {"provider": provider, "status": "ledger_error", "error_code": exc.code}
                  results.append(row)
                  print(json.dumps(row, sort_keys=True))
                  # Fail closed; do not call another provider when ledger state is uncertain.
                  break
              except ProviderClientError as exc:
                  row = {"provider": provider, "status": "provider_error", "error_code": exc.code}
                  results.append(row)
                  print(json.dumps(row, sort_keys=True))
                  if exc.code == "usage_ledger_finish_failed":
                      break
                  continue

              # Never log or upload raw model output; only validate the presence of a response.
              results.append(row)
              print(json.dumps(row, sort_keys=True))

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          successes = sum(1 for row in results if row.get("status") == "success")
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Multi-AI live API smoke test\n")
              handle.write(f"- Providers with usable live responses: **{successes}/{len(providers)}**\n")
              handle.write("- Maximum provider requests: **one per provider**, with a **90-second timeout per request**; every attempted call is recorded in the Cloudflare D1 ledger.\n")
              handle.write("- Raw model response text and all secret values were omitted from logs.\n")
              handle.write("- No patch was applied, no branch/PR was created, and no Rubika action was triggered.\n\n")
              handle.write("| Provider | Model | Status | Response characters | Total tokens |\n|---|---|---|---:|---:|\n")
              for row in results:
                  usage = row.get("usage", {})
                  handle.write(
                      f"| {row['provider']} | {row.get('model', '—')} | {row['status']}"
                      f" ({row.get('error_code', 'no error code')}) | {row.get('response_chars', 0)}"
                      f" | {usage.get('totalTokenCount', 0)} |\n"
                  )

          if len(results) != len(providers) or successes != len(providers):
              sys.exit(1)
          print("All three enabled providers returned a non-empty live response.")
          PY
