name: Wiki infobox probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-infobox-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wiki infobox probe
        run: python agent/brain/wiki_infobox_probe.py
