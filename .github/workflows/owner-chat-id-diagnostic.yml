name: Temporary owner chat ID diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-chat-id-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
    steps:
      - name: Read bot identity and look only for the one-time diagnostic command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("RUBIKA_TOKEN", "").strip()
          command = "/idcheck_agent_20261014_R7k4Wm"
          api = "https://botapi.rubika.ir/v3"

          def safe_status(value):
              value = str(value or "unknown")
              return re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:60]

          def call(method, payload):
              url = f"{api}/{token}/{method}"
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.loads(response.read().decode("utf-8"))
              except Exception as exc:
                  # Never print exception text: it may contain the token-bearing URL.
                  print(json.dumps({
                      "stage": method,
                      "ok": False,
                      "error_type": type(exc).__name__,
                      "details": "request_failed; sensitive URL omitted",
                  }))
                  sys.exit(2)

          if not token:
              print('{"ok":false,"stage":"configuration","error":"RUBIKA_TOKEN_missing"}')
              sys.exit(2)

          me = call("getMe", {})
          me_status = safe_status(me.get("status"))
          if me_status != "OK":
              print(json.dumps({"ok":False,"stage":"getMe","api_status":me_status}))
              sys.exit(1)

          data = me.get("data") if isinstance(me.get("data"), dict) else {}
          bot = data.get("bot") if isinstance(data.get("bot"), dict) else data
          bot_name = next((bot.get(k) for k in ("username", "name", "first_name", "bot_name")
                           if isinstance(bot.get(k), str) and bot.get(k).strip()), None)
          print(json.dumps({
              "ok": True,
              "stage": "getMe",
              "bot_identity": bot_name or "not_returned",
              "publishing": False,
          }, ensure_ascii=False))

          result = call("getUpdates", {"limit": 100})
          status = safe_status(result.get("status"))
          if status != "OK":
              print(json.dumps({"ok":False,"stage":"getUpdates","api_status":status,
                                "publishing":False}))
              sys.exit(1)

          data = result.get("data") if isinstance(result.get("data"), dict) else {}
          updates = data.get("updates") if isinstance(data.get("updates"), list) else []
          found = None
          for item in updates:
              stack = [item]
              while stack:
                  node = stack.pop()
                  if not isinstance(node, dict):
                      continue
                  message = node.get("new_message")
                  if not isinstance(message, dict):
                      message = node.get("inline_message")
                  if isinstance(message, dict) and str(message.get("text") or "").strip() == command:
                      chat_id = node.get("chat_id") or message.get("chat_id")
                      sender_id = message.get("sender_id")
                      # Only disclose a private bot-chat ID, not group/channel IDs.
                      if isinstance(chat_id, str) and chat_id.startswith("b"):
                          found = {
                              "ok": True,
                              "stage": "matched_diagnostic_message",
                              "chat_id": chat_id,
                              "sender_id": sender_id if isinstance(sender_id, str) else None,
                              "is_private": True,
                              "publishing": False,
                          }
                          break
                  for key in ("update", "data"):
                      child = node.get(key)
                      if isinstance(child, dict):
                          stack.append(child)
              if found:
                  break

          if found:
              print(json.dumps(found, ensure_ascii=False))
          else:
              print(json.dumps({
                  "ok": False,
                  "stage": "diagnostic_message_not_found",
                  "bot_identity": bot_name or "not_returned",
                  "updates_checked": len(updates),
                  "publishing": False,
                  "next_step": "send_the_one_time_command_to_this_bot_then_run_again",
              }, ensure_ascii=False))
          PY
