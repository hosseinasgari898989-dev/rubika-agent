name: Controlled video end-to-end trial (test channel only)

on:
  push:
    branches:
      - agent-brain-mega-v1
    paths:
      - "artifacts/video-e2e-trial.json"
      - ".github/workflows/video-e2e-trial.yml"

permissions:
  contents: read

concurrency:
  group: rubika-agent-video-e2e-trial
  cancel-in-progress: false

jobs:
  one-video-test-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: c0EFohK0f3174377fb6fa422d3ccb230
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
      COBALT_API_URL: http://127.0.0.1:9000/
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1

      - name: Validate secrets and enforce test-channel-only publishing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in AGENT_API_TOKEN RUBIKA_TOKEN MEGA_EMAIL MEGA_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing Actions secret: $key. Publishing stopped safely."
              missing=1
            fi
          done
          if [[ "${AGENT_API_TOKEN:-}" && ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::AGENT_API_TOKEN is too short. Publishing stopped safely."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 2; fi
          if [[ "${RUBIKA_CHANNEL_GUID:-}" != "c0EFohK0f3174377fb6fa422d3ccb230" ]]; then
            echo "::error::Test-only channel guard failed. Refusing to publish."
            exit 2
          fi
          echo "This run is locked to one item and the Rubika test channel."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.6.0"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Check out pinned Cobalt source
        uses: actions/checkout@v4
        with:
          repository: imputnet/cobalt
          ref: a636575b09de1fc55d9b8cd98cac88f5f2f16b42
          path: cobalt-src
          persist-credentials: false

      - name: Install Cobalt dependencies
        working-directory: cobalt-src
        run: pnpm install --frozen-lockfile

      - name: Start temporary Cobalt API
        working-directory: cobalt-src
        env:
          API_URL: http://127.0.0.1:9000/
          API_PORT: "9000"
          API_LISTEN_ADDRESS: 127.0.0.1
          CORS_WILDCARD: "1"
        run: |
          set -euo pipefail
          pnpm --filter @imput/cobalt-api start > "$RUNNER_TEMP/cobalt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cobalt-api.pid"
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:9000/ -o "$RUNNER_TEMP/cobalt-health.json"; then
              echo "Temporary Cobalt API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Cobalt did not start; safe diagnostics follow:"
          tail -n 60 "$RUNNER_TEMP/cobalt-api.log"
          exit 1

      - name: Install MEGAcmd
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/megacmd-xUbuntu_24.04_amd64.deb"
          curl --fail --silent --show-error --location \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output "$package"
          sudo apt-get update
          sudo apt-get install --yes "$package"
          command -v mega-login
          command -v mega-put
          command -v mega-get
          command -v mega-rm

      - name: Log in to MEGA securely
        id: mega_login
        run: |
          set -euo pipefail
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-ls /Rubika-Agent >/dev/null
          echo "MEGA login and project folder verified."

      - name: Run the single-candidate discovery-to-Rubika test
        id: video_e2e
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m agent.brain.e2e_from_report \
            --report artifacts/video-e2e-trial.json \
            --platform tiktok \
            --candidate-limit 1 \
            --candidate-offset 0 \
            --output-report artifacts/video-e2e-trial-result.json

      - name: Upload E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-video-e2e-trial
          path: artifacts/video-e2e-trial-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop temporary services and log out of MEGA
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cobalt-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cobalt-api.pid")" 2>/dev/null || true
          fi
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true

      - name: Require confirmed send in the test channel
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/video-e2e-trial-result.json")
          if not path.is_file():
              raise SystemExit("E2E result missing; delivery is not confirmed.")
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit("E2E result invalid; delivery is not confirmed.")
          delivery = report.get("delivery")
          if not (
              report.get("ok") is True
              and report.get("status") == "sent"
              and report.get("publishing") is True
              and isinstance(delivery, dict)
              and delivery.get("status") == "sent"
              and delivery.get("message_id")
          ):
              print(json.dumps({
                  "ok": False,
                  "status": report.get("status", "missing"),
                  "reason": report.get("reason") or report.get("error") or (delivery or {}).get("error", "delivery_not_confirmed"),
                  "publishing": False
              }, ensure_ascii=False))
              raise SystemExit("No confirmed video delivery; test failed closed.")
          print(json.dumps({
              "ok": True,
              "status": "sent",
              "platform": report.get("platform"),
              "rubika_message_id_recorded": True,
              "publishing": True
          }, ensure_ascii=False))
          PY
