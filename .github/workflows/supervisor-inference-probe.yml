name: One-request supervisor inference verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supervisor-inference-probe.yml"

permissions:
  contents: read

concurrency:
  group: rubika-agent-supervisor-inference-probe
  cancel-in-progress: false

jobs:
  one-bounded-advisory-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
    steps:
      - name: Call the deployed advisor once with allowlisted non-sensitive diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Worker credential missing or invalid; no request sent."
            exit 2
          fi
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/supervisor-probe.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $AGENT_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"event_code":"unknown_error","stage":"unknown","error_code":"live_smoke_probe","platform":"none","attempt_count":0,"counts":{}}' \
            "$AGENT_API_BASE_URL/api/brain/supervise-error")"
          if [[ "$code" != "200" ]]; then
            echo "::error::Supervisor returned HTTP ${code:-unknown}; response body retained only in the runner temp directory."
            exit 1
          fi
          python - "$RUNNER_TEMP/supervisor-probe.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if data.get("ok") is not True or data.get("applied") is not False:
              raise SystemExit("supervisor_response_contract_failed")
          source = data.get("source")
          decision = data.get("recommendation")
          allowed_actions = {"retry_next_scheduled_run", "skip_source_and_continue", "inspect_queue", "human_review", "no_action"}
          allowed_reasons = {"temporary_network", "source_blocked", "queue_duplicate", "uncertain_delivery", "stale_metadata", "validation_rejected", "auth_or_configuration", "quota_exhausted", "model_output_invalid", "unknown_error"}
          allowed_next_steps = {"wait_for_next_schedule", "continue_with_other_sources", "check_agent_api_health", "inspect_d1_queue_counts", "retry_only_after_confirming_not_sent", "review_error_code_and_recent_logs", "review_publisher_delivery_receipt", "inspect_media_validation_report", "preserve_mega_file_and_ledger", "recheck_mega_listing", "none"}
          if source not in {"workers_ai", "deterministic_fallback"} or not isinstance(decision, dict):
              raise SystemExit("supervisor_response_source_invalid")
          if decision.get("action") not in allowed_actions or decision.get("reason_code") not in allowed_reasons or decision.get("next_step_code") not in allowed_next_steps or type(decision.get("human_review")) is not bool:
              raise SystemExit("supervisor_response_allowlist_invalid")
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Deployed supervisor inference probe\n")
              summary.write(f"- Response source: {source}\n")
              summary.write(f"- Reason code: {decision['reason_code']}\n")
              summary.write(f"- Recommendation: {decision['action']}\n")
              summary.write("- Applied automatically: no\n")
              summary.write("- Media downloads or Rubika posts: none\n")
          print(f"Safe advisor result: source={source}; reason={decision['reason_code']}; applied=false")
          if source != "workers_ai":
              raise SystemExit("workers_ai_inference_not_confirmed")
          PY
