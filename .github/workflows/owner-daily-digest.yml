name: Rubika owner daily digest

on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-owner-daily-digest
  cancel-in-progress: false

jobs:
  open-daily-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Open or update today's 24-hour owner digest
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; digest was not sent."
              exit 2
            fi
          done
          python -m agent.brain.owner_notify --event daily_digest_start
