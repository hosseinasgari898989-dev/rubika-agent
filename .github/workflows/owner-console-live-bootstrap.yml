name: Temporary Stage 5 owner-console live bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/owner-console-live-bootstrap.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: temporary-owner-console-live-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
      RUBIKA_OWNER_USER_ID: ${{ secrets.RUBIKA_OWNER_USER_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if base private configuration is missing
        shell: bash
        run: |
          set -euo pipefail
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required secret $key is missing; poller was not started."
              exit 2
            fi
          done
      - name: Install project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Initialize the owner-console cursor without replying to historic updates
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.owner_console --once > /tmp/owner-console-bootstrap.json
          python - <<'PY'
          import json
          with open("/tmp/owner-console-bootstrap.json", encoding="utf-8") as handle:
              result = json.load(handle)
          safe = {key: result.get(key) for key in (
              "ok", "mode", "updates_received", "ignored", "answered",
              "bootstrapped", "offset_advanced", "owner_identity_ambiguous",
              "error_code",
          )}
          print(json.dumps(safe, sort_keys=True))
          if result.get("ok") is not True:
              raise SystemExit("owner_console_bootstrap_failed")
          if result.get("bootstrapped") is not True:
              raise SystemExit("owner_console_was_not_in_bootstrap_mode")
          if result.get("offset_advanced") is not True:
              raise SystemExit("owner_console_cursor_not_initialized")
          if result.get("answered") != 0:
              raise SystemExit("owner_console_should_not_reply_during_bootstrap")
          PY
