name: Deployed Worker health smoke check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supervisor-live-smoke.yml"
      - ".github/workflows/termux-docker-discovery.yml"
      - "src/index.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-worker-health-smoke
  cancel-in-progress: false

jobs:
  verify-live-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
    steps:
      - name: Verify deployed Worker health and D1 connection
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/worker-health.json" --write-out '%{http_code}' "$AGENT_API_BASE_URL/health")"
          if [[ "$code" != "200" ]]; then
            echo "::error::Worker health check failed with HTTP ${code:-unknown}."
            exit 1
          fi
          python - "$RUNNER_TEMP/worker-health.json" <<'PY'
          import json, sys
          from pathlib import Path
          body = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if body.get("ok") is not True or body.get("service") != "rubika-agent":
              raise SystemExit("worker_health_contract_failed")
          if body.get("database") != "connected":
              raise SystemExit("worker_d1_connection_failed")
          print("Live Worker health and D1 connectivity confirmed; no AI calls, media downloads, or Rubika posts.")
          PY

      - name: Summarize the read-only smoke check
        if: success()
        run: |
          {
            echo "## Deployed Worker health check"
            echo "- Worker health: confirmed"
            echo "- D1 connection: confirmed"
            echo "- Model requests: 0"
            echo "- Media downloads and Rubika posts: 0"
          } >> "$GITHUB_STEP_SUMMARY"
