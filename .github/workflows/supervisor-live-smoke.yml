name: Deployed Worker supervisor route smoke check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supervisor-live-smoke.yml"
      - ".github/workflows/termux-docker-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-supervisor-live-smoke
  cancel-in-progress: false

jobs:
  validate-live-route-without-ai-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
    steps:
      - name: Verify deployed Worker health and D1 connection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::Missing or invalid Worker API credential; no test request sent."
            exit 2
          fi
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/worker-health.json" --write-out '%{http_code}' "$AGENT_API_BASE_URL/health")"
          if [[ "$code" != "200" ]]; then
            echo "::error::Worker health check failed with HTTP ${code:-unknown}."
            exit 1
          fi
          python - "$RUNNER_TEMP/worker-health.json" <<'PY'
          import json, sys
          from pathlib import Path
          body = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if body.get("ok") is not True or body.get("service") != "rubika-agent":
              raise SystemExit("worker_health_contract_failed")
          if body.get("database") != "connected" or body.get("publishing") is not False:
              raise SystemExit("worker_health_safety_contract_failed")
          print("Live Worker health and D1 connectivity confirmed; publishing remains disabled.")
          PY

      - name: Verify supervisor route validation without invoking Workers AI
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/supervisor-smoke.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $AGENT_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"event_code":"invalid_smoke_probe","stage":"unknown","error_code":"route_smoke_test","platform":"none","attempt_count":0,"counts":{}}' \
            "$AGENT_API_BASE_URL/api/brain/supervise-error")"
          if [[ "$code" != "400" ]]; then
            echo "::error::Supervisor route did not return its expected validation response (HTTP ${code:-unknown})."
            exit 1
          fi
          python - "$RUNNER_TEMP/supervisor-smoke.json" <<'PY'
          import json, sys
          from pathlib import Path
          body = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if body.get("error") != "supervisor_input_invalid":
              raise SystemExit("supervisor_route_contract_failed")
          print("Supervisor endpoint is deployed and validates inputs; no Workers AI request or quota used.")
          PY

      - name: Summarize the safe smoke check
        if: success()
        run: |
          {
            echo "## Deployed supervisor smoke check"
            echo "- Worker health: confirmed"
            echo "- D1 connection: confirmed"
            echo "- Supervisor route input validation: confirmed"
            echo "- Workers AI requests made: 0"
            echo "- Rubika posts or media downloads: 0"
          } >> "$GITHUB_STEP_SUMMARY"
