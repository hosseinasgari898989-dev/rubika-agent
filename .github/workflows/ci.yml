name: Cloud bootstrap checks

on:
  pull_request:
  push:
    branches:
      - rubika-cloud-auth-preflight
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a non-publishing check"
        required: true
        type: choice
        options:
          - self-test
          - cloud-health
          - rubika-auth
        default: self-test

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check --input-type=module < src/index.js
      - name: Check owner panel JavaScript syntax
        run: node --check --input-type=module < src/owner_panel.js
      - name: Lint owner panel JavaScript
        run: npx --yes eslint@9.38.0 --no-config-lookup --rule 'no-dupe-keys:error' --rule 'no-unreachable:error' --rule 'no-unused-vars:error' --rule 'valid-typeof:error' --rule 'no-constant-condition:error' --rule 'no-constant-binary-expression:error' src/owner_panel.js
      - name: Verify installed Rubka API surface
        run: |
          python - <<'PY'
          import inspect
          import json
          from importlib.metadata import version
          from rubka import Bot

          signature = inspect.signature(Bot)
          required_methods = ("get_me", "get_chat", "send_video")
          missing = [name for name in required_methods if not callable(getattr(Bot, name, None))]
          if missing:
              raise SystemExit("Required Rubka methods unavailable: " + ", ".join(missing))
          for name in ("timeout", "show_progress"):
              if name not in signature.parameters:
                  raise SystemExit("Expected Bot constructor argument missing: " + name)
          print(json.dumps({"rubka_version": version("rubka"), "api_surface": "ok", "publishing": False}))
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run subtitle tools tests
        run: python tests/test_subtitle_tools.py
      - name: Run speech gate tests
        run: python tests/test_speech_gate.py
      - name: Run Cloudflare Worker unit tests
        run: node tests/worker.test.mjs
      - name: Run self-test
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'self-test'
        run: python -m agent.preflight self-test
      - name: Smoke-test live Cloudflare Worker
        # Live infrastructure checks are opt-in. Pull requests and pushes run offline tests only.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cloud-health'
        env:
          CONTROL_API_URL: https://rubika-agent.h98609294.workers.dev
        run: python -m agent.preflight cloud-health
      - name: Verify Rubika bot and channel credentials
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rubika-auth'
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
        run: python -m agent.rubika_preflight
