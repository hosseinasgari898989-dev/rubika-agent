name: Media download smoke test

on:
  push:
    branches:
      - media-download-smoke-test
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: "One public TikTok video URL"
        required: false
        type: string
        default: "https://www.tiktok.com/@dragonboyedits/video/7616247520657771796"
      instagram_url:
        description: "One public Instagram Reel URL"
        required: false
        type: string
        default: "https://www.instagram.com/reel/DFQe23tOWKz/"
      youtube_url:
        description: "One public YouTube video or Short URL"
        required: false
        type: string
        default: "https://www.youtube.com/watch?v=vPwaXytZcgI"

permissions:
  contents: read

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Rubika-Agent
        uses: actions/checkout@v4

      - name: Check out Cobalt source (ephemeral self-hosted downloader)
        uses: actions/checkout@v4
        with:
          repository: imputnet/cobalt
          ref: a636575b09de1fc55d9b8cd98cac88f5f2f16b42
          path: cobalt-src
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.6.0"

      - name: Install Cobalt dependencies
        working-directory: cobalt-src
        run: pnpm install --frozen-lockfile

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Start local Cobalt API
        working-directory: cobalt-src
        env:
          API_URL: "http://127.0.0.1:9000/"
          API_PORT: "9000"
          API_LISTEN_ADDRESS: "127.0.0.1"
          CORS_WILDCARD: "1"
        run: |
          pnpm --filter @imput/cobalt-api start > "$RUNNER_TEMP/cobalt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cobalt-api.pid"
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:9000/ -o "$RUNNER_TEMP/cobalt-health.json"; then
              echo "Local Cobalt API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Cobalt API did not start. Safe startup diagnostics:"
          tail -n 60 "$RUNNER_TEMP/cobalt-api.log"
          exit 1

      - name: Run one download test per platform and validate media
        env:
          COBALT_API_URL: "http://127.0.0.1:9000/"
          TIKTOK_URL: ${{ inputs.tiktok_url || 'https://www.tiktok.com/@dragonboyedits/video/7616247520657771796' }}
          INSTAGRAM_URL: ${{ inputs.instagram_url || 'https://www.instagram.com/reel/DFQe23tOWKz/' }}
          YOUTUBE_URL: ${{ inputs.youtube_url || 'https://www.youtube.com/watch?v=vPwaXytZcgI' }}
        run: python -m unittest discover -s tests -v && python -m agent.media_smoke_test

      - name: Stop local Cobalt API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cobalt-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cobalt-api.pid")" 2>/dev/null || true
          fi
