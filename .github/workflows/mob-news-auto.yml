name: Automatic official Mob news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-official-mob-news
  cancel-in-progress: false

jobs:
  publish-latest-official-item:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
      RUBIKA_OWNER_CHAT_ID: ${{ secrets.RUBIKA_OWNER_CHAT_ID }}
    steps:
      - name: Check out the automation code
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1

      - name: Validate required credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in AGENT_API_TOKEN RUBIKA_TOKEN RUBIKA_CHANNEL_GUID RUBIKA_OWNER_CHAT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing Actions secret: $key. Official news publishing stopped safely."
              missing=1
            fi
          done
          if [[ "${AGENT_API_TOKEN:-}" && ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::AGENT_API_TOKEN is too short. Publishing stopped safely."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 2; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Discover and publish one new verified official Mob post
        run: |
          python -m agent.brain.mob_official_trial             --publish             --limit 1             --report artifacts/mob-official-automatic-report.json             --output-dir artifacts/mob-official-automatic-media

      - name: Notify owner if automatic news run fails
        if: failure()
        continue-on-error: true
        run: |
          python -m agent.brain.owner_notify             --event workflow_failed             --workflow "Automatic official Mob news"             --reason "mob_news_workflow_failed"

      - name: Upload news run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob-official-automatic-report
          path: artifacts/mob-official-automatic-report.json
          if-no-files-found: warn
          retention-days: 7
