name: YouTube and Rubika upload capacity probe

on:
  pull_request:
    paths:
      - "agent/brain/youtube_capacity_probe.py"
      - "tests/test_youtube_capacity_probe.py"
      - ".github/workflows/youtube-capacity-probe.yml"
  push:
    branches:
      - youtube-capacity-probe-once-20261027

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing HTTP dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Run isolated capacity-probe tests
        run: python -m unittest discover -s tests -p "test_youtube_capacity_probe.py" -v

  live-test-channel-capacity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/youtube-capacity-probe-once-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHANNEL_GUID: ${{ secrets.RUBIKA_CHANNEL_GUID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg for valid 720p test media
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install existing HTTP dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Check available runner disk without exposing environment values
        run: |
          python - <<'PY'
          import shutil
          free = shutil.disk_usage(".").free
          print(f"Runner free disk: {free} bytes")
          if free < 8 * 1024 * 1024 * 1024:
              raise SystemExit("capacity_probe_runner_disk_below_8GiB")
          PY
      - name: Run test-channel-only progressive probe
        run: python -m agent.brain.youtube_capacity_probe
      - name: Upload sanitized capacity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rubika-capacity-report
          path: artifacts/youtube_capacity_probe_report.json
          if-no-files-found: ignore
          retention-days: 7
