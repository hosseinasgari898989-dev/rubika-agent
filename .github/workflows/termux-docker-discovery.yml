name: Online Termux discovery and queue sync

on:
  # Run a lightweight gate every 30 minutes; it starts collection only after five hours since
  # the last successful D1 intake, avoiding the midnight gap in "*/5" cron hours.
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rubika-agent-online-termux-discovery
  cancel-in-progress: false

jobs:
  five-hour-gate:
    name: Enforce five-hour interval after successful queue intake
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Read the last successful collection state
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: false
      - name: Decide whether a collection cycle is due
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          result="$(python -m agent.brain.five_hour_gate \
            --event-name "$GITHUB_EVENT_NAME" \
            --state-file artifacts/termux_collection_state.json)"
          echo "decision=$result" >> "$GITHUB_OUTPUT"
          should_run="$(python -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("should_run") is True else "false")' "$result")"
          reason="$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("reason","unknown"))' "$result")"
          elapsed="$(python -c 'import json,sys; value=json.loads(sys.argv[1]).get("elapsed_seconds"); print("n/a" if value is None else value)' "$result")"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Gate decision: $reason; elapsed_seconds=$elapsed; should_run=$should_run"
          if [[ "$should_run" == "false" ]]; then
            echo "This scheduled tick is only a gate; collection is skipped until five hours have elapsed since the last successful D1 intake." >> "$GITHUB_STEP_SUMMARY"
          fi

  collect-and-sync:
    needs: five-hour-gate
    if: needs.five-hour-gate.outputs.should_run == 'true'
    name: Real Termux runtime, discovery, GitHub report and D1 queue intake
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
      AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
    steps:
      - name: Check out the current experimental agent brain
        uses: actions/checkout@v4
        with:
          ref: agent-brain-mega-v1
          persist-credentials: true

      - name: Validate queue credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_API_TOKEN:-}" || ${#AGENT_API_TOKEN} -lt 32 ]]; then
            echo "::error::AGENT_API_TOKEN is missing or invalid; discovery and queue sync stopped safely."
            exit 2
          fi
          docker version

      - name: Install host test dependencies and run the complete unit test suite
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project requirements
        id: install_requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check deployed Worker and D1 health without model inference
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output "$RUNNER_TEMP/worker-health.json" --write-out '%{http_code}' \
            "$AGENT_API_BASE_URL/health" || true)"
          if [[ "$code" != "200" ]]; then
            echo "::error::Control Worker/D1 health check failed (HTTP ${code:-unknown}); stopping before source discovery."
            exit 1
          fi
          python - "$RUNNER_TEMP/worker-health.json" <<'PY'
          import json, sys
          from pathlib import Path

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit("worker_health_body_not_json")
          if (
              payload.get("ok") is not True
              or payload.get("service") != "rubika-agent"
              or payload.get("database") != "connected"
          ):
              raise SystemExit("worker_or_d1_health_not_confirmed")
          print("Worker and D1 are healthy; no model inference or quota was used.")
          PY

      - name: Run all repository unit tests
        id: unit_tests
        run: python -m unittest discover -s tests -v

      - name: Run real Termux Docker source tests and collect live metadata
        id: termux_discovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s docker pull termux/termux-docker:x86_64

          output_dir="$RUNNER_TEMP/termux-discovery-output"
          mkdir -p "$output_dir"
          chmod 0777 "$output_dir"

          cat > "$RUNNER_TEMP/termux_docker_discovery.py" <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from termux.daily_discovery import collect_daily_report

          report_path = Path("/out/termux_discovery.json")
          report = collect_daily_report(output_path=report_path)
          # The Termux container writes as its own UID; grant the host runner read access.
          report_path.chmod(0o644)
          summary = report.get("summary", {})
          candidates = report.get("candidates", {})
          tiktok = candidates.get("tiktok", [])
          mob = candidates.get("mob_official", [])

          safe_summary = {
              "generated_at": report.get("generated_at"),
              "tiktok_candidates": len(tiktok) if isinstance(tiktok, list) else 0,
              "mob_official_candidates": len(mob) if isinstance(mob, list) else 0,
              "paid_providers_used": summary.get("paid_providers_used", []),
              "media_downloads": report.get("limits", {}).get("media_downloads", 0),
              "rubika_posts": report.get("limits", {}).get("rubika_posts", 0),
          }
          print("ONLINE_TERMUX_SUMMARY=" + json.dumps(
              safe_summary, ensure_ascii=False, sort_keys=True
          ))

          for attempt in report.get("attempts", []):
              if not isinstance(attempt, dict):
                  continue
              safe = {}
              for key in ("source", "method", "status", "result_count",
                          "candidate_count", "http_status", "error", "reason"):
                  value = attempt.get(key)
                  if value is not None:
                      safe[key] = value
              if safe:
                  print("SOURCE_ATTEMPT=" + json.dumps(
                      safe, ensure_ascii=False, sort_keys=True
                  ))

          # The persistent normal edit queue currently accepts TikTok only.
          # Mob official candidates belong to a separate lane and must not make an
          # empty TikTok intake look successful or refresh the five-hour marker.
          if safe_summary["tiktok_candidates"] == 0:
              raise SystemExit(
                  "Live TikTok discovery returned zero candidates; refusing to replace "
                  "the last report or update the edit queue with a Mob-only run."
              )
          if safe_summary["media_downloads"] != 0 or safe_summary["rubika_posts"] != 0:
              raise SystemExit("Safety violation: this job must remain metadata-only.")
          if safe_summary["paid_providers_used"] not in ([], None):
              raise SystemExit("Safety violation: an unexpected paid provider was used.")
          print("SAFETY=metadata_only; no media downloads; no Rubika publishing")
          PY

          timeout 25m docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$output_dir:/out" \
            -w /workspace \
            -e PYTHONPATH=/workspace \
            termux/termux-docker:x86_64 \
            sh -lc '
              set -eu
              echo "TERMUX_PKG_MANAGER=$(command -v pkg)"
              # The image may select a community mirror that is temporarily rate-limited.
              # Prefer the official repository and fall back to the official CDN endpoint.
              mirror_ready=0
              for mirror in packages.termux.dev packages-cf.termux.dev; do
                for source_file in "$PREFIX/etc/apt/sources.list" "$PREFIX/etc/apt/sources.list.d/"*.list; do
                  [ -f "$source_file" ] || continue
                  sed -i -E "s#^deb https?://[^[:space:]]*/(apt/)?termux-main[[:space:]]+stable[[:space:]]+main#deb https://$mirror/apt/termux-main stable main#" "$source_file"
                done
                if ! grep -Rqs "deb https://$mirror/apt/termux-main stable main" "$PREFIX/etc/apt"; then
                  printf "deb https://%s/apt/termux-main stable main\\n" "$mirror" > "$PREFIX/etc/apt/sources.list"
                fi
                echo "Refreshing Termux package indexes from $mirror."
                if timeout 180s pkg update -y; then
                  mirror_ready=1
                  break
                fi
                echo "Package index refresh failed on $mirror; attempting the next official mirror."
                sleep 3
              done
              if [ "$mirror_ready" -ne 1 ]; then
                echo "Termux package index could not be refreshed from official mirrors."
                exit 1
              fi
              timeout 240s pkg install -y python git
              mkdir -p "$HOME/.venvs"
              VENV_DIR="$HOME/.venvs/termux-docker"
              python -m venv "$VENV_DIR"
              export PATH="$VENV_DIR/bin:$PATH"
              timeout 240s python -m pip install --disable-pip-version-check --retries 2 --timeout 20 requests yt-dlp==2026.08.19
              python --version
              python -c "import requests, yt_dlp; print(requests.__version__, yt_dlp.version.__version__)"
              timeout 90s python -m unittest discover -s tests -p "test_termux_sources.py" -v
              timeout 90s python -m unittest discover -s tests -p "test_termux_instagram.py" -v
              timeout 90s python -m unittest discover -s tests -p "test_termux_daily_discovery.py" -v
              timeout 90s python -m unittest discover -s tests -p "test_phone_report_integration.py" -v
              timeout 12m python -
            ' < "$RUNNER_TEMP/termux_docker_discovery.py"

      - name: Validate report and push only the metadata report to the experimental branch
        id: push_report
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/termux-discovery-output/termux_discovery.json"
          test -s "$report"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != 1:
              raise SystemExit("invalid_schema_version")
          if payload.get("source") != "termux_cloud_runner":
              raise SystemExit("invalid_report_source")
          if payload.get("mode") != "metadata_only_no_download_no_publish":
              raise SystemExit("report_not_metadata_only")
          candidates = payload.get("candidates")
          if not isinstance(candidates, dict):
              raise SystemExit("invalid_candidates")
          for key in ("tiktok", "mob_official"):
              rows = candidates.get(key)
              if not isinstance(rows, list):
                  raise SystemExit("invalid_candidate_list_" + key)
              for row in rows:
                  if not isinstance(row, dict):
                      raise SystemExit("invalid_candidate_row")
                  url = row.get("url") or row.get("canonical_url")
                  if not isinstance(url, str) or not url.startswith("https://"):
                      raise SystemExit("candidate_url_not_https")
          if len(path.read_bytes()) > 20 * 1024 * 1024:
              raise SystemExit("report_size_limit_exceeded")
          print(json.dumps({
              "schema_valid": True,
              "tiktok_candidates": len(candidates["tiktok"]),
              "mob_official_candidates": len(candidates["mob_official"]),
              "media_downloads": payload.get("limits", {}).get("media_downloads", 0),
              "rubika_posts": payload.get("limits", {}).get("rubika_posts", 0),
          }, sort_keys=True))
          PY

          git fetch origin agent-brain-mega-v1
          git merge --ff-only origin/agent-brain-mega-v1
          mkdir -p artifacts
          cp "$report" artifacts/termux_discovery.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/termux_discovery.json
          staged_paths="$(git diff --cached --name-only)"
          if [[ "$staged_paths" != "artifacts/termux_discovery.json" ]]; then
            echo "::error::Refusing to commit anything besides the metadata report."
            exit 2
          fi
          git commit -m "Update online Termux metadata discovery report"
          git push origin HEAD:refs/heads/agent-brain-mega-v1
          echo "report_pushed=true" >> "$GITHUB_OUTPUT"

      # Intake adds up to four genuinely new URLs in rotating creator order; this job never downloads or posts.
      - name: Add TikTok metadata to the persistent D1 edit queue
        id: queue_intake
        if: steps.push_report.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -m agent.brain.queue_intake \
            --report artifacts/termux_discovery.json \
            --max-new 4 \
            --no-notify | tee "$RUNNER_TEMP/queue-intake-result.json"
          python - "$RUNNER_TEMP/queue-intake-result.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("queue_intake_not_confirmed")
          for key in (
              "received_count", "inserted_count", "duplicate_count", "invalid_count",
              "skipped_existing_count", "discovered_candidate_count",
              "filter_eligible_count", "filter_rejected_count",
              "duplicate_within_report_count",
          ):
              value = payload.get(key, 0)
              if type(value) is not int or value < 0:
                  value = 0
              print(f"{key}={value}")
          counts = payload.get("queue_counts", {})
          print("queue_total=" + str(counts.get("total", 0) if isinstance(counts, dict) else 0))
          PY

      - name: Record successful five-hour collection cycle
        id: record_cycle
        if: steps.queue_intake.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/queue-intake-result.json" "$RUNNER_TEMP/termux-discovery-output/termux_discovery.json" artifacts/termux_collection_state.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          queue_result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if queue_result.get("ok") is not True:
              raise SystemExit("cannot_mark_cycle_success_when_intake_failed")
          selected = queue_result.get("selected_items", [])
          if not isinstance(selected, list):
              selected = []
          state = {
              "schema_version": 1,
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "report_generated_at": report.get("generated_at"),
              "queue_status": queue_result.get("status"),
              "discovered_candidate_count": queue_result.get("discovered_candidate_count", 0),
              "candidate_pool_count": queue_result.get("candidate_pool_count", 0),
              "filter_eligible_count": queue_result.get("filter_eligible_count", queue_result.get("candidate_pool_count", 0)),
              "filter_rejected_count": queue_result.get("filter_rejected_count", 0),
              "filter_rejected_by_reason": queue_result.get("filter_rejected_by_reason", {}),
              "filter_rejected_by_source": queue_result.get("filter_rejected_by_source", {}),
              "filter_input_by_source": queue_result.get("filter_input_by_source", {}),
              "duplicate_within_report_count": queue_result.get("duplicate_within_report_count", 0),
              "duplicate_count": queue_result.get("duplicate_count", 0),
              "skipped_existing_count": queue_result.get("skipped_existing_count", 0),
              "invalid_count": queue_result.get("invalid_count", 0),
              "received_count": queue_result.get("received_count", 0),
              "inserted_count": queue_result.get("inserted_count", 0),
              "candidate_pool_size": queue_result.get("candidate_pool_count", 0),
              "queue_counts": queue_result.get("queue_counts", {}),
              "selected_source_distribution": queue_result.get("selected_source_distribution", {}),
              "selected_external_ids": [
                  str(row.get("external_id")) for row in selected if isinstance(row, dict)
              ],
              "selected_urls": [
                  str(row.get("url")) for row in selected if isinstance(row, dict) and row.get("url")
              ],
              "mode": "metadata_only_no_download_no_publish"
          }
          destination = Path(sys.argv[3])
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/termux_collection_state.json
          if git diff --cached --quiet; then
            echo "Cycle marker already matches; nothing to commit."
            exit 0
          fi
          git commit -m "Record successful five-hour metadata intake"
          git push origin HEAD:agent-brain-mega-v1

      - name: Get safe advisory diagnosis for pipeline failure
        if: failure()
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        shell: bash
        run: |
          set +e
          event_code="unknown_error"
          stage="unknown"
          error_code="pipeline_step_failed"
          if [[ "${{ steps.install_requirements.outcome }}" == "failure" ]]; then
            event_code="workflow_tests_failed"; stage="tests"; error_code="dependency_install_failed"
          elif [[ "${{ steps.unit_tests.outcome }}" == "failure" ]]; then
            event_code="workflow_tests_failed"; stage="tests"; error_code="test_suite_failed"
          elif [[ "${{ steps.termux_discovery.outcome }}" == "failure" ]]; then
            event_code="discovery_failed"; stage="collector"; error_code="termux_discovery_failed"
          elif [[ "${{ steps.push_report.outcome }}" == "failure" ]]; then
            event_code="report_push_failed"; stage="report"; error_code="report_commit_or_push_failed"
          elif [[ "${{ steps.queue_intake.outcome }}" == "failure" ]]; then
            event_code="queue_intake_failed"; stage="queue_intake"; error_code="queue_intake_failed"
          fi
          python -m agent.brain.error_supervisor \
            --event-code "$event_code" \
            --stage "$stage" \
            --error-code "$error_code" \
            --output-report "$RUNNER_TEMP/ai-supervisor.json" \
            > "$RUNNER_TEMP/ai-supervisor-output.json"
          status=$?
          if [[ "$status" -ne 0 || ! -s "$RUNNER_TEMP/ai-supervisor-output.json" ]]; then
            echo "AI advisor unavailable; the original pipeline failure remains authoritative." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$RUNNER_TEMP/ai-supervisor-output.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          recommendation = result.get("recommendation", {})
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n### AI error advisor (advice only)\n")
              summary.write(f"- Source: {result.get('source', 'local_fallback')}\n")
              summary.write(f"- Recommendation: {recommendation.get('action', 'human_review')}\n")
              summary.write(f"- Reason code: {recommendation.get('reason_code', 'unknown_error')}\n")
              summary.write(f"- Next step: {recommendation.get('next_step_code', 'review_error_code_and_recent_logs')}\n")
              summary.write("- Applied automatically: no\n")
          PY

      - name: Upload collection report and queue result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-termux-discovery
          path: |
            artifacts/termux_discovery.json
            ${{ runner.temp }}/termux-discovery-output/termux_discovery.json
            ${{ runner.temp }}/queue-intake-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write a concise execution summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Online Termux discovery"
            echo ""
            echo "- Runtime: real Termux Docker image"
            echo "- Schedule: twice-hourly UTC gate; full collection after five hours from successful D1 intake"
            echo "- Full unit suite: completed before live discovery if preceding step passed"
            echo "- Report commit/push: ${{ steps.push_report.outcome }}"
            echo "- Persistent D1 intake: ${{ steps.queue_intake.outcome }}"
            echo "- Live candidates evaluated by intake filter: ${{ steps.queue_intake.outputs.discovered_candidate_count || 'n/a' }}"
            echo "- Eligible candidates after content/edit/freshness checks: ${{ steps.queue_intake.outputs.filter_eligible_count || 'n/a' }}"
            echo "- Rejected by filter: ${{ steps.queue_intake.outputs.filter_rejected_count || 'n/a' }}"
            echo "- Newly inserted into queue: ${{ steps.queue_intake.outputs.inserted_count || 'n/a' }}"
            echo "- Duplicates skipped in D1/ledger/API: ${{ steps.queue_intake.outputs.duplicate_count || 'n/a' }} API duplicates; ${{ steps.queue_intake.outputs.skipped_existing_count || 'n/a' }} already-existing"
            echo "- This workflow never downloads media or publishes to Rubika"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$RUNNER_TEMP/queue-intake-result.json" ]]; then
            python - "$RUNNER_TEMP/queue-intake-result.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n### Newly queued URLs (not already in D1)\n\n")
              rows = data.get("selected_items", [])
              if not isinstance(rows, list) or not rows:
                  out.write("No new eligible URLs were added in this run.\n")
              else:
                  for i, row in enumerate(rows, 1):
                      if not isinstance(row, dict):
                          continue
                      source = str(row.get("source_key") or "unknown")
                      title = " ".join(str(row.get("title") or "").split())[:110]
                      url = str(row.get("url") or "")
                      if url.startswith("https://"):
                          out.write(f"{i}. [{source} — {title}]({url})\n")
          PY
          fi
