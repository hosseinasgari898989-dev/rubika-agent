name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Required repository secret CLOUDFLARE_API_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployed Worker /api/health (read-only)
        shell: bash
        env:
          AGENT_API_BASE_URL: https://rubika-agent.h98609294.workers.dev
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/worker-health.json"
          http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --retry 3 --retry-delay 2 --output "$response_file" --write-out '%{http_code}' "$AGENT_API_BASE_URL/api/health")"
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Worker /api/health returned HTTP ${http_code:-unknown}."
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json, sys
          from pathlib import Path

          body = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if body.get("ok") is not True or body.get("service") != "rubika-agent":
              raise SystemExit("worker_health_contract_failed")
          if body.get("database") != "connected":
              raise SystemExit("worker_d1_connection_failed")
          if body.get("publishing") is not False:
              raise SystemExit("publishing_must_remain_disabled")
          print("Read-only /api/health confirmed Worker health, D1 connectivity, and publishing=false.")
          PY
          {
            echo "## Post-deploy read-only smoke"
            echo "- Commit SHA: $GITHUB_SHA"
            echo "- Endpoint: GET /api/health"
            echo "- Worker health: confirmed"
            echo "- D1 connection: confirmed"
            echo "- Publishing: disabled"
            echo "- AI requests, media downloads, Rubika posts: 0"
          } >> "$GITHUB_STEP_SUMMARY"
