name: Deploy Rubika-Agent Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-agent-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply rubika-agent-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker from this repository
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify live health and database status
        env:
          CONTROL_API_URL: https://rubika-agent-control.amber-harbor-f617.workers.dev
        run: |
          set -euo pipefail
          check_endpoint() {
            local endpoint="$1"
            local output="/tmp/response.json"
            for attempt in 1 2 3 4 5; do
              if curl --silent --show-error --fail "$endpoint" --output "$output" &&
                 node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(j.ok!==true) process.exit(1)' "$output"; then
                cat "$output"
                return 0
              fi
              echo "Attempt $attempt failed for $endpoint"
              [ ! -f "$output" ] || cat "$output"
              sleep 2
            done
            echo "::error::Health check failed for $endpoint"
            return 1
          }
          check_endpoint "$CONTROL_API_URL/health"
          check_endpoint "$CONTROL_API_URL/api/status"
